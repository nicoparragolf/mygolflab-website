<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Dashboard · MyGolfLab</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Barlow+Condensed:wght@400;500;600&family=Barlow:wght@300;400;500;600&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#0a0a0a; --card:#111111; --card-2:#161616; --line:#232323; --line-2:#333333;
  --tx:#f0f0f0; --tx-2:#9a9a9a; --tx-3:#6a6a6a;
  --teal:#2dd4bf; --gold:#D4C5A9;
  --ok:#22c55e; --leve:#eab308; --moderado:#f97316; --severo:#ef4444; --nulo:#2e2e2e;
}
*{margin:0;padding:0;box-sizing:border-box}
body{background:var(--bg);color:var(--tx);font-family:'Barlow',system-ui,sans-serif;font-size:15px;line-height:1.55;-webkit-font-smoothing:antialiased}
a{color:inherit;text-decoration:none}
button{font:inherit;color:inherit;background:none;border:none;cursor:pointer}
h1,h2{font-weight:400}

/* ---------- BARRA SUPERIOR (igual al resto del sitio) ---------- */
.nav{position:sticky;top:0;z-index:60;background:rgba(10,10,10,.93);backdrop-filter:blur(16px);border-bottom:1px solid var(--line)}
.nav-in{max-width:1200px;margin:0 auto;padding:0 24px;height:60px;display:flex;align-items:center;gap:16px}
.logo{font-family:'Bebas Neue',sans-serif;font-size:22px;letter-spacing:.05em;white-space:nowrap}
.logo em{font-style:normal;color:var(--teal)}
.menu{flex:1;display:flex;gap:22px;justify-content:center}
.menu a{font-family:'Barlow Condensed',sans-serif;text-transform:uppercase;letter-spacing:.1em;font-size:12.5px;font-weight:500;color:var(--tx-2);white-space:nowrap}
.menu a:hover{color:var(--tx)}
.menu a.on{color:var(--teal)}
.derecha{display:flex;align-items:center;gap:11px;position:relative}
.campana{color:var(--tx-2);position:relative;display:flex;padding:4px}
.campana:hover{color:var(--tx)}
.campana svg{width:19px;height:19px}
.punto{position:absolute;top:0;right:0;min-width:15px;height:15px;padding:0 3px;background:var(--severo);color:#fff;border-radius:99px;font-size:9.5px;font-weight:600;display:flex;align-items:center;justify-content:center;border:2px solid var(--bg);line-height:1}
.aro{width:32px;height:32px;border-radius:50%;background:var(--teal);color:#06251f;display:flex;align-items:center;justify-content:center;font-family:'Bebas Neue',sans-serif;font-size:13px;letter-spacing:.04em}
.enlace-nav{font-family:'Barlow Condensed',sans-serif;text-transform:uppercase;letter-spacing:.09em;font-size:12px;font-weight:600;color:var(--teal);white-space:nowrap}
.boton-nav{font-family:'Barlow Condensed',sans-serif;text-transform:uppercase;letter-spacing:.09em;font-size:12px;font-weight:600;background:var(--teal);color:#06251f;border-radius:7px;padding:8px 13px;white-space:nowrap}
.boton-nav:hover{background:#4fe0cf}
.pop{position:absolute;top:44px;right:0;width:280px;background:var(--card);border:1px solid var(--line-2);border-radius:12px;padding:7px;z-index:70;display:none;max-height:70vh;overflow-y:auto}
.pop.abierto{display:block}
.pop .titulo{padding:9px 11px 6px;font-family:'Barlow Condensed',sans-serif;text-transform:uppercase;letter-spacing:.13em;font-size:11px;color:var(--tx-3);font-weight:600}
.pop a,.pop button{display:block;width:100%;padding:9px 11px;border-radius:8px;font-size:14px;color:var(--tx-2);text-align:left}
.pop a:hover,.pop button:hover{background:var(--card-2);color:var(--tx)}
.pop .evento{padding:9px 11px;font-size:13px;color:var(--tx-2);line-height:1.45}
.pop .evento b{color:var(--tx);font-weight:600}
.pop .evento span{display:block;font-size:11px;color:var(--tx-3);margin-top:2px}
.hamb{display:none;color:var(--tx-2);padding:4px}
.hamb svg{width:22px;height:22px}

/* ---------- PÁGINA ---------- */
.wrap{max-width:1200px;margin:0 auto;padding:26px 24px 70px}

/* 1 · FOCO */
.foco{border:1px solid rgba(45,212,191,.4);border-radius:14px;padding:28px 30px;background:var(--card)}
.gorro{font-family:'Barlow Condensed',sans-serif;text-transform:uppercase;letter-spacing:.16em;font-size:11.5px;font-weight:600;color:var(--teal);display:block;margin-bottom:7px}
.foco .nombre{font-family:'Bebas Neue',sans-serif;font-size:52px;line-height:1;letter-spacing:.01em;margin-bottom:12px}
.foco .frase{font-size:16.5px;line-height:1.6;color:var(--tx-2);max-width:60ch;margin-bottom:22px;font-weight:300}
.puntos{display:flex;align-items:center;gap:9px;flex-wrap:wrap}
.pt{width:16px;height:16px;border-radius:50%;background:var(--nulo)}
.pt-ok{background:var(--ok)} .pt-leve{background:var(--leve)}
.pt-moderado{background:var(--moderado)} .pt-severo{background:var(--severo)}
.pt.hoy{box-shadow:0 0 0 2px var(--bg),0 0 0 4px var(--tx)}
.puntos .cap{font-size:13px;color:var(--tx-3);margin-left:6px}
.acciones{display:flex;gap:9px;flex-wrap:wrap;margin-top:24px}
.pill{border:1px solid var(--teal);color:var(--teal);border-radius:9px;padding:10px 15px;font-size:13.5px}
.pill:hover{background:rgba(45,212,191,.09)}
.pill-gris{border-color:var(--line-2);color:var(--tx-2)}
.pill-gris:hover{background:var(--card-2);color:var(--tx)}
.remate{margin-top:22px;padding-top:17px;border-top:1px solid var(--line);font-size:14px;color:var(--tx-2)}
.remate b{color:var(--ok);font-weight:600}
.receta{margin-top:16px;padding:14px 16px;background:var(--card-2);border-radius:10px;font-size:14px;color:var(--tx-2);display:none}
.receta.abierto{display:block}

/* 2 · TIRA */
.tira{display:flex;gap:26px;flex-wrap:wrap;padding:14px 4px 20px;font-size:13px;color:var(--tx-3)}
.tira b{color:var(--tx);font-weight:600}

/* 3-5 · PANELES */
.panel{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:20px 22px;margin-bottom:14px}
.rotulo{font-family:'Barlow Condensed',sans-serif;text-transform:uppercase;letter-spacing:.14em;font-size:11.5px;font-weight:600;color:var(--tx-3);display:block;margin-bottom:14px}
.cabecera{display:flex;justify-content:space-between;align-items:baseline;margin-bottom:14px}
.cabecera .rotulo{margin:0}
.verlink{font-family:'Barlow Condensed',sans-serif;text-transform:uppercase;letter-spacing:.1em;font-size:11.5px;font-weight:600;color:var(--teal)}

.fila{display:flex;align-items:center;gap:12px;padding:11px 0;border-bottom:1px solid var(--line)}
.fila:last-of-type{border-bottom:0}
.bolita{width:10px;height:10px;border-radius:50%;flex-shrink:0}
.fila .qn{font-size:15px;flex:1;min-width:0}
.fila .qs{font-size:13px;color:var(--tx-3);text-align:right}
.resumen{margin-top:12px;padding-top:13px;border-top:1px solid var(--line);font-size:13px;color:var(--tx-3)}

.duo{display:grid;grid-template-columns:1fr 1fr;gap:14px;margin-bottom:14px}
.linea{font-size:13.5px;color:var(--tx-2);line-height:1.5;padding:7px 0}
.linea + .linea{border-top:1px solid var(--line)}
.linea b{color:var(--tx);font-weight:600}
.linea span{color:var(--tx-3)}

.tres{display:grid;grid-template-columns:repeat(3,1fr);gap:12px}
.mini img,.mini .ph{width:100%;height:96px;border-radius:9px;object-fit:cover;background:var(--card-2);border:1px solid var(--line);display:flex;align-items:center;justify-content:center;color:var(--tx-3);font-size:12px}
.mini .pie{font-size:12.5px;color:var(--tx-3);margin-top:7px}
.mini .pie b{color:var(--gold);font-family:'Bebas Neue',sans-serif;font-size:16px;font-weight:400}

/* VACÍOS */
.vacio{border:1px dashed var(--line-2);border-radius:11px;padding:22px;text-align:center}
.vacio .t{font-family:'Barlow Condensed',sans-serif;text-transform:uppercase;letter-spacing:.11em;font-size:13px;font-weight:600;margin-bottom:6px}
.vacio .d{font-size:13.5px;color:var(--tx-2);max-width:420px;margin:0 auto}
.aviso{background:var(--card);border:1px solid var(--line-2);border-left:3px solid var(--gold);border-radius:0 12px 12px 0;padding:16px 20px;font-size:14px;margin-bottom:16px}
.aviso .t{font-family:'Barlow Condensed',sans-serif;text-transform:uppercase;letter-spacing:.13em;font-weight:600;font-size:12.5px;color:var(--gold);margin-bottom:4px}
.carga{position:fixed;inset:0;background:var(--bg);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:15px;z-index:200}
.carga.off{display:none}
.giro{width:28px;height:28px;border:3px solid var(--line);border-top-color:var(--teal);border-radius:50%;animation:g .8s linear infinite}
@keyframes g{to{transform:rotate(360deg)}}

@media (max-width:900px){
  .menu{position:absolute;top:60px;left:0;right:0;background:var(--card);border-bottom:1px solid var(--line);flex-direction:column;gap:0;padding:8px;display:none;justify-content:flex-start}
  .menu.abierto{display:flex}
  .menu a{padding:11px 12px;border-radius:8px;font-size:14px}
  .hamb{display:flex}
  .enlace-nav{display:none}
  .duo,.tres{grid-template-columns:1fr}
  .wrap{padding:18px 15px 55px}
  .foco{padding:22px}
  .foco .nombre{font-size:40px}
  .foco .frase{font-size:15.5px}
  .pop{width:min(290px,calc(100vw - 30px))}
}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
:focus-visible{outline:2px solid var(--teal);outline-offset:2px}
</style>
</head>
<body>

<div class="carga" id="carga"><div class="logo">MY<em>GOLF</em>LAB</div><div class="giro"></div></div>

<nav class="nav"><div class="nav-in">
  <span class="logo">MY<em>GOLF</em>LAB</span>
  <div class="menu" id="menu">
    <a href="/es/index.html">Inicio</a>
    <a href="/es/coach-ai.html">Coach IA</a>
    <a href="/es/training.html">Training Lab</a>
    <a href="/es/library.html">Biblioteca</a>
    <a href="/es/pricing.html">Planes</a>
    <a href="/es/about.html">Quiénes Somos</a>
  </div>
  <div class="derecha">
    <button class="hamb" id="bHamb" aria-label="Menu">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><line x1="4" y1="7" x2="20" y2="7"/><line x1="4" y1="12" x2="20" y2="12"/><line x1="4" y1="17" x2="20" y2="17"/></svg>
    </button>
    <button class="campana" id="bCampana" aria-label="Novedades">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M18 8A6 6 0 0 0 6 8c0 7-3 9-3 9h18s-3-2-3-9"/><path d="M13.73 21a2 2 0 0 1-3.46 0"/></svg>
      <span class="punto" id="punto" style="display:none">0</span>
    </button>
    <button class="aro" id="bAro" aria-label="Mi cuenta">&mdash;</button>
    <a class="enlace-nav" href="/es/dashboard.html">Mi Dashboard</a>
    <button class="boton-nav" id="bSalir">Cerrar Sesión</button>
    <div class="pop" id="popNovedades"></div>
    <div class="pop" id="popCuenta"></div>

</div></nav>

<div class="wrap" id="app"></div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.0/dist/umd/supabase.js"></script>
<script>
/* ============================================================
   MyGolfLab · Dashboard v3.0
   Cinco secciones. Sin matriz, sin tablero de ocho, sin gráficos
   que haya que descifrar. Todo sale de la base de datos.
   ============================================================ */

var CONFIG = {
  SUPABASE_URL:      'https://yulpqupmftdjbepqiscs.supabase.co',
  SUPABASE_ANON_KEY: 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Inl1bHBxdXBtZnRkamJlcHFpc2NzIiwicm9sZSI6ImFub24iLCJpYXQiOjE3NzQxNDA0NjYsImV4cCI6MjA4OTcxNjQ2Nn0.e-8SEni5uxUoigXCkVM2VYm7UrHYxxVl7hPsUrZvYao',
  DIAS_DATO_VIEJO: 21,

  /* Revisa que estas dos coincidan con tus archivos reales.
     Las demás las saqué de tu menú actual. */
  RUTAS: {
    inicio:'/es/index.html', coach:'/es/coach-ai.html', training:'/es/training.html',
    biblioteca:'/es/library.html', planes:'/es/pricing.html', nosotros:'/es/about.html',
    historial:'/es/historial.html', login:'/es/login.html'
  }
};

var COMPONENTES = ['cara','path','lowpoint','secuencia','postura','ground','conexion','distancia'];
var NOMBRES = { cara:'Cara del palo', path:'Path', lowpoint:'Punto bajo', secuencia:'Secuencia',
  postura:'Postura', ground:'Ground forces', conexion:'Conexión', distancia:'Distancia' };
var PESO = { ok:0, leve:1, moderado:2, severo:3 };
var FALLA = ['leve','moderado','severo'];
var NOMBRES_DRILLS = {};

var S = { sb:null, demo:false, sesion:null, nombre:'', analisis:[], estados:[], findings:[],
          drills:[], firmadas:{}, comp:{}, novedades:[], conclusiones:[] };

function el(i){ return document.getElementById(i); }
function esc(s){ return String(s==null?'':s).replace(/[&<>"]/g,function(c){
  return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]; }); }
function dias(a,b){ return Math.round((new Date(b)-new Date(a))/86400000); }
function hace(d){
  var n = dias(d, new Date());
  if(n <= 0) return 'hoy';
  if(n === 1) return 'ayer';
  if(n < 7) return 'hace ' + n + ' días';
  if(n < 31){ var s = Math.round(n/7); return 'hace ' + s + (s===1?' semana':' semanas'); }
  var m = Math.round(n/30); return 'hace ' + m + (m===1?' mes':' meses');
}
function iniciales(n){
  return String(n||'').split(' ').filter(Boolean).slice(0,2)
    .map(function(w){ return w[0].toUpperCase(); }).join('') || 'MG';
}

/* ---------- carga ---------- */
async function cargar(){
  S.sb = window.supabase.createClient(CONFIG.SUPABASE_URL, CONFIG.SUPABASE_ANON_KEY);
  var ses = await S.sb.auth.getSession();
  S.sesion = ses.data.session;
  if(!S.sesion) return false;
  var uid = S.sesion.user.id, m = S.sesion.user.user_metadata || {};
  S.nombre = m.full_name || [m.first_name, m.last_name].filter(Boolean).join(' ') ||
             S.sesion.user.email.split('@')[0];

  var an = await S.sb.from('swing_analyses')
    .select('id,created_at,camera_angle,score,resumen,frame_paths,prompt_version')
    .eq('user_id', uid).order('created_at',{ascending:false});
  if(an.error) throw an.error;
  S.analisis = an.data || [];

  var st = await S.sb.from('swing_component_states').select('analysis_id,componente,estado').eq('user_id', uid);
  if(st.error) throw st.error;
  S.estados = st.data || [];

  var fi = await S.sb.from('swing_findings')
    .select('id,analysis_id,orden,componente,severidad,titulo,que_pasa,como_corregirlo')
    .eq('user_id', uid).order('orden',{ascending:true});
  if(fi.error) throw fi.error;
  S.findings = fi.data || [];

  if(S.findings.length){
    var dr = await S.sb.from('finding_drills').select('finding_id,drill_id,orden')
      .in('finding_id', S.findings.map(function(f){ return f.id; }));
    S.drills = dr.data || [];
  }
  var rutas = [];
  S.analisis.slice(0,3).forEach(function(a){
    (a.frame_paths||[]).slice(0,1).forEach(function(p){ if(p) rutas.push(p); });
  });
  if(rutas.length){
    try{
      var r = await S.sb.storage.from('swing-frames').createSignedUrls(rutas, 3600);
      (r.data||[]).forEach(function(x){ if(x.signedUrl) S.firmadas[x.path] = x.signedUrl; });
    }catch(e){ console.warn('[MGL] frames sin firmar:', e.message); }
  }
  return true;
}

/* ---------- cálculo ---------- */
function validos(){
  return S.analisis.filter(function(a){
    return String(a.prompt_version||'').toLowerCase().indexOf('migrado') === -1;
  });
}
function ordenAsc(){
  return validos().slice().sort(function(a,b){ return new Date(a.created_at)-new Date(b.created_at); });
}
function mapa(){
  var m = {};
  S.estados.forEach(function(e){
    if(!m[e.analysis_id]) m[e.analysis_id] = {};
    m[e.analysis_id][e.componente] = e.estado;
  });
  return m;
}
function episodios(serie){
  var eps = [], ab = null, oks = 0;
  serie.forEach(function(p){
    if(FALLA.indexOf(p.estado) > -1){
      if(!ab) ab = { inicio:p.fecha, fin:null, pico:p.estado };
      if(PESO[p.estado] > PESO[ab.pico]) ab.pico = p.estado;
      oks = 0;
    } else {
      oks++;
      if(ab && oks >= 2){ ab.fin = p.fecha; eps.push(ab); ab = null; }
    }
  });
  if(ab) eps.push(ab);
  return eps;
}
function calcular(){
  var lista = ordenAsc(), m = mapa();
  S.comp = {};
  COMPONENTES.forEach(function(c){
    var serie = [];
    lista.forEach(function(a){
      var e = (m[a.id]||{})[c];
      if(e && e !== 'no_evaluable') serie.push({ fecha:a.created_at, estado:e });
    });
    var u3 = serie.slice(-3);
    var o = { serie:serie, actual: serie.length ? serie[serie.length-1].estado : null,
      total: serie.length,
      fallas3: u3.filter(function(x){ return FALLA.indexOf(x.estado)>-1; }).length,
      serias3: u3.filter(function(x){ return x.estado==='moderado'||x.estado==='severo'; }).length,
      ciclo: episodios(serie) };
    o.confirmado = o.fallas3 >= 2;
    S.comp[c] = o;
  });
}
function cerradas(){
  var n = 0;
  COMPONENTES.forEach(function(c){
    n += S.comp[c].ciclo.filter(function(e){ return e.fin; }).length;
  });
  return n;
}
function activas(){
  return COMPONENTES.filter(function(c){
    return S.comp[c].actual && FALLA.indexOf(S.comp[c].actual) > -1;
  }).sort(function(a,b){
    var A=S.comp[a], B=S.comp[b];
    return ((B.confirmado?100:0)+PESO[B.actual]*10+B.serias3) -
           ((A.confirmado?100:0)+PESO[A.actual]*10+A.serias3);
  });
}
function tendencia(c){
  var s = S.comp[c].serie;
  if(s.length === 1) return 'primera lectura';
  var ult = PESO[s[s.length-1].estado], ant = PESO[s[s.length-2].estado];
  if(s.length >= 3){
    var a = PESO[s[s.length-3].estado];
    if(ult > ant && ant > a) return 'va empeorando';
    if(ult < ant && ant < a) return 'va mejorando';
  }
  if(ult > ant) return 'va empeorando';
  if(ult < ant) return 'va mejorando';
  return 'estable';
}
function comentarioFila(c){
  var i = S.comp[c], eps = i.ciclo;
  if(eps.length > 1 && eps[eps.length-1].fin === null) return 'reapareció tras estar limpia';
  var t = tendencia(c);
  if(t === 'va empeorando' && i.total >= 3) return 'empeorando · 3 análisis seguidos';
  if(t === 'va empeorando') return 'empeorando';
  if(t === 'va mejorando') return 'mejorando';
  if(i.confirmado) return 'confirmada · falló en ' + i.fallas3 + ' de ' + Math.min(i.total,3);
  if(i.total < 2) return 'por confirmar · 1 lectura';
  return 'estable';
}
function ultimaFecha(){ var v = ordenAsc(); return v.length ? v[v.length-1].created_at : null; }
function focoActual(){
  var a = activas();
  if(!a.length) return null;
  var c = a[0];
  var ord = validos().slice().sort(function(x,y){ return new Date(y.created_at)-new Date(x.created_at); });
  var f = null;
  for(var i=0;i<ord.length && !f;i++){
    var mm = S.findings.filter(function(x){ return x.analysis_id===ord[i].id && x.componente===c; });
    if(mm.length) f = mm[0];
  }
  return { componente:c, info:S.comp[c], finding:f,
    drills: f ? S.drills.filter(function(d){ return d.finding_id===f.id; })
                        .sort(function(x,y){ return (x.orden||0)-(y.orden||0); }) : [] };
}

/* ---------- textos derivados ---------- */
function calcularConclusiones(){
  var out = [], n = validos().length;
  COMPONENTES.forEach(function(c){
    var i = S.comp[c], eps = i.ciclo;
    if(!eps.length) return;
    eps.filter(function(e){ return e.fin; }).forEach(function(e){
      out.push({ peso:70, tx:'<b>'+NOMBRES[c]+'</b> cerrada. Llegó a ser '+
        (e.pico==='severo'?'severa':e.pico==='moderado'?'moderada':'leve')+
        ' y tardó '+dias(e.inicio,e.fin)+' días en desaparecer.' });
    });
    if(eps.length > 1 && eps[eps.length-1].fin === null){
      out.push({ peso:90, tx:'<b>'+NOMBRES[c]+'</b> volvió tras estar limpia dos análisis.' });
    }
    if(i.total >= 3 && tendencia(c) === 'va empeorando'){
      out.push({ peso:95, tx:'<b>'+NOMBRES[c]+'</b> lleva tres análisis empeorando seguidos.' });
    }
  });
  var sin = COMPONENTES.filter(function(c){ return S.comp[c].total === 0; });
  if(sin.length >= 3 && n > 0)
    out.push({ peso:60, tx:'Un video desde el otro ángulo cubriría <b>'+sin.length+
      ' componentes</b> que nunca se han evaluado.' });
  if(n > 0 && n < 3)
    out.push({ peso:50, tx:'Con '+n+' análisis nada está confirmado. La regla de 2 de 3 necesita <b>'+
      (3-n)+' más</b>.' });
  var u = ultimaFecha();
  if(u && dias(u, new Date()) > CONFIG.DIAS_DATO_VIEJO)
    out.push({ peso:100, tx:'Tu última medición fue <b>'+hace(u)+'</b>. Los datos están envejeciendo.' });
  out.sort(function(a,b){ return b.peso - a.peso; });
  S.conclusiones = out.slice(0,3);
}

function calcularNovedades(){
  var out = [];
  S.analisis.forEach(function(a){
    out.push({ fecha:a.created_at, tx:'Análisis subido · <b>'+
      (a.camera_angle==='dtl'?'down the line':'de frente')+'</b>' });
  });
  S.findings.forEach(function(f){
    var a = S.analisis.filter(function(x){ return x.id===f.analysis_id; })[0];
    if(!a) return;
    var nd = S.drills.filter(function(d){ return d.finding_id===f.id; }).length;
    if(nd) out.push({ fecha:a.created_at, tx:nd+(nd===1?' drill recomendado':' drills recomendados')+
      ' para <b>'+esc(NOMBRES[f.componente]||f.componente)+'</b>' });
  });
  COMPONENTES.forEach(function(c){
    S.comp[c].ciclo.filter(function(e){ return e.fin; }).forEach(function(e){
      out.push({ fecha:e.fin, tx:'<b>'+NOMBRES[c]+'</b> se dio por resuelta' });
    });
  });
  out.sort(function(a,b){ return new Date(b.fecha) - new Date(a.fecha); });
  S.novedades = out.slice(0,10);
}
function sinVer(){
  var t = 0;
  try{ t = parseInt(localStorage.getItem('mgl_visto') || '0', 10) || 0; }catch(e){}
  return S.novedades.filter(function(x){ return new Date(x.fecha).getTime() > t; }).length;
}

/* ============================================================
   Render
   ============================================================ */
function render(){
  calcular(); calcularConclusiones(); calcularNovedades();
  var n = validos().length;
  var h = seccionFoco(focoActual(), n) + seccionTira(n) + seccionEstado(n) +
          seccionDuo(n) + seccionAnalisis();
  el('app').innerHTML = h;
  el('bAro').textContent = iniciales(S.nombre);
  pintarPopups();
  var r = el('bReceta');
  if(r) r.addEventListener('click', function(){ el('receta').classList.toggle('abierto'); });
  var v = sinVer();
  if(v > 0){ el('punto').textContent = v > 9 ? '9+' : v; el('punto').style.display = 'flex'; }
}

/* 1 · FOCO */
function seccionFoco(f, n){
  if(n === 0)
    return '<div class="foco"><span class="gorro">Tu foco de hoy</span>'+
      '<div class="nombre">Sin definir</div><div class="frase">Sube tu primer swing y acá va a quedar '+
      'un solo componente en el que trabajar, con sus drills. Toma menos de un minuto.</div>'+
      '<div class="acciones"><a class="pill" href="'+CONFIG.RUTAS.coach+'">Analizar un swing</a></div></div>';

  if(!f)
    return '<div class="foco"><span class="gorro">Tu foco de hoy</span>'+
      '<div class="nombre">Todo sólido</div><div class="frase">Ningún componente evaluado muestra falla. '+
      'Sostén el patrón y vuelve a medir en unos días para confirmar que se mantiene.</div>'+
      '<div class="acciones"><a class="pill" href="'+CONFIG.RUTAS.coach+'">Volver a medir</a></div></div>';

  var i = f.info, fi = f.finding;
  var certeza = i.confirmado
    ? ' Falló en tus últimos '+i.fallas3+' análisis, así que ya no es casualidad.'
    : (i.total < 2 ? ' Es una sola lectura: vuelve a medir para confirmarlo.'
                   : ' Todavía sin confirmar: una medición más y sabemos si es patrón.');

  var serie = i.serie.slice(-5);
  var puntos = serie.map(function(p,k){
    return '<span class="pt pt-'+p.estado+(k===serie.length-1?' hoy':'')+'"></span>';
  }).join('');
  var cap = serie.length === 1 ? 'primera lectura'
          : 'últimos '+serie.length+' análisis · '+tendencia(f.componente);

  var h = '<div class="foco"><span class="gorro">Tu foco de hoy</span>'+
    '<div class="nombre">'+esc(NOMBRES[f.componente])+'</div>'+
    '<div class="frase">'+esc(fi && fi.que_pasa ? fi.que_pasa : (fi && fi.titulo ? fi.titulo : ''))+
    certeza+'</div>'+
    '<div class="puntos">'+puntos+'<span class="cap">'+cap+'</span></div><div class="acciones">';

  f.drills.slice(0,2).forEach(function(d){
    h += '<a class="pill" href="'+CONFIG.RUTAS.biblioteca+'#'+encodeURIComponent(d.drill_id)+'">'+
         esc(NOMBRES_DRILLS[d.drill_id] || d.drill_id)+'</a>';
  });
  if(fi && fi.como_corregirlo) h += '<button class="pill pill-gris" id="bReceta">Cómo corregirlo</button>';
  h += '</div>';
  if(fi && fi.como_corregirlo)
    h += '<div class="receta" id="receta">'+esc(fi.como_corregirlo)+'</div>';

  var c = cerradas();
  if(c > 0)
    h += '<div class="remate">Ya cerraste <b>'+c+(c===1?' falla':' fallas')+
         '</b> desde que empezaste. Esta es la '+(c+1)+'ª.</div>';
  return h + '</div>';
}

/* 2 · TIRA */
function seccionTira(n){
  var a = activas().length, u = ultimaFecha();
  var sin = COMPONENTES.filter(function(c){ return S.comp[c].total === 0; }).length;
  var p = [];
  p.push('<b>'+a+'</b> '+(a===1?'falla activa':'fallas activas'));
  p.push('<b>'+n+'</b> '+(n===1?'análisis':'análisis'));
  if(u) p.push('última medición <b>'+hace(u)+'</b>');
  if(sin) p.push(sin+' '+(sin===1?'componente sin datos':'componentes sin datos'));
  return '<div class="tira"><span>'+p.join('</span><span>')+'</span></div>';
}

/* 3 · ESTADO */
function seccionEstado(n){
  if(n === 0) return '';
  var act = activas();
  var c = cerradas();
  var sin = COMPONENTES.filter(function(x){ return S.comp[x].total === 0; }).length;
  var h = '<div class="panel"><span class="rotulo">Tu estado</span>';

  if(!act.length){
    h += '<div class="vacio"><div class="t">Ninguna falla activa</div><div class="d">'+
         'Todos los componentes que se pudieron evaluar están sólidos.</div></div>';
  } else {
    act.forEach(function(x){
      h += '<div class="fila"><span class="bolita" style="background:var(--'+S.comp[x].actual+')"></span>'+
           '<span class="qn">'+esc(NOMBRES[x])+'</span>'+
           '<span class="qs">'+comentarioFila(x)+'</span></div>';
    });
  }
  var r = [];
  if(c) r.push(c+(c===1?' cerrada':' cerradas'));
  if(sin) r.push(sin+(sin===1?' componente sin datos suficientes':' componentes sin datos suficientes'));
  h += '<div class="resumen">'+(r.length ? r.join(' · ')+' · ' : '')+
       '<a class="verlink" style="text-transform:none;letter-spacing:0;font-size:13px" href="'+
       CONFIG.RUTAS.historial+'">ver todo en el historial</a></div>';
  return h + '</div>';
}

/* 4 · CONCLUSIONES Y NOVEDADES */
function seccionDuo(n){
  if(n === 0) return '';
  var a = '<div class="panel" style="margin:0"><span class="rotulo">Progreso inteligente</span>';
  if(!S.conclusiones.length){
    a += '<div class="linea"><span>Todavía sin conclusiones. Aparecen a partir del segundo análisis.</span></div>';
  } else {
    S.conclusiones.forEach(function(x){ a += '<div class="linea">'+x.tx+'</div>'; });
  }
  a += '</div>';

  var b = '<div class="panel" style="margin:0"><span class="rotulo">Actividad reciente</span>';
  if(!S.novedades.length){
    b += '<div class="linea"><span>Sin movimiento todavía.</span></div>';
  } else {
    S.novedades.slice(0,3).forEach(function(x){
      b += '<div class="linea">'+x.tx+' <span>— '+hace(x.fecha)+'</span></div>';
    });
  }
  b += '</div>';
  return '<div class="duo">'+a+b+'</div>';
}

/* 5 · ÚLTIMOS ANÁLISIS */
function seccionAnalisis(){
  var lista = S.analisis.slice().sort(function(a,b){ return new Date(b.created_at)-new Date(a.created_at); });
  var h = '<div class="panel"><div class="cabecera"><span class="rotulo">Tus últimos análisis</span>'+
          '<a class="verlink" href="'+CONFIG.RUTAS.historial+'">Ver historial completo</a></div>';
  if(!lista.length)
    return h + '<div class="vacio"><div class="t">Sin análisis todavía</div><div class="d">'+
      'Cada swing que subas queda guardado con sus frames.</div></div></div>';
  h += '<div class="tres">';
  lista.slice(0,3).forEach(function(a){
    var p = (a.frame_paths||[])[0], u = p ? S.firmadas[p] : null;
    h += '<a class="mini" href="'+CONFIG.RUTAS.historial+'">'+
      (u ? '<img src="'+esc(u)+'" alt="Frame del análisis">' : '<div class="ph">Sin frame</div>')+
      '<div class="pie">'+hace(a.created_at)+(a.score!=null?' · <b>'+a.score+'</b>':'')+'</div></a>';
  });
  return h + '</div></div>';
}

/* ---------- barra superior ---------- */
function pintarPopups(){
  var h = '<div class="titulo">Novedades</div>';
  if(!S.novedades.length){
    h += '<div class="evento">Nada nuevo por ahora.</div>';
  } else {
    S.novedades.slice(0,8).forEach(function(x){
      h += '<div class="evento">'+x.tx+'<span>'+hace(x.fecha)+'</span></div>';
    });
  }
  el('popNovedades').innerHTML = h;

  el('popCuenta').innerHTML = '<div class="titulo">'+esc(S.nombre)+'</div>'+
    '<a href="'+CONFIG.RUTAS.historial+'">Historial del Coach IA</a>'+
    '<a href="'+CONFIG.RUTAS.coach+'">Analizar un swing</a>'+
    '<a href="'+CONFIG.RUTAS.planes+'">Mi plan</a>';
}

function enlazarBarra(){
  function cerrar(){
    el('popNovedades').classList.remove('abierto');
    el('popCuenta').classList.remove('abierto');
  }
  el('bCampana').addEventListener('click', function(e){
    e.stopPropagation();
    var a = el('popNovedades').classList.contains('abierto');
    cerrar();
    if(!a){
      el('popNovedades').classList.add('abierto');
      try{ localStorage.setItem('mgl_visto', String(Date.now())); }catch(x){}
      el('punto').style.display = 'none';
    }
  });
  el('bAro').addEventListener('click', function(e){
    e.stopPropagation();
    var a = el('popCuenta').classList.contains('abierto');
    cerrar(); if(!a) el('popCuenta').classList.add('abierto');
  });
  el('bHamb').addEventListener('click', function(e){
    e.stopPropagation(); el('menu').classList.toggle('abierto');
  });
  el('bSalir').addEventListener('click', async function(){
    if(S.sb) await S.sb.auth.signOut();
    location.href = CONFIG.RUTAS.login;
  });
  document.addEventListener('click', cerrar);
  document.addEventListener('keydown', function(e){ if(e.key === 'Escape') cerrar(); });
}

/* ---------- demo ---------- */
function cargarDemo(q){
  S.demo = true;
  S.nombre = 'Gabriel Morgan';
  var lim = (q && q.get('n')) ? parseInt(q.get('n'),10) : null;
  var hoy = new Date();
  function atras(d){ var x = new Date(hoy); x.setDate(hoy.getDate()-d); return x.toISOString(); }

  var guion = [
    { d:68, sc:52, ang:'face', est:{postura:'severo',secuencia:'moderado',cara:'leve',path:'ok'} },
    { d:57, sc:55, ang:'face', est:{postura:'severo',secuencia:'moderado',cara:'ok',path:'ok'} },
    { d:44, sc:58, ang:'dtl',  est:{postura:'moderado',secuencia:'leve',cara:'ok',path:'leve',lowpoint:'moderado'} },
    { d:33, sc:63, ang:'face', est:{postura:'leve',secuencia:'ok',cara:'ok',path:'leve',lowpoint:'leve'} },
    { d:21, sc:67, ang:'dtl',  est:{postura:'ok',secuencia:'ok',cara:'ok',path:'moderado',lowpoint:'leve'} },
    { d:11, sc:66, ang:'face', est:{postura:'ok',secuencia:'leve',cara:'ok',path:'moderado',lowpoint:'ok'} },
    { d:3,  sc:71, ang:'dtl',  est:{postura:'ok',secuencia:'moderado',cara:'ok',path:'severo',lowpoint:'ok'} }
  ];
  var res = ['Pérdida de postura marcada en la bajada.','Mismo patrón de postura, algo más contenido.',
    'La postura mejora. Punto bajo inconsistente.','Postura casi resuelta. El path se va hacia adentro.',
    'Postura estable. El path es lo dominante.','La secuencia se adelanta levemente.',
    'Secuencia reincidente y path severo.'];
  if(lim && lim > 0 && lim < guion.length){ guion = guion.slice(-lim); res = res.slice(-lim); }

  S.analisis = []; S.estados = []; S.findings = []; S.drills = [];
  guion.forEach(function(g,i){
    var id = 'demo-'+i;
    S.analisis.push({ id:id, created_at:atras(g.d), camera_angle:g.ang, score:g.sc,
      resumen:res[i], frame_paths:[], prompt_version:'v3.0' });
    COMPONENTES.forEach(function(c){
      S.estados.push({ analysis_id:id, componente:c, estado: g.est[c] || 'no_evaluable' });
    });
  });
  var ult = S.analisis[S.analisis.length-1].id;
  S.findings.push({ id:'f1', analysis_id:ult, orden:1, componente:'path', severidad:'severo',
    titulo:'Path hacia adentro en la bajada',
    que_pasa:'El palo entra por dentro del plano y obliga a las manos a corregir en el impacto.',
    como_corregirlo:'Sensación de que el mango apunta a la bola más tiempo en la bajada, sin tirar del brazo derecho hacia el cuerpo. Diez swings lentos antes de cada sesión.' });
  S.findings.push({ id:'f2', analysis_id:ult, orden:2, componente:'secuencia', severidad:'moderado',
    titulo:'La pelvis y el torso arrancan juntos',
    que_pasa:'El torso se adelanta a la pelvis al iniciar la bajada.',
    como_corregirlo:'Iniciar la bajada con el pie delantero apretando el suelo.' });
  S.drills = [
    { finding_id:'f1', drill_id:'path-plano-alineado', orden:1 },
    { finding_id:'f1', drill_id:'palo-paralelo-tee', orden:2 },
    { finding_id:'f2', drill_id:'step-drill-secuencia', orden:1 }
  ];
  NOMBRES_DRILLS['path-plano-alineado']  = 'Plano alineado con bastón guía';
  NOMBRES_DRILLS['palo-paralelo-tee']    = 'Palo paralelo con tee';
  NOMBRES_DRILLS['step-drill-secuencia'] = 'Step drill de secuencia';
}

/* ---------- autotest ---------- */
function MGL_DASHBOARD_TEST(){
  var r = [];
  function t(n,ok,d){ r.push({ prueba:n, resultado: ok?'OK':'REVISAR', detalle:d }); }
  t('Sesión activa', S.demo || !!S.sesion, S.sesion ? S.sesion.user.email : (S.demo?'demo':'sin sesión'));
  t('Análisis cargados', S.analisis.length > 0, S.analisis.length+' filas');
  t('Estados de componentes', S.estados.length > 0, S.estados.length+' filas');
  t('Proporción 8 por análisis', S.analisis.length===0 || S.estados.length===S.analisis.length*8,
    S.estados.length+' vs '+(S.analisis.length*8));
  t('Diagnósticos narrados', S.findings.length > 0, S.findings.length+' filas');
  t('Migrados excluidos', true, (S.analisis.length-validos().length)+' excluidos');
  t('Foco definido', true, focoActual() ? NOMBRES[focoActual().componente] : 'sin falla activa');
  t('Puntos de evolución', S.analisis.length===0 || document.querySelectorAll('.pt').length > 0,
    document.querySelectorAll('.pt').length+' puntos');
  t('Fallas activas listadas', true, activas().length+' filas');
  t('Conclusiones', S.analisis.length===0 || S.conclusiones.length > 0, S.conclusiones.length);
  t('Novedades', S.analisis.length===0 || S.novedades.length > 0, S.novedades.length+' eventos');
  t('Secciones en pantalla', document.querySelectorAll('.foco,.panel').length >= 3,
    document.querySelectorAll('.foco,.panel').length+' de 5');
  t('Menú de cuenta enlazado', !!el('popCuenta').innerHTML, '');

  console.log('%c MGL DASHBOARD v3.0 — AUTOTEST ','background:#2dd4bf;color:#06251f;font-weight:bold');
  console.table(r);
  var e = {};
  COMPONENTES.forEach(function(c){
    e[c] = { estado:S.comp[c].actual||'sin datos', lecturas:S.comp[c].total,
      tendencia: S.comp[c].total ? tendencia(c) : '—', confirmado:S.comp[c].confirmado };
  });
  console.log('Estado por componente:'); console.table(e);
  var f = r.filter(function(x){ return x.resultado === 'REVISAR'; });
  if(!f.length) console.log('%c Todo correcto. ','background:#22c55e;color:#04210e');
  else console.warn('Revisar: '+f.map(function(x){ return x.prueba; }).join(', '));
  return r;
}
window.MGL_DASHBOARD_TEST = MGL_DASHBOARD_TEST;
window.MGL = { estado:S, render:function(){ render(); }, test:MGL_DASHBOARD_TEST };

/* ---------- arranque ---------- */
(async function(){
  enlazarBarra();
  var q = new URLSearchParams(location.search);
  if(q.get('demo') === '1'){
    cargarDemo(q); render(); el('carga').classList.add('off'); MGL_DASHBOARD_TEST(); return;
  }
  if(!window.supabase || !window.supabase.createClient){
    el('carga').classList.add('off');
    el('app').innerHTML = '<div class="aviso"><div class="t">No cargó la librería</div>'+
      'No se pudo descargar el cliente de Supabase. Revisa la conexión y recarga.</div>';
    return;
  }
  try{
    var hay = await cargar();
    if(!hay){ location.href = CONFIG.RUTAS.login; return; }
    render();
  }catch(e){
    el('app').innerHTML = '<div class="aviso"><div class="t">No se pudieron leer los datos</div>'+
      esc(e.message||'Error desconocido')+'</div>';
    console.error('[MGL] Error cargando el dashboard:', e);
  }
  el('carga').classList.add('off');
  MGL_DASHBOARD_TEST();
})();
</script>
