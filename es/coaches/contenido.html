  @media(max-width:1000px){

    .nav-links{display:none}

    .nav-links.open .nav-sep{display:none}

    .pi .th{width:40px}
  }
</style>
</head>

function pubUrl(p){ return p ? SUPABASE_URL+'/storage/v1/object/public/'+BUCKET_PUB+'/'+p.split('/').map(encodeURIComponent).join('/') : ''; }
function ini(n){ var p=String(n||'?').trim().split(/\s+/); return ((p[0]||'?').charAt(0)+((p[1]||'').charAt(0))).toUpperCase(); }
function fmtDur(s){ s=Math.round(Number(s)||0); if(!s) return ''; var m=Math.floor(s/60), r=s%60; return m+':'+('0'+r).slice(-2); }
function fmtTotal(s){ s=Math.round(Number(s)||0); if(!s) return ''; if(s<60) return s+' s'; var m=Math.round(s/60); if(m<60) return m+' min'; return Math.floor(m/60)+' h'+(m%60?' '+(m%60)+' min':''); }
function avHTML(co, cls){
  co=co||{};
  return '<span class="av'+(cls?' '+cls:'')+'">'+(co.photo_path?'<img src="'+esc(pubUrl(co.photo_path))+'" alt="">':esc(ini(co.display_name||'Coach')))+'</span>';
}

var ICON_LOCK='<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="4" y="11" width="16" height="10" rx="2"/><path d="M8 11V7a4 4 0 018 0v4"/></svg>';
var ICON_OK='<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="10"/><path d="M8 12l3 3 5-6"/></svg>';
var ICON_SHIELD='<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 22s8-4 8-10V5l-8-3-8 3v7c0 6 8 10 8 10z"/><path d="M9 12l2 2 4-4"/></svg>';

function hasAccess(cid){
  var col = cid===(C&&C.id) ? C : COLS.filter(function(x){ return x.id===cid; })[0];
  if(SESSION && col && col.coach_id===SESSION.user.id) return true;
  var p=MYP[cid]; return !!(p && (p.status==='pagado' || p.status==='otorgado'));
}
function coverHTML(c, items, badge){
  var n=(items||[]).length, dur=(items||[]).reduce(function(a,i){ return a+(Number(i.duration_sec)||0); },0);
  var first=(items||[]).filter(function(i){ return i.thumb_path; })[0];
  var img = c.cover_path ? '<img src="'+esc(pubUrl(c.cover_path))+'" alt="" loading="lazy">'
          : (first ? '<img src="'+esc(pubUrl(first.thumb_path))+'" alt="" loading="lazy">' : '<div class="ph">'+ICON_FILM+'</div>');
  return '<div class="cover">'+img+(badge||'')+(n?'<span class="cnt">'+n+' video'+(n===1?'':'s')+(dur?' · '+fmtTotal(dur):'')+'</span>':'')+'</div>';
}

async function init(){
  var s=await sb.auth.getSession();
  SESSION = s.data && s.data.session;
  if(SESSION){ var a=$('navAuthBtn'); a.textContent='Mi Coach Hub'; a.href='/es/coachhub/dashboard.html'; }
  sb.from('mgl_pagos_config').select('service_fee_pct').eq('id',1).maybeSingle().then(function(r){
    if(r && r.data && r.data.service_fee_pct!=null) FEE_PCT=Number(r.data.service_fee_pct);
  });
  if(QP.get('c')) await loadDetail(QP.get('c'));
  else await loadCatalog();
}

async function loadMine(ids){
  MYP={};
  if(!SESSION || !ids.length) return;
  var r=await sb.from('content_purchases').select('id,collection_id,status').eq('student_id',SESSION.user.id).in('collection_id',ids);
  (r.data||[]).forEach(function(p){ MYP[p.collection_id]=p; });
}
async function loadCoaches(ids){
  ids=ids.filter(function(v,i,a){ return v && a.indexOf(v)===i && !COACHES[v]; });
  if(!ids.length) return;
  var r=await sb.from('coach_profiles').select('coach_id,display_name,slug,photo_path,headline').in('coach_id',ids);
  (r.data||[]).forEach(function(x){ COACHES[x.coach_id]=x; });
}

async function loadCatalog(){
  var q=sb.from('coach_collections').select('*').eq('is_published',true).order('published_at',{ascending:false}).limit(300);
  var coach=QP.get('coach');
  if(coach) q=q.eq('coach_id',coach);
  var r=await q;
  if(r.error){
    $('wrap').innerHTML='<div class="loading">El contenido exclusivo se está activando. Vuelve pronto.<br><br><a href="/es/coaches/">Ver coaches →</a></div>';
    return;
  }
  COLS=r.data||[];
  var ids=COLS.map(function(c){ return c.id; });
  ITEMS={};
  if(ids.length){
    var ri=await sb.from('coach_collection_items').select('collection_id,duration_sec,thumb_path,sort_order').in('collection_id',ids).order('sort_order');
    (ri.data||[]).forEach(function(i){ (ITEMS[i.collection_id]=ITEMS[i.collection_id]||[]).push(i); });
  }
  // solo colecciones con videos
  COLS=COLS.filter(function(c){ return (ITEMS[c.id]||[]).length; });
  await loadCoaches(COLS.map(function(c){ return c.coach_id; }).concat(coach?[coach]:[]));
  await loadMine(ids);
  MGL_PRECIO.listo(renderCatalog);
}

function renderCatalog(){
  var coach=QP.get('coach'), co=coach?COACHES[coach]:null;
  var h='';
  if(coach) h+='<a class="back" href="'+(co&&co.slug?'/es/coaches/perfil.html?c='+encodeURIComponent(co.slug):'/es/coaches/')+'">‹ '+(co?esc(co.display_name):'Volver')+'</a>';
  h+='<div class="cat-hero"><div class="k">Contenido exclusivo</div>'
    + '<h1>'+(co?'Los tips de '+esc(co.display_name):'Aprende de los mejores coaches')+'</h1>'
    + '<p>Colecciones de tips en video, grabadas por coaches profesionales. Pagas una vez y son tuyas para siempre: velas desde el celular, en la cancha o en el range.</p>'
    + '</div>';
  var areas=AREAS.filter(function(a){ return COLS.some(function(c){ return c.area===a[0]; }); });
  if(areas.length>1){
    h+='<div class="filters"><span class="chip'+(FILTER==='todas'?' on':'')+'" onclick="FILTER=\'todas\';renderCatalog()">Todos</span>'
      + areas.map(function(a){ return '<span class="chip'+(FILTER===a[0]?' on':'')+'" onclick="FILTER=\''+a[0]+'\';renderCatalog()">'+a[1]+'</span>'; }).join('')+'</div>';
  } else h+='<div style="height:22px"></div>';

  var list=COLS.filter(function(c){ return FILTER==='todas' || c.area===FILTER; });
  if(!list.length){
    h+='<div class="empty"><h3>Muy pronto</h3>'+(co?esc(co.display_name)+' todavía no publica contenido.':'Los coaches están preparando sus primeras colecciones.')+'<br><br><a href="/es/coaches/">Mientras tanto, conoce a los coaches →</a></div>';
  } else {
    h+='<div class="grid">';
    list.forEach(function(c){
      var co2=COACHES[c.coach_id]||{}, mine=hasAccess(c.id);
      var alt=mine?'':MGL_PRECIO.otra(c.price,c.currency);
      h+='<a class="cc" href="/es/coaches/contenido.html?c='+encodeURIComponent(c.id)+'">'
        + coverHTML(c, ITEMS[c.id], mine?'<span class="badge">Tuya</span>':'')
        + '<div class="bd"><div class="ar">'+esc(areaName(c.area))+(c.level&&c.level!=='todos'?' · '+esc(LEVELS[c.level]||''):'')+'</div>'
        + '<h3>'+esc(c.title)+'</h3>'
        + '<div class="by">'+avHTML(co2)+'<span>'+esc(co2.display_name||'Coach')+'</span></div>'
        + '<div class="ft"><span class="pr">'+(mine?'Ver':MGL_PRECIO.mostrar(c.price,c.currency))+'</span>'+(alt?'<span class="alt">'+esc(alt)+'</span>':'')+'</div></div></a>';
    });
    h+='</div>';
    if(list.some(function(c){ return Number(c.price)>0; })) h+='<div class="cur">Precios en la moneda del coach · equivalencia en '+(MGL_PRECIO.esChile()?'pesos chilenos':'dólares')+' · <a onclick="cambiarMoneda()">ver equivalencia en '+(MGL_PRECIO.esChile()?'USD':'CLP')+'</a></div>';
  }
  $('wrap').innerHTML=h;
  document.title=(co?'Tips de '+co.display_name:'Contenido exclusivo')+' · Coach Hub';
}
function cambiarMoneda(){ MGL_PRECIO.cambiar(MGL_PRECIO.esChile()?'USD':'CLP'); if(C) renderDetail(); else renderCatalog(); }

async function loadDetail(id){
  var r=await sb.from('coach_collections').select('*').eq('id',id).maybeSingle();
  if(r.error || !r.data){
    $('wrap').innerHTML='<div class="loading">No encontramos esta colección (o ya no está disponible).<br><br><a href="/es/coaches/contenido.html">Ver todo el contenido →</a></div>';
    return;
  }
  C=r.data;
  var ri=await sb.from('coach_collection_items').select('*').eq('collection_id',C.id).order('sort_order').order('created_at');
  CI=ri.data||[];
  await loadCoaches([C.coach_id]);
  await loadMine([C.id]);
  ACCESS=hasAccess(C.id);
  await signUrls();
  var co=COACHES[C.coach_id]||{};
  document.title=C.title+' · '+(co.display_name||'Coach')+' · Coach Hub';
  CUR_ITEM = pickStart();
  MGL_PRECIO.listo(function(){
    renderDetail();
    afterPago();
    reabrirCompra();
  });
}

function playable(it){ return ACCESS || (it.is_preview && C.is_published); }
async function signUrls(){
  URLS={};
  var paths=CI.filter(playable).map(function(i){ return i.video_path; });
  if(!paths.length) return;
  var r=await sb.storage.from(BUCKET_VIDEO).createSignedUrls(paths, 4*3600);
  (r.data||[]).forEach(function(x){ if(x.signedUrl) URLS[x.path]=x.signedUrl; });
}
function seen(){ try{ return JSON.parse(localStorage.getItem('mgl_vistos_'+C.id)||'[]'); }catch(e){ return []; } }
function markSeen(id){ try{ var s=seen(); if(s.indexOf(id)<0){ s.push(id); localStorage.setItem('mgl_vistos_'+C.id, JSON.stringify(s)); } }catch(e){} }
function pickStart(){
  if(!CI.length) return null;
  if(ACCESS){ var s=seen(); var next=CI.filter(function(i){ return s.indexOf(i.id)<0; })[0]; return next||CI[0]; }
  return CI.filter(function(i){ return i.is_preview; })[0] || CI[0];
}

function renderDetail(){
  var co=COACHES[C.coach_id]||{}, mine=SESSION && C.coach_id===SESSION.user.id;

  h+='<div class="dh">'+coverHTML(C, CI, ACCESS&&!mine?'<span class="badge">Tuya</span>':'')

    + '<a class="coach" href="'+(co.slug?'/es/coaches/perfil.html?c='+encodeURIComponent(co.slug):'#')+'">'+avHTML(co)+'<span>con <b>'+esc(co.display_name||'Coach')+'</b></span></a>'
    + '<div class="meta"><span><b>'+CI.length+'</b> video'+(CI.length===1?'':'s')+'</span>'+(dur?'<span><b>'+fmtTotal(dur)+'</b> en total</span>':'')+(nPrev&&!ACCESS?'<span><b>'+nPrev+'</b> gratis para ver ahora</span>':'')+'</div>'
    + '</div></div>';

  h+='<div class="cols'+(ACCESS||mine?'':' buyfirst')+'"><div>';
  h+='<div class="stage" id="stage"></div><div class="now" id="now"></div>';
  h+='<div class="sec"><h2>Contenido de la colección</h2><div class="pl" id="pl"></div></div>';

    h+='<div class="owned">'+ICON_OK+'<span>Esta colección es tuya. Así la ven tus alumnos.</span></div>'

    h+='<div class="owned">'+ICON_OK+'<span>Ya es tuya: tienes acceso para siempre a los '+CI.length+' videos.</span></div>'

      + '<a class="buy ghost" href="/es/coachhub/contenido.html">Mi contenido</a>';
  } else {
    var free=!Number(C.price), alt=MGL_PRECIO.otra(C.price,C.currency);

      + '<ul><li>'+CI.length+' video'+(CI.length===1?'':'s')+(dur?' · '+fmtTotal(dur):'')+' de '+esc(co.display_name||'tu coach')+'</li>'

      + (co.slug?'<a class="l" href="/es/coaches/perfil.html?c='+encodeURIComponent(co.slug)+'">Ver perfil y clases ›</a>':'')+'</div></div>';

function renderStage(autoplay){
  var st=$('stage'), now=$('now'); if(!st) return;
  var it=CUR_ITEM;
  if(!it){ st.innerHTML='<div class="lock"><b>Esta colección aún no tiene videos</b></div>'; now.innerHTML=''; return; }
  var url=URLS[it.video_path];
  if(playable(it) && url){
    var poster = it.thumb_path ? ' poster="'+esc(pubUrl(it.thumb_path))+'"' : '';
    st.innerHTML='<video id="player" src="'+esc(url)+'"'+poster+' controls playsinline preload="metadata"></video>';
    var v=$('player');
    v.addEventListener('timeupdate',function(){ if(v.duration && v.currentTime/v.duration>0.8){ markSeen(it.id); paintSeen(); } });
    v.addEventListener('ended',function(){ markSeen(it.id); paintSeen(); var nx=nextPlayable(it); if(nx){ CUR_ITEM=nx; renderStage(true); renderPlaylist(); } });
    if(autoplay){ try{ var pp=v.play(); if(pp && pp.catch) pp.catch(function(){}); }catch(e){} }
  } else if(playable(it) && !url){
    st.innerHTML='<div class="lock"><b>No se pudo cargar el video</b><span style="color:var(--muted)">Recarga la página para intentarlo de nuevo.</span></div>';
  } else {
    var free=!Number(C.price);
    st.innerHTML='<div class="lock">'+ICON_LOCK+'<b>'+(free?'Obtén la colección gratis para ver este video':'Compra la colección para ver este video')+'</b>'
      + (C.is_published?'<button class="buy" style="width:auto;padding:11px 22px;margin:0" onclick="openBuy()">'+(free?'Obtener gratis':'Comprar · '+esc(MGL_PRECIO.mostrar(C.price,C.currency)))+'</button>':'')+'</div>';
  }
  var idx=CI.indexOf(it)+1;
  now.innerHTML='<h3>'+idx+'. '+esc(it.title)+'</h3>'+(it.description && playable(it)?'<p>'+esc(it.description)+'</p>':'');
}
function nextPlayable(it){ var i=CI.indexOf(it); for(var k=i+1;k<CI.length;k++) if(playable(CI[k])) return CI[k]; return null; }
function playFirstUnseen(){ var s=seen(); CUR_ITEM=CI.filter(function(i){ return s.indexOf(i.id)<0; })[0]||CI[0]; renderStage(true); renderPlaylist(); var st=$('stage'); if(st) st.scrollIntoView({behavior:'smooth',block:'start'}); }

function renderPlaylist(){
  var box=$('pl'); if(!box) return;
  var s=seen();
  box.innerHTML=CI.map(function(it,i){
    var ok=playable(it), on=CUR_ITEM&&CUR_ITEM.id===it.id;
    var tag = ACCESS ? (s.indexOf(it.id)>=0?'<span class="s seen">Visto</span>':'')
            : (it.is_preview ? '<span class="s free">Gratis</span>' : '<span class="s">'+ICON_LOCK+'</span>');
    return '<div class="pi'+(on?' on':'')+(ok?'':' locked')+'" data-id="'+it.id+'" onclick="pick(\''+it.id+'\')">'
      + '<div class="n">'+(i+1)+'</div>'
      + '<div class="th">'+(it.thumb_path?'<img src="'+esc(pubUrl(it.thumb_path))+'" alt="" loading="lazy">':'')+'</div>'
      + '<div class="t"><b>'+esc(it.title)+'</b><small>'+(fmtDur(it.duration_sec)||'Video')+'</small></div>'
      + tag+'</div>';
  }).join('');
}
function paintSeen(){ if(ACCESS) renderPlaylist(); }
function pick(id){
  var it=CI.filter(function(x){ return x.id===id; })[0]; if(!it) return;
  CUR_ITEM=it; renderStage(playable(it)); renderPlaylist();
  if(window.innerWidth<900){ var st=$('stage'); if(st) st.scrollIntoView({behavior:'smooth',block:'start'}); }
}

function desglose(){
  var cur=C.currency||'CLP', baseClp=MGL_PRECIO.clp(C.price,cur), feeClp=Math.round(baseClp*FEE_PCT/100), totClp=baseClp+feeClp;
  var cl=MGL_PRECIO.esChile();
  var bUsd = cur==='USD' ? Number(C.price) : MGL_PRECIO.usd(baseClp,'CLP');
  var fUsd = Math.round(bUsd*FEE_PCT)/100, tUsd = Math.round((bUsd+fUsd)*100)/100;
  function f(c,u){ return cl ? MGL_PRECIO.fmtCLP(c) : MGL_PRECIO.fmtUSD(u); }
  return '<div class="desg">'
    + '<div><span>Colección</span><span>'+f(baseClp,bUsd)+'</span></div>'
    + '<div><span>Cargo por servicio ('+String(FEE_PCT).replace('.',',')+'%)</span><span>'+f(feeClp,fUsd)+'</span></div>'
    + '<div class="tot"><span>Total</span><span>'+f(totClp,tUsd)+'</span></div>'
    + (cl?'':'<div class="clp">Se cobra en pesos chilenos: <b>'+MGL_PRECIO.fmtCLP(totClp)+' CLP</b> aprox. Tu banco hace la conversión.</div>')
    + '</div>';
}

async function openBuy(){
  if(!C || !C.is_published) return;
  var s=await sb.auth.getSession(); SESSION=s.data && s.data.session;
  if(!SESSION){
    try{ localStorage.setItem('mgl_comprar', JSON.stringify({ c:C.id, t:Date.now() })); }catch(e){}
    location.href='/es/coachhub/entrar.html?registro=alumno&volver='+encodeURIComponent(location.pathname+'?c='+C.id);
    return;
  }
  if(SESSION.user.id===C.coach_id){ toast('Esta colección es tuya'); return; }
  var co=COACHES[C.coach_id]||{}, free=!Number(C.price);
  var h='<h3>'+(free?'Obtener gratis':'Comprar colección')+'</h3><div class="sub">'+esc(C.title)+' · '+esc(co.display_name||'Coach')+'</div>'
    + (free?'<div class="note">Es gratis: queda en <b>Mi contenido</b> y la puedes ver cuando quieras.</div>'
           : desglose()+'<div class="note">Pagas una sola vez con <b>Flow</b> (Webpay, tarjetas o transferencia) y quedas con acceso para siempre a los '+CI.length+' videos.</div>')
    + '<div class="err" id="buyErr"></div>'
    + '<div class="acts"><button onclick="closeBuy()" id="bCancel">Cancelar</button><button class="go" id="bGo" onclick="doBuy()">'+(free?'Obtener':'Ir a pagar')+'</button></div>';
  $('buyBody').innerHTML=h;
  $('buyModal').classList.add('on');
}
function closeBuy(){ if(PAYING) return; $('buyModal').classList.remove('on'); }
function buyErr(m){ var e=$('buyErr'); if(!e) return; e.innerHTML=m; e.style.display=m?'block':'none'; }

async function doBuy(){
  if(PAYING) return;
  PAYING=true; buyErr(''); $('bGo').disabled=true; $('bCancel').disabled=true; $('bGo').textContent='Un momento…';
  try{ localStorage.removeItem('mgl_comprar'); }catch(e){}
  var r=await sb.rpc('mgl_contenido_comprar',{ p_collection:C.id, p_country: MGL_PRECIO.esChile()?'CL':'XX' });
  if(r.error){ fail(r.error.message); return; }
  var res=r.data||{};
  if(res.status==='otorgado' || res.status==='pagado'){ PAYING=false; $('buyModal').classList.remove('on'); await refreshAccess(); toast('¡Listo! La colección ya es tuya'); playFirstUnseen(); return; }

  $('bGo').textContent='Abriendo Flow…';
  try{
    var s=await sb.auth.getSession();
    var resp=await fetch('/api/contenido-pagar',{ method:'POST',
      headers:{'Content-Type':'application/json','Authorization':'Bearer '+s.data.session.access_token},
      body:JSON.stringify({purchase_id:res.id}) });
    var j=await resp.json().catch(function(){ return {}; });
    if(resp.ok && j.url){ window.top.location.href=j.url; return; }
    if(resp.status===503){
      var co=COACHES[C.coach_id]||{};
      PAYING=false;
      $('buyBody').innerHTML='<h3>Pagos en línea muy pronto</h3>'
        + '<div class="note warn" style="margin-top:10px">Estamos activando los pagos con Flow. Mientras tanto, escríbele a <b>'+esc(co.display_name||'el coach')+'</b> para coordinar el pago: apenas lo reciba, te da acceso directo a la colección.</div>'
        + '<div class="acts">'+(co.slug?'<a href="/es/coaches/perfil.html?c='+encodeURIComponent(co.slug)+'" class="go" style="background:var(--teal);color:#1C1709">Ver perfil del coach</a>':'')+'<button onclick="closeBuy()">Entendido</button></div>';
      MYP[C.id]={ id:res.id, collection_id:C.id, status:'por_pagar' };
      return;
    }
    throw new Error(j.error||'No se pudo abrir el pago');
  }catch(e){ fail(e.message); }
}
function fail(m){
  PAYING=false;
  buyErr(/mgl_contenido|PGRST202|42883/i.test(m)?'El contenido exclusivo se está activando. Inténtalo más tarde.':esc(m));
  var g=$('bGo'); if(g){ g.disabled=false; g.textContent=Number(C.price)?'Ir a pagar':'Obtener'; }
  var c=$('bCancel'); if(c) c.disabled=false;
}

async function refreshAccess(){
  await loadMine([C.id]);
  ACCESS=hasAccess(C.id);
  await signUrls();
  if(!CUR_ITEM) CUR_ITEM=pickStart();
  renderDetail();
}

// vuelta desde Flow: ?c=...&pago=pagado|pendiente|fallido
async function afterPago(){
  var pago=QP.get('pago'); if(!pago) return;
  if(history.replaceState) history.replaceState(null,'','/es/coaches/contenido.html?c='+encodeURIComponent(C.id));
  if(pago==='fallido'){ toast('El pago no se completó. Puedes intentarlo de nuevo.'); return; }
  if(ACCESS){ toast('¡Pago recibido! La colección ya es tuya'); playFirstUnseen(); return; }
  toast('Estamos confirmando tu pago…');
  for(var i=0;i<6 && !ACCESS;i++){
    await new Promise(function(r){ setTimeout(r,2500); });
    await loadMine([C.id]); ACCESS=hasAccess(C.id);
  }
  if(ACCESS){ await refreshAccess(); toast('¡Pago recibido! La colección ya es tuya'); playFirstUnseen(); }
  else toast('Tu pago se está procesando. Te aparecerá en Mi contenido en unos minutos.');
}
// volvió de crear su cuenta para comprar: se abre directo
function reabrirCompra(){
  try{
    var p=JSON.parse(localStorage.getItem('mgl_comprar')||'null');
    if(!p || p.c!==C.id || Date.now()-p.t>86400000 || !SESSION || ACCESS) return;
    openBuy();
  }catch(e){}
}

// menú principal
(function(){
  var btn=$('hamburgerBtn'), nav=$('navLinks');
  btn.addEventListener('click',function(e){ e.stopPropagation(); btn.classList.toggle('open'); nav.classList.toggle('open'); });
  document.addEventListener('click',function(e){ if(nav.classList.contains('open') && !nav.contains(e.target)){ nav.classList.remove('open'); btn.classList.remove('open'); } });
})();
document.addEventListener('keydown',function(e){ if(e.key==='Escape') closeBuy(); });
init();
</script>
