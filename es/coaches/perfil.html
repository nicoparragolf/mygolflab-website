<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">

<style>
  :root{
    --bg:#0a0a0a; --bg2:#111; --card:#161616; --card2:#1c1c1c;
    --border:#262626; --border2:#333;
    --teal:#D4C5A9; --teal-dim:#7D7259; --gold:#F0B860;
    --text:#f5f5f5; --muted:#8a8a8a; --muted2:#666; --red:#e06a6a;
  }
  *{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
  body{background:var(--bg);color:var(--text);font-family:'Barlow',sans-serif;-webkit-font-smoothing:antialiased;min-height:100vh}
  a{color:inherit;text-decoration:none}
  button{font-family:inherit;color:inherit}
  html{scrollbar-width:thin;scrollbar-color:rgba(255,255,255,.09) #0a0a0a}
  ::-webkit-scrollbar{width:10px;height:10px}
  ::-webkit-scrollbar-track{background:#0a0a0a}
  ::-webkit-scrollbar-thumb{background:rgba(255,255,255,.09);border-radius:10px;border:3px solid #0a0a0a}

  #siteHeader{position:sticky;top:0;z-index:50;background:rgba(10,10,10,.85);backdrop-filter:blur(12px);border-bottom:1px solid var(--border);padding-top:env(safe-area-inset-top)}
  .nav-inner{max-width:1100px;margin:0 auto;padding:0 20px;height:62px;display:flex;align-items:center;gap:18px}
  .brand{font-family:'Bebas Neue',sans-serif;font-size:25px;letter-spacing:2px}
  .brand span{color:var(--teal)}
  .hubchip{font-family:'Barlow Condensed';font-size:12px;font-weight:700;text-transform:uppercase;letter-spacing:.7px;color:var(--teal);border:1px solid var(--teal-dim);border-radius:20px;padding:3px 10px;white-space:nowrap}
  .nav-links a{font-family:'Barlow Condensed';font-size:16px;font-weight:500;color:var(--muted);text-transform:uppercase;letter-spacing:.5px;white-space:nowrap}
  .nav-links a:hover{color:var(--text)}
  .nav-links a.active{color:var(--teal)}

  .wrap{max-width:1100px;margin:0 auto;padding:28px 20px 80px}
  .back{display:inline-flex;gap:6px;align-items:center;color:var(--muted);font-family:'Barlow Condensed';font-weight:600;text-transform:uppercase;letter-spacing:.5px;font-size:14px;margin-bottom:18px}
  .back:hover{color:var(--text)}

  .hero{display:grid;grid-template-columns:auto 1fr;gap:26px;align-items:center;background:linear-gradient(145deg,#2B2619,#141414 65%);border:1px solid var(--teal-dim);border-radius:22px;padding:28px}
  .ph{width:132px;height:132px;border-radius:50%;background:var(--card2);border:2px solid var(--teal-dim);overflow:hidden;display:flex;align-items:center;justify-content:center;font-family:'Bebas Neue';font-size:52px;color:var(--gold)}
  .ph img{width:100%;height:100%;object-fit:cover}
  .hero h1{font-family:'Bebas Neue';font-size:48px;letter-spacing:1px;line-height:1;display:flex;align-items:center;gap:10px;flex-wrap:wrap}
  .ver{font-family:'Barlow Condensed';font-weight:700;font-size:13px;letter-spacing:.5px;text-transform:uppercase;background:var(--teal);color:#1C1709;border-radius:20px;padding:3px 10px}
  .hero .hl{color:#cfcfcf;font-size:17px;margin-top:8px;line-height:1.4}
  .meta{display:flex;flex-wrap:wrap;gap:8px 18px;margin-top:14px;color:var(--muted);font-size:14.5px}
  .meta b{color:var(--text);font-weight:600}
  .stars{color:var(--gold);letter-spacing:1px}

  .cols{display:grid;grid-template-columns:1fr 380px;gap:22px;margin-top:22px;align-items:start}
  .sec{background:var(--card);border:1px solid var(--border);border-radius:18px;padding:22px;margin-bottom:18px}
  .sec h2{font-family:'Barlow Condensed';font-weight:700;font-size:21px;letter-spacing:.3px;margin-bottom:12px}
  .sec p.txt{color:#d6d6d6;font-size:15.5px;line-height:1.65;white-space:pre-line}
  .vid{width:100%;border-radius:14px;background:#000;display:block;max-height:560px}
  .chips{display:flex;flex-wrap:wrap;gap:8px}
  .chip{background:var(--bg2);border:1px solid var(--border2);border-radius:20px;padding:6px 12px;font-size:14px}
  .chip.t{border-color:var(--teal-dim);color:var(--teal)}
  ul.list{list-style:none;display:flex;flex-direction:column;gap:9px}
  ul.list li{display:flex;gap:10px;font-size:15px;line-height:1.45;color:#d6d6d6}
  ul.list li::before{content:'';width:7px;height:7px;border-radius:50%;background:var(--gold);margin-top:8px;flex:0 0 auto}
  .lbl{font-family:'Barlow Condensed';font-weight:600;font-size:13px;text-transform:uppercase;letter-spacing:.5px;color:var(--muted);margin:16px 0 8px}
  .lbl:first-child{margin-top:0}
  .soc{display:flex;flex-wrap:wrap;gap:10px}
  .soc a{font-family:'Barlow Condensed';font-weight:600;font-size:14px;text-transform:uppercase;letter-spacing:.4px;border:1px solid var(--border2);border-radius:9px;padding:6px 11px;color:var(--muted)}
  .soc a:hover{color:var(--teal);border-color:var(--teal-dim)}

  .side{position:sticky;top:84px}
  .offer{background:var(--card);border:1px solid var(--border);border-radius:18px;padding:20px;margin-bottom:14px}
  .offer.trial{border-color:rgba(240,184,96,.5);background:linear-gradient(160deg,rgba(240,184,96,.08),var(--card) 60%)}
  .offer .k{font-family:'Barlow Condensed';font-weight:700;font-size:12.5px;text-transform:uppercase;letter-spacing:.6px;color:var(--gold)}
  .offer h3{font-family:'Barlow Condensed';font-weight:700;font-size:22px;margin-top:4px;line-height:1.15}
  .offer .pr{font-family:'Bebas Neue';font-size:38px;color:var(--teal);line-height:1;margin:10px 0 2px}
  .offer .pr small{font-family:'Barlow';font-size:14px;color:var(--muted);margin-left:4px}
  .offer p{color:var(--muted);font-size:14px;line-height:1.5;margin-top:8px;white-space:pre-line}
  .rec{background:var(--bg2);border:1px solid var(--border);border-radius:12px;padding:12px;margin-top:12px;font-size:13.5px;color:#cfcfcf;line-height:1.5}
  .rec b{display:block;font-family:'Barlow Condensed';font-weight:700;font-size:12.5px;text-transform:uppercase;letter-spacing:.5px;color:var(--muted);margin-bottom:5px}
  .buy{width:100%;margin-top:14px;background:var(--teal);border:none;border-radius:11px;padding:13px;font-family:'Barlow Condensed';font-weight:700;font-size:17px;letter-spacing:.5px;text-transform:uppercase;color:#1C1709;cursor:pointer}
  .buy:hover{filter:brightness(1.08)}
  .guar{display:flex;gap:10px;color:var(--muted);font-size:13px;line-height:1.45;padding:4px 6px 0}
  .guar svg{width:18px;height:18px;flex:0 0 auto;color:var(--teal);margin-top:1px}

  .rv{border-top:1px solid var(--border);padding:14px 0}
  .rv:first-of-type{border-top:none;padding-top:0}
  .rv .h{display:flex;gap:10px;align-items:center;font-size:13.5px;color:var(--muted)}
  .rv p{margin-top:6px;color:#d6d6d6;font-size:15px;line-height:1.55}
  .empty{color:var(--muted);font-size:14.5px}

  /* contenido exclusivo del coach */
  .colgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(200px,1fr));gap:12px}
  .colc{background:var(--bg2);border:1px solid var(--border);border-radius:14px;overflow:hidden;display:flex;flex-direction:column;transition:border-color .2s}
  .colc:hover{border-color:var(--teal-dim)}
  .colc .cv{position:relative;aspect-ratio:16/10;overflow:hidden;background:linear-gradient(145deg,#2B2619,#121212 70%)}
  .colc .cv img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;display:block}
  .colc .cv span{position:absolute;right:8px;bottom:8px;font-family:'Barlow Condensed';font-size:11.5px;font-weight:700;letter-spacing:.4px;background:rgba(0,0,0,.72);border-radius:6px;padding:2px 7px;color:#e8e8e8}
  .colc .cb{padding:10px 12px 12px;display:flex;flex-direction:column;gap:4px;flex:1 1 auto}
  .colc .ca{font-family:'Barlow Condensed';font-size:11.5px;font-weight:700;letter-spacing:.6px;text-transform:uppercase;color:var(--gold)}
  .colc b{font-family:'Barlow Condensed';font-weight:700;font-size:17px;line-height:1.15}
  .colc .cp{font-family:'Bebas Neue';font-size:22px;color:var(--teal);margin-top:auto;padding-top:4px;letter-spacing:.5px}
  .sec .more{display:inline-block;margin-top:12px;font-family:'Barlow Condensed';font-weight:700;font-size:14px;letter-spacing:.5px;text-transform:uppercase;color:var(--teal)}

  .modal-bg{position:fixed;inset:0;background:rgba(0,0,0,.72);z-index:100;display:none;align-items:center;justify-content:center;padding:16px}
  .modal-bg.on{display:flex}
  .modal{background:var(--card);border:1px solid var(--border2);border-radius:18px;max-width:440px;width:100%;padding:24px;text-align:center}
  .modal h3{font-family:'Barlow Condensed';font-weight:700;font-size:24px;margin-bottom:10px}
  .modal p{color:var(--muted);font-size:15px;line-height:1.55}
  .modal button{margin-top:18px;background:var(--card2);border:1px solid var(--border2);border-radius:10px;padding:10px 18px;font-family:'Barlow Condensed';font-weight:700;text-transform:uppercase;cursor:pointer}

  .loading{color:var(--muted);padding:80px 0;text-align:center}
  .offer .alt{font-size:13px;color:var(--muted);margin-bottom:2px}
  .cur{font-size:13px;color:var(--muted);text-align:center;margin:10px 0 4px}
  .cur a{color:var(--teal);cursor:pointer;text-decoration:underline}

  /* solicitud de clase */
  .rq{max-width:560px;text-align:left;max-height:calc(100vh - 32px);overflow-y:auto}
  .rq h3{text-align:left}
  .rq .sub{color:var(--muted);font-size:14px;margin:-4px 0 14px}
  .rq .pz{display:flex;justify-content:space-between;align-items:baseline;gap:12px;background:var(--bg2);border:1px solid var(--border);border-radius:12px;padding:12px 14px;margin-bottom:14px}
  .rq .pz b{font-family:'Bebas Neue';font-size:30px;color:var(--teal);font-weight:400;line-height:1}
  .rq .pz small{color:var(--muted);font-size:12.5px;display:block}
  .rq label.l{display:block;font-family:'Barlow Condensed';font-size:13px;font-weight:700;letter-spacing:.6px;text-transform:uppercase;color:var(--muted);margin:14px 0 6px}
  .rq textarea{width:100%;min-height:96px;resize:vertical;background:var(--bg2);border:1px solid var(--border2);border-radius:12px;padding:11px 13px;color:var(--text);font-family:'Barlow';font-size:15px;line-height:1.45;outline:none}
  .rq textarea:focus{border-color:var(--teal-dim)}
  .rq .drop{border:1.5px dashed var(--border2);border-radius:12px;padding:18px;text-align:center;color:var(--muted);font-size:14px;cursor:pointer}
  .rq .drop:hover{border-color:var(--teal-dim);color:var(--text)}
  .rq .files{margin-top:8px;display:flex;flex-direction:column;gap:6px}
  .rq .fl{display:flex;align-items:center;gap:10px;background:var(--bg2);border:1px solid var(--border);border-radius:10px;padding:8px 10px;font-size:13.5px;position:relative;overflow:hidden}
  .rq .fl span{flex:1 1 auto;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .rq .fl em{font-style:normal;color:var(--muted);font-size:12px}
  .rq .fl i{position:absolute;left:0;bottom:0;height:3px;background:var(--teal);width:0;transition:width .2s}
  .rq .fl button{margin:0;background:none;border:none;padding:0 4px;color:var(--muted);font-size:18px;cursor:pointer}
  .rq .note{font-size:13px;color:#e9cf9f;background:rgba(240,184,96,.08);border:1px solid rgba(240,184,96,.3);border-radius:10px;padding:10px 12px;margin-top:14px;line-height:1.45}
  .rq .err{font-size:13.5px;color:#f0a0a0;margin-top:10px;display:none}
  .rq .note.pay{color:#cfcfcf;background:rgba(212,197,169,.06);border-color:rgba(212,197,169,.25)}
  .desg{background:var(--bg2);border:1px solid var(--border);border-radius:12px;padding:10px 14px;margin-bottom:14px;font-size:14px}
  .desg>div{display:flex;justify-content:space-between;padding:3px 0;color:#cfcfcf}
  .desg .tot{border-top:1px solid var(--border);margin-top:4px;padding-top:7px;color:var(--text);font-weight:600}
  .desg .clp{display:block;color:var(--muted);font-size:12.5px;margin-top:6px}
  .rq .acts{display:flex;gap:10px;justify-content:flex-end;margin-top:18px}
  .rq .acts button{margin:0}
  .rq .acts .go{background:var(--teal);color:#1C1709;border-color:var(--teal)}
  .rq .acts .go:disabled{opacity:.5;cursor:default}
  .rq.done{text-align:center}
  .rq.done h3{text-align:center}
  .rq.done a{display:inline-block;margin-top:16px;background:var(--teal);color:#1C1709;border-radius:10px;padding:11px 18px;font-family:'Barlow Condensed';font-weight:700;text-transform:uppercase;letter-spacing:.5px}

  @media(max-width:900px){
    .hero{grid-template-columns:1fr;text-align:center;padding:24px 18px}
    .ph{margin:0 auto;width:112px;height:112px}
    .hero h1{justify-content:center;font-size:40px}
    .meta{justify-content:center}
    .cols{grid-template-columns:1fr}
    .side{position:static;order:-1}
  }

  /* menú principal del sitio */
  .nav-links{display:flex;align-items:center;gap:22px;margin-left:auto}
  .nav-sep{width:1px;height:18px;background:var(--border2)}
  .nav-links a.nav-coach{color:var(--gold)}
  .nav-links a.nav-btn{border:1px solid var(--border2);border-radius:8px;padding:7px 14px;color:var(--text)}
  .nav-links a.nav-btn:hover{border-color:var(--teal);color:var(--teal)}
  .hamburger{display:none;flex-direction:column;gap:5px;background:none;border:none;cursor:pointer;padding:8px;margin-left:auto}
  .hamburger span{width:24px;height:2px;background:var(--text);transition:transform .2s,opacity .2s}
  .hamburger.open span:nth-child(1){transform:translateY(7px) rotate(45deg)}
  .hamburger.open span:nth-child(2){opacity:0}
  .hamburger.open span:nth-child(3){transform:translateY(-7px) rotate(-45deg)}
  @media(max-width:1000px){
    .hamburger{display:flex}
    .nav-links{display:none}
    .nav-links.open{display:flex;flex-direction:column;align-items:stretch;gap:0;position:absolute;top:100%;left:0;right:0;background:#0a0a0a;border-bottom:1px solid var(--border);padding:6px 20px 16px;margin:0;z-index:60}
    .nav-links.open a{padding:14px 0;font-size:19px;border-bottom:1px solid var(--border)}
    .nav-links.open .nav-sep{display:none}
    .nav-links.open a.nav-btn{margin-top:12px;text-align:center;border:1px solid var(--border2)}
  }
</style>
</head>
<body>

<header id="siteHeader">
  <div class="nav-inner">
    <a href="/es/coaches/" class="brand">COACH<span>HUB</span></a><span class="brand-by">by MyGolfLab</span>

<div class="modal-bg" id="reqModal" onclick="if(event.target===this && !SENDING)this.classList.remove('on')"><div class="modal rq" id="reqBody"></div></div>
<input type="file" id="reqFiles" accept="video/*" multiple style="display:none">

<div class="modal-bg" id="soonModal" onclick="if(event.target===this)this.classList.remove('on')">
  <div class="modal"><h3>¡Muy pronto!</h3><p>Estamos activando los pagos con Mercado Pago. En unos días vas a poder comprar tu análisis directamente desde aquí.</p><button onclick="document.getElementById('soonModal').classList.remove('on')">Entendido</button></div>
</div>

<script>
var SUPABASE_URL = 'https://yulpqupmftdjbepqiscs.supabase.co';
var SUPABASE_ANON_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Inl1bHBxdXBtZnRkamJlcHFpc2NzIiwicm9sZSI6ImFub24iLCJpYXQiOjE3NzQxNDA0NjYsImV4cCI6MjA4OTcxNjQ2Nn0.e-8SEni5uxUoigXCkVM2VYm7UrHYxxVl7hPsUrZvYao';
var sb = supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);
var BUCKET='coach-public';

var SPEC = {full_swing:'Full Swing',juego_corto:'Juego Corto',putter:'Putter',fisico:'Físico',estrategia:'Estrategia / Cancha',juniors:'Juniors'};
var LEVEL = {iniciacion:'Iniciación',junior:'Junior',amateur:'Amateur',college:'College',elite:'Elite amateur',profesional:'Profesional',senior:'Senior'};
var LANG = {es:'Español',en:'Inglés',pt:'Portugués'};
var COUNTRY = {CL:'Chile',AR:'Argentina',MX:'México',CO:'Colombia',PE:'Perú',UY:'Uruguay',PY:'Paraguay',EC:'Ecuador',ES:'España',US:'Estados Unidos',OT:''};
var KIND = {analisis:'Análisis de swing',paquete:'Paquete',plan_mensual:'Plan mensual',videollamada:'Videollamada'};
var ANGLE = {frente:'de frente',linea_de_tiro:'desde la línea de tiro',atras:'desde atrás del objetivo',resultado:'mostrando el vuelo de bola'};
var CLUB = {libre:'el palo que quieras trabajar',driver:'driver',hierro_7:'hierro 7',wedge:'wedge',putter:'putter'};

function $(id){ return document.getElementById(id); }
function esc(s){ if(s==null) return ''; return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;'); }
function pubUrl(p){ return p ? SUPABASE_URL+'/storage/v1/object/public/'+BUCKET+'/'+p.split('/').map(encodeURIComponent).join('/') : ''; }
function clp(n){ try{ return new Intl.NumberFormat('es-CL',{style:'currency',currency:'CLP',maximumFractionDigits:0}).format(n||0); }catch(e){ return '$'+n; } }
function stars(r){ var f=Math.round(r), s=''; for(var i=0;i<5;i++) s+= i<f?'★':'☆'; return s; }
function safeLink(u){ u=String(u||'').trim(); if(!u) return ''; if(/^https?:\/\//i.test(u)) return u; return 'https://'+u; }
function handleLink(net, v){
  v=String(v||'').trim(); if(!v) return '';
  if(/^https?:\/\//i.test(v)) return v;
  var h=v.replace(/^@/,'');
  if(net==='instagram') return 'https://instagram.com/'+encodeURIComponent(h);
  if(net==='tiktok') return 'https://tiktok.com/@'+encodeURIComponent(h);
  return safeLink(v);
}
function fmtDate(iso){ var d=new Date(iso); var m=['ene','feb','mar','abr','may','jun','jul','ago','sep','oct','nov','dic']; return d.getDate()+' '+m[d.getMonth()]+' '+d.getFullYear(); }

var C=null, OFFERS=[], REVIEWS=[], COLS=[], COL_ITEMS={};
var CAREA = {full_swing:'Full Swing',juego_corto:'Juego Corto',putter:'Putter',fisico:'Físico',estrategia:'Estrategia / Cancha'};

async function init(){
  var slug = new URLSearchParams(location.search).get('c');
  if(!slug){ location.replace('/es/coaches/'); return; }
  var r = await sb.from('coach_profiles').select('*').eq('slug',slug).maybeSingle();
  if(r.error || !r.data){
    $('wrap').innerHTML='<div class="loading">No encontramos este coach.<br><br><a href="/es/coaches/" style="color:var(--teal)">Ver todos los coaches →</a></div>';
    return;
  }
  C=r.data;
  var ro = await sb.from('coach_offerings').select('*').eq('coach_id',C.coach_id).eq('is_active',true).order('is_trial',{ascending:false}).order('sort_order');
  OFFERS = ro.data||[];
  var rr = await sb.from('coach_reviews').select('rating,comment,created_at').eq('coach_id',C.coach_id).order('created_at',{ascending:false}).limit(20);
  REVIEWS = rr.data||[];
  // contenido exclusivo publicado (si la tabla aún no existe, no se muestra nada)
  try{
    var rc = await sb.from('coach_collections').select('*').eq('coach_id',C.coach_id).eq('is_published',true).order('sort_order').order('created_at');
    COLS = rc.data||[];
    if(COLS.length){
      var ric = await sb.from('coach_collection_items').select('collection_id,duration_sec,thumb_path,sort_order').in('collection_id',COLS.map(function(c){ return c.id; })).order('sort_order');

function cambiarMoneda(){ MGL_PRECIO.cambiar(MGL_PRECIO.esChile()?'USD':'CLP'); render(); }

// SOLICITAR UNA CLASE (sin pago por ahora; Mercado Pago después)
// ============================================================
var REQ = null, SENDING = false, FEE_PCT = 5;
// cargo por servicio vigente (lo paga el alumno y cubre la comisión de Flow)
sb.from('mgl_pagos_config').select('service_fee_pct').eq('id',1).maybeSingle().then(function(r){
  if(r && r.data && r.data.service_fee_pct!=null) FEE_PCT = Number(r.data.service_fee_pct);
});
function fmtMB(b){ return b>=1073741824 ? (b/1073741824).toFixed(1)+' GB' : Math.max(1,Math.round(b/1048576))+' MB'; }

async function buy(offerId){
  var o = OFFERS.filter(function(x){ return x.id===offerId; })[0];
  if(!o) return;
  var s = await sb.auth.getSession();
  if(!s.data.session){
    // se guarda qué quería pedir y vuelve acá después de crear su cuenta / entrar
    try{ localStorage.setItem('mgl_pedir', JSON.stringify({ c:C.slug, o:offerId, t:Date.now() })); }catch(e){}
    var volver = location.pathname + location.search;
    location.href = '/es/coachhub/entrar.html?registro=alumno&volver=' + encodeURIComponent(volver);
    return;
  }
  if(s.data.session.user.id === C.coach_id){ alert('Esta es tu propia vitrina: así la ven tus alumnos.'); return; }
  REQ = { o:o, files:[], user:s.data.session.user, token:s.data.session.access_token };
  renderReq();
  $('reqModal').classList.add('on');
}

function renderReq(){
  var o=REQ.o, cr=o.capture_requirements||{}, ang=(cr.angulos||[]).map(function(a){ return ANGLE[a]||a; });
  var maxv=o.max_videos||6, paid=Number(o.price)>0;
  var h='<h3>'+(o.is_trial?'Pedir evaluación':'Pedir clase')+'</h3>'
    + '<div class="sub">'+esc(o.title)+' · con '+esc(C.display_name)+'</div>'
    + '<div class="pz"><div><small>'+(o.is_trial?'Evaluación inicial':esc(KIND[o.kind]||''))+'</small>'+esc(o.title)+'</div>'
    +   '<div style="text-align:right"><b>'+MGL_PRECIO.mostrar(o.price,o.currency||'CLP')+'</b><small>'+esc(MGL_PRECIO.otra(o.price,o.currency||'CLP'))+'</small></div></div>'
    + (paid ? desglose(o) : '')
    + (ang.length?'<div class="rec" style="margin-top:0"><b>Qué tienes que grabar</b>'+(cr.swings_por_angulo||1)+' swings '+esc(ang.join(' y '))+', con '+esc(CLUB[cr.palo]||cr.palo||'tu palo')+'.'+(cr.nota?' '+esc(cr.nota):'')+'</div>':'')
    + '<label class="l">Tus videos <span style="text-transform:none;letter-spacing:0;font-weight:500">(hasta '+maxv+')</span></label>'
    + '<div class="drop" onclick="if(!SENDING)$(\'reqFiles\').click()">Toca para elegir tus videos del celular o computador</div>'
    + '<div class="files" id="reqList"></div>'
    + '<label class="l">¿Qué quieres trabajar?</label>'
    + '<textarea id="reqNote" maxlength="2000" placeholder="Ej: le pego con slice al driver y pierdo distancia. Juego hace 3 años, hándicap 18."></textarea>'
    + (paid?'<div class="note pay">Pagas de forma segura con <b>Flow</b>: Webpay (crédito o débito), otras tarjetas o transferencia. Tu coach recibe la clase apenas se confirma el pago.</div>':'')
    + '<div class="err" id="reqErr"></div>'
    + '<div class="acts"><button onclick="closeReq()" id="reqCancel">Cancelar</button><button class="go" id="reqGo" onclick="sendReq()">'+(paid?'Ir a pagar':'Enviar solicitud')+'</button></div>';
  $('reqBody').className='modal rq';
  $('reqBody').innerHTML=h;
  renderFiles();
}
// precio + cargo por servicio = total (y lo que se cobra en pesos)
function desglose(o){
  var cur=o.currency||'CLP', baseClp=MGL_PRECIO.clp(o.price,cur), feeClp=Math.round(baseClp*FEE_PCT/100), totClp=baseClp+feeClp;
  var cl=MGL_PRECIO.esChile();
  // fuera de Chile: si la oferta está en USD se calcula en dólares (sin ida y vuelta por pesos)
  var bUsd = cur==='USD' ? Number(o.price) : MGL_PRECIO.usd(baseClp,'CLP');
  var fUsd = Math.round(bUsd*FEE_PCT)/100, tUsd = Math.round((bUsd+fUsd)*100)/100;
  function f(clpVal, usdVal){ return cl ? MGL_PRECIO.fmtCLP(clpVal) : MGL_PRECIO.fmtUSD(usdVal); }
  return '<div class="desg">'
    + '<div><span>Clase</span><span>'+f(baseClp,bUsd)+'</span></div>'
    + '<div><span>Cargo por servicio ('+String(FEE_PCT).replace('.',',')+'%)</span><span>'+f(feeClp,fUsd)+'</span></div>'
    + '<div class="tot"><span>Total</span><span>'+f(totClp,tUsd)+'</span></div>'
    + (cl ? '' : '<div class="clp">Se cobra en pesos chilenos: <b>'+MGL_PRECIO.fmtCLP(totClp)+' CLP</b> aprox. Tu banco hace la conversión.</div>')
    + '</div>';
}
function closeReq(){ if(SENDING) return; $('reqModal').classList.remove('on'); REQ=null; }
function renderFiles(){
  var box=$('reqList'); if(!box) return;
  box.innerHTML = REQ.files.map(function(f,i){
    return '<div class="fl"><span>'+esc(f.file.name)+'</span><em id="fp'+i+'">'+fmtMB(f.file.size)+'</em>'
      + (SENDING?'':'<button onclick="REQ.files.splice('+i+',1);renderFiles()" aria-label="Quitar">×</button>')
      + '<i id="fb'+i+'"></i></div>';
  }).join('');
}
$('reqFiles').addEventListener('change', function(){
  if(!REQ) return;
  var maxv=REQ.o.max_videos||6;
  Array.prototype.forEach.call(this.files, function(f){
    if(REQ.files.length>=maxv) return;
    if(f.size > 500*1024*1024){ showReqErr('"'+f.name+'" pesa más de 500 MB.'); return; }
    REQ.files.push({ file:f });
  });
  this.value='';
  renderFiles();
});
function showReqErr(m){ var e=$('reqErr'); if(!e) return; e.textContent=m; e.style.display=m?'block':'none'; }

function uploadOne(path, file, i){
  return new Promise(function(resolve, reject){
    var xhr=new XMLHttpRequest();
    xhr.open('POST', SUPABASE_URL+'/storage/v1/object/lesson-uploads/'+path, true);
    xhr.setRequestHeader('Authorization','Bearer '+REQ.token);
    xhr.setRequestHeader('apikey', SUPABASE_ANON_KEY);
    xhr.setRequestHeader('x-upsert','false');
    xhr.setRequestHeader('Content-Type', file.type||'application/octet-stream');
    xhr.upload.onprogress=function(e){ if(e.lengthComputable){ var b=$('fb'+i), p=$('fp'+i), pc=Math.round(e.loaded/e.total*100); if(b) b.style.width=pc+'%'; if(p) p.textContent=pc+'%'; } };
    xhr.onload=function(){
      if(xhr.status>=200 && xhr.status<300) resolve(path);
      else { var m=''; try{ m=JSON.parse(xhr.responseText).message; }catch(e){} reject(new Error(m||('Error '+xhr.status))); }
    };
    xhr.onerror=function(){ reject(new Error('Sin conexión')); };
    xhr.send(file);
  });
}

async function sendReq(){
  if(!REQ || SENDING) return;
  showReqErr('');
  var note=$('reqNote').value.trim();
  if(!REQ.files.length){ showReqErr('Sube al menos un video de tu swing.'); return; }
  if(note.length<5){ showReqErr('Cuéntale brevemente al coach qué quieres trabajar.'); return; }
  SENDING=true; renderFiles();
  $('reqGo').disabled=true; $('reqGo').textContent='Subiendo videos…'; $('reqCancel').disabled=true;
  var lessonId=null, paid=Number(REQ.o.price)>0;

  var folder=Date.now().toString(36), paths=[];
  try{
    for(var i=0;i<REQ.files.length;i++){
      var f=REQ.files[i].file, ext=(f.name.split('.').pop()||'mp4').toLowerCase().replace(/[^a-z0-9]/g,'')||'mp4';
      paths.push(await uploadOne(REQ.user.id+'/'+folder+'/'+(i+1)+'.'+ext, f, i));
    }
    $('reqGo').textContent='Enviando…';
    var o=REQ.o;
    var r = await sb.rpc('mgl_clase_pedir',{
      p_offering:o.id, p_note:note, p_videos:paths,
      p_country: MGL_PRECIO.esChile()?'CL':'XX',
      p_price_clp: MGL_PRECIO.clp(o.price, o.currency||'CLP')
    });
    if(r.error) throw r.error;
    lessonId=r.data;
  }catch(e){
    SENDING=false;
    if(paths.length) sb.storage.from('lesson-uploads').remove(paths);
    var m=(e && e.message)||'';
    showReqErr(/mgl_clase_pedir|lesson-uploads|Bucket not found|PGRST202/i.test(m)
      ? 'Las clases todavía no están activadas en la plataforma. Inténtalo más tarde.'
      : 'No se pudo enviar: '+m);
    $('reqGo').disabled=false; $('reqGo').textContent='Enviar solicitud'; $('reqCancel').disabled=false;
    renderFiles();
    return;
  }
  try{ localStorage.removeItem('mgl_pedir'); }catch(e){}

  // clase pagada: crear el cobro en Flow y llevar al alumno a pagar
  if(paid && lessonId){
    $('reqGo').textContent='Abriendo Flow…';
    try{
      var s2=await sb.auth.getSession();
      var resp=await fetch('/api/pago-crear',{ method:'POST',
        headers:{'Content-Type':'application/json','Authorization':'Bearer '+s2.data.session.access_token},
        body:JSON.stringify({lesson_id:lessonId}) });
      var j=await resp.json().catch(function(){ return {}; });
      if(resp.ok && j.url){ window.location.href=j.url; return; }
      throw new Error(j.error||'No se pudo abrir el pago');
    }catch(e){
      SENDING=false;
      $('reqBody').className='modal rq done';
      $('reqBody').innerHTML='<h3>Falta el pago</h3><p>Tus videos quedaron guardados, pero no pudimos abrir el pago ('+esc(e.message)+'). Puedes pagar la clase desde <b>Mis clases</b>.</p>'
        + '<a href="/es/coachhub/clases.html?clase='+encodeURIComponent(lessonId)+'">Ir a Mis clases</a>';
      return;
    }
  }

  SENDING=false;
  $('reqBody').className='modal rq done';
  $('reqBody').innerHTML='<h3>¡Solicitud enviada!</h3><p>'+esc(C.display_name)+' recibió tus videos. Te va a responder en '
    + (C.response_sla_hours<=72?C.response_sla_hours+' horas':Math.round(C.response_sla_hours/24)+' días')+' como máximo.</p>'
    + '<a href="/es/coachhub/clases.html">Ver mis clases</a>';
}

// Si volvió de crear su cuenta para pedir una clase, se abre directo
function reabrirPedido(){
  try{
    var p=JSON.parse(localStorage.getItem('mgl_pedir')||'null');
    if(!p || p.c!==C.slug || Date.now()-p.t > 86400000) return;
    sb.auth.getSession().then(function(r){
      if(r.data && r.data.session && OFFERS.some(function(o){ return o.id===p.o; })) buy(p.o);
    });
  }catch(e){}
}
