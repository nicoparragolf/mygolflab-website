<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<script src="/js/mgl-tema.js"></script>
<script src="/js/mgl-i18n.js"></script>
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>Contenido · Coach Hub</title>
<meta name="robots" content="noindex">
<meta name="theme-color" content="#0a0a0a">
<link rel="manifest" href="/es/coachhub/manifest.json">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Coach Hub">
<link rel="apple-touch-icon" href="/es/coachhub/apple-touch-icon.png">
<link rel="icon" href="/es/coachhub/favicon-32.png" sizes="32x32">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Barlow:wght@400;500;600&family=Barlow+Condensed:wght@500;600;700&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="/js/mgl-products.js" data-product="hub"></script>
<script src="/js/mgl-precios.js"></script>
<!--
  Coach Hub · Contenido exclusivo
  Archivo: /es/coachhub/contenido.html
  Versión: 1.0 · 2026-11-02

  COACH: arma colecciones de videos con tips y las vende con pago único
         (aparte de sus clases). Sube o graba videos, marca vistas previas
         gratis, fija precio en USD o CLP, publica, ve sus ventas y puede
         dar acceso a mano a un correo.
  JUGADOR: "Mi contenido" — las colecciones que compró.
  Requiere sql/coach_hub_contenido.sql. Sin template literals a propósito.
-->
<style>
  :root{
    --bg:var(--c0a0a0a,#0a0a0a); --bg2:var(--c111111,#111); --card:var(--c141414,#141414); --card2:var(--c1a1a1a,#1a1a1a);
    --border:var(--c262626,#262626); --border2:var(--c333333,#333);
    --teal:var(--cd4c5a9,#D4C5A9); --teal-dim:var(--c7d7259,#7D7259); --gold:var(--cf0b860,#F0B860);
    --text:var(--cf5f5f5,#f5f5f5); --muted:var(--c8a8a8a,#8a8a8a); --muted2:var(--c666666,#666);
    --red:var(--ce06a6a,#e06a6a); --green:var(--c8fd19e,#8fd19e); --blue:var(--c8fb8e0,#8fb8e0);
  }
  *{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
  body{background:var(--bg);color:var(--text);font-family:'Barlow',sans-serif;-webkit-font-smoothing:antialiased;min-height:100vh}
  a{color:inherit;text-decoration:none}
  button,textarea,input,select{font-family:inherit;color:inherit}
  html{scrollbar-width:thin;scrollbar-color:rgba(var(--r255_255_255,255,255,255),.09) var(--c0a0a0a,#0a0a0a)}
  ::-webkit-scrollbar{width:10px;height:10px}
  ::-webkit-scrollbar-track{background:var(--c0a0a0a,#0a0a0a)}
  ::-webkit-scrollbar-thumb{background:rgba(var(--r255_255_255,255,255,255),.09);border-radius:10px;border:3px solid var(--c0a0a0a,#0a0a0a)}

  /* header */
  #siteHeader{position:sticky;top:0;z-index:50;background:rgba(var(--r10_10_10,10,10,10),.88);backdrop-filter:blur(12px);border-bottom:1px solid var(--border);padding-top:env(safe-area-inset-top)}
  .nav-inner{max-width:1200px;margin:0 auto;padding:0 20px;height:62px;display:flex;align-items:center;gap:18px}
  .brand{font-family:'Bebas Neue',sans-serif;font-size:25px;letter-spacing:2px}
  .brand span{color:var(--teal)}
  .nav-links{display:flex;gap:20px;margin-left:auto}
  .nav-links a{font-family:'Barlow Condensed';font-size:16px;font-weight:500;color:var(--muted);text-transform:uppercase;letter-spacing:.5px;white-space:nowrap}
  .nav-links a:hover{color:var(--text)}
  .nav-links a.active{color:var(--teal)}
  .hamburger{display:none;flex-direction:column;gap:5px;background:none;border:none;cursor:pointer;padding:8px;margin-left:4px}
  .hamburger span{width:24px;height:2px;background:var(--text);transition:transform .2s,opacity .2s}
  .hamburger.open span:nth-child(1){transform:translateY(7px) rotate(45deg)}
  .hamburger.open span:nth-child(2){opacity:0}
  .hamburger.open span:nth-child(3){transform:translateY(-7px) rotate(-45deg)}
  .avatar{width:36px;height:36px;border-radius:50%;background:var(--teal-dim);display:flex;align-items:center;justify-content:center;font-family:'Barlow Condensed';font-weight:700;color:#1C1709;overflow:hidden;flex:0 0 auto}
  .avatar img{width:100%;height:100%;object-fit:cover}

  .wrap{max-width:1200px;margin:0 auto;padding:28px 20px calc(70px + env(safe-area-inset-bottom))}
  .head{display:flex;align-items:flex-end;justify-content:space-between;gap:16px;flex-wrap:wrap}
  .head h1{font-family:'Bebas Neue';font-size:44px;letter-spacing:1px;line-height:1}
  .head p{color:var(--muted);margin-top:6px;font-size:15px;max-width:640px;line-height:1.5}
  .head .hb{display:flex;gap:10px;flex-wrap:wrap}
  .lnk{font-family:'Barlow Condensed';font-size:14px;font-weight:700;letter-spacing:.6px;text-transform:uppercase;color:var(--teal);border:1px solid var(--teal-dim);border-radius:20px;padding:8px 15px;white-space:nowrap;background:none;cursor:pointer}
  .lnk:hover{background:rgba(var(--r212_197_169,212,197,169),.08)}
  .lnk.solid{background:var(--teal);color:#1C1709;border-color:var(--teal)}
  .lnk.solid:hover{filter:brightness(1.06)}
  h2.sh{font-family:'Barlow Condensed';font-weight:700;font-size:20px;letter-spacing:.3px;margin:30px 0 12px}

  .mes{display:grid;grid-template-columns:repeat(3,1fr);gap:12px;margin-top:20px}
  .mi{background:var(--card);border:1px solid var(--border);border-radius:16px;padding:14px 16px}
  .mi .n{font-family:'Bebas Neue';font-size:30px;letter-spacing:.5px;color:var(--teal);line-height:1}
  .mi .l{font-family:'Barlow Condensed';font-size:12.5px;font-weight:600;letter-spacing:.7px;text-transform:uppercase;color:var(--muted);margin-top:4px}
  .hint{color:var(--muted);font-size:13px;margin-top:6px;line-height:1.45}

  /* tarjetas de colección */
  .grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:16px;margin-top:18px}
  .cc{background:var(--card);border:1px solid var(--border);border-radius:18px;overflow:hidden;cursor:pointer;transition:border-color .2s,transform .2s;display:flex;flex-direction:column}
  .cc:hover{border-color:var(--teal-dim);transform:translateY(-2px)}
  .cover{position:relative;aspect-ratio:16/10;background:linear-gradient(145deg,var(--c2b2619,#2B2619),var(--c121212,#121212) 70%);overflow:hidden}
  .cover img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;display:block}
  .cover .ph{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;color:var(--teal-dim)}
  .cover .ph svg{width:44px;height:44px}
  .cover .badge{position:absolute;left:10px;top:10px;font-family:'Barlow Condensed';font-size:11.5px;font-weight:700;letter-spacing:.7px;text-transform:uppercase;border-radius:20px;padding:3px 10px;background:rgba(0,0,0,.72);border:1px solid var(--border2);color:var(--cdddddd,#ddd)}
  .cover .badge.on{color:#1C1709;background:var(--teal);border-color:var(--teal)}
  .cover .cnt{position:absolute;right:10px;bottom:10px;font-family:'Barlow Condensed';font-size:12px;font-weight:700;letter-spacing:.5px;background:rgba(0,0,0,.72);border-radius:6px;padding:2px 8px;color:var(--ce8e8e8,#e8e8e8)}
  .cc .bd{padding:14px 16px 16px;display:flex;flex-direction:column;gap:6px;flex:1 1 auto}
  .cc .ar{font-family:'Barlow Condensed';font-size:12px;font-weight:700;letter-spacing:.7px;text-transform:uppercase;color:var(--gold)}
  .cc h3{font-family:'Barlow Condensed';font-weight:700;font-size:21px;line-height:1.15}
  .cc .ft{display:flex;align-items:baseline;justify-content:space-between;gap:10px;margin-top:auto;padding-top:8px}
  .cc .pr{font-family:'Bebas Neue';font-size:26px;color:var(--teal);line-height:1;letter-spacing:.5px}
  .cc .sl{font-size:13px;color:var(--muted)}
  .cc.new{border-style:dashed;border-color:var(--border2);align-items:center;justify-content:center;min-height:260px;color:var(--muted);text-align:center;gap:10px;padding:20px}
  .cc.new:hover{color:var(--teal)}
  .cc.new b{font-family:'Barlow Condensed';font-size:19px;letter-spacing:.4px;text-transform:uppercase}
  .cc.new .plus{font-size:42px;line-height:1;font-weight:300}

  .empty{background:var(--card);border:1px dashed var(--border2);border-radius:16px;padding:30px 24px;color:var(--muted);line-height:1.6;margin-top:18px}
  .empty h3{font-family:'Bebas Neue';font-size:28px;letter-spacing:1px;color:var(--text);margin-bottom:6px}
  .steps{display:grid;grid-template-columns:repeat(3,1fr);gap:12px;margin-top:16px}
  .step{background:var(--bg2);border:1px solid var(--border);border-radius:14px;padding:14px}
  .step b{display:block;font-family:'Bebas Neue';font-size:24px;color:var(--teal);letter-spacing:.5px}
  .step span{font-size:14px;color:var(--ccfcfcf,#cfcfcf)}
  .setup{max-width:560px;margin:60px auto;text-align:center;color:var(--muted);line-height:1.6}
  .setup h2{font-family:'Bebas Neue';font-size:32px;color:var(--text);letter-spacing:1px;margin-bottom:8px}
  .setup code{background:var(--c1a1a1a,#1a1a1a);border:1px solid var(--border);border-radius:6px;padding:2px 6px;color:var(--teal);font-size:13px}
  .loading{color:var(--muted);padding:60px 0;text-align:center}

  /* editor */
  .ov{position:fixed;inset:0;background:rgba(0,0,0,.7);z-index:100;display:none;justify-content:flex-end}
  .ov.on{display:flex}
  .drawer{width:min(760px,100%);height:100%;background:var(--bg);border-left:1px solid var(--border);overflow-y:auto;padding:20px 24px calc(30px + env(safe-area-inset-bottom));animation:slide .22s ease}
  @keyframes slide{from{transform:translateX(30px);opacity:.4}to{transform:none;opacity:1}}
  .d-top{display:flex;align-items:center;gap:12px}
  .d-top h2{font-family:'Bebas Neue';font-size:32px;letter-spacing:1px;line-height:1;flex:1 1 auto;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .d-top .x{background:none;border:1px solid var(--border2);border-radius:10px;width:38px;height:38px;cursor:pointer;font-size:20px;color:var(--muted);flex:0 0 auto}
  .pubbar{display:flex;align-items:center;gap:12px;flex-wrap:wrap;background:var(--card);border:1px solid var(--border);border-radius:14px;padding:12px 14px;margin-top:14px}
  .pubbar .s{flex:1 1 auto;font-size:14px;color:var(--ccfcfcf,#cfcfcf);line-height:1.4}
  .pubbar .s b{font-family:'Barlow Condensed';letter-spacing:.6px;text-transform:uppercase;font-size:13px}
  .pubbar .s b.on{color:var(--green)}
  .pubbar .s b.off{color:var(--gold)}
  .tabs{display:flex;gap:6px;margin:18px 0 14px;border-bottom:1px solid var(--border);overflow-x:auto}
  .tab{background:none;border:none;border-bottom:2px solid transparent;padding:10px 14px;font-family:'Barlow Condensed';font-size:16px;font-weight:600;letter-spacing:.5px;text-transform:uppercase;color:var(--muted);cursor:pointer;white-space:nowrap;margin-bottom:-1px}
  .tab:hover{color:var(--text)}
  .tab.on{color:var(--teal);border-bottom-color:var(--teal)}
  .tab:disabled{opacity:.4;cursor:default}
  .tab .n{display:inline-flex;align-items:center;justify-content:center;min-width:20px;height:20px;padding:0 6px;margin-left:6px;border-radius:10px;background:var(--c222222,#222);color:var(--muted);font-size:12px}

  label.l{display:block;font-family:'Barlow Condensed';font-size:13px;font-weight:700;letter-spacing:.6px;text-transform:uppercase;color:var(--muted);margin:16px 0 6px}
  .inp{width:100%;background:var(--bg2);border:1px solid var(--border2);border-radius:12px;padding:11px 13px;font-size:15px;line-height:1.45;outline:none}
  .inp:focus{border-color:var(--teal-dim)}
  textarea.inp{min-height:110px;resize:vertical}
  select.inp{appearance:none;-webkit-appearance:none;background-image:linear-gradient(45deg,transparent 50%,var(--c888888,#888) 50%),linear-gradient(135deg,var(--c888888,#888) 50%,transparent 50%);background-position:calc(100% - 18px) 50%,calc(100% - 13px) 50%;background-size:5px 5px;background-repeat:no-repeat;padding-right:34px}
  .row2{display:grid;grid-template-columns:1fr 1fr;gap:12px}
  .price{display:grid;grid-template-columns:1fr 110px;gap:8px}
  .chips{display:flex;gap:8px;flex-wrap:wrap}
  .chip{background:var(--bg2);border:1px solid var(--border2);border-radius:20px;padding:7px 13px;font-size:14px;cursor:pointer}
  .chip.on{border-color:var(--teal);color:var(--teal);background:rgba(var(--r212_197_169,212,197,169),.08)}
  .covered{display:flex;gap:14px;align-items:center;flex-wrap:wrap}
  .covered .cover{width:220px;border-radius:12px;border:1px solid var(--border)}
  .acts{display:flex;gap:10px;flex-wrap:wrap;margin-top:18px}
  .btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;padding:11px 18px;border-radius:11px;border:1px solid var(--border2);background:var(--card2);font-family:'Barlow Condensed';font-weight:700;font-size:15px;letter-spacing:.5px;text-transform:uppercase;cursor:pointer;white-space:nowrap}
  .btn:hover{border-color:var(--teal-dim)}
  .btn.primary{background:var(--teal);color:#1C1709;border-color:var(--teal)}
  .btn.primary:hover{filter:brightness(1.06)}
  .btn.danger{color:var(--red);border-color:rgba(var(--r224_106_106,224,106,106),.35);background:transparent}
  .btn.sm{padding:7px 12px;font-size:13px;border-radius:9px}
  .btn:disabled{opacity:.5;cursor:default}
  .btn.grow{flex:1 1 auto}
  .note{font-size:13.5px;color:var(--ce9cf9f,#e9cf9f);background:rgba(var(--r240_184_96,240,184,96),.08);border:1px solid rgba(var(--r240_184_96,240,184,96),.3);border-radius:10px;padding:10px 12px;margin-top:14px;line-height:1.45}
  .note.ok{color:var(--ccfe9d4,#cfe9d4);background:rgba(var(--r143_209_158,143,209,158),.08);border-color:rgba(var(--r143_209_158,143,209,158),.3)}
  .err{font-size:13.5px;color:var(--cf0a0a0,#f0a0a0);margin-top:10px}

  /* videos */
  .upbox{display:grid;grid-template-columns:1fr 1fr;gap:10px}
  .drop{border:1.5px dashed var(--border2);border-radius:14px;padding:18px 14px;text-align:center;color:var(--muted);font-size:14px;cursor:pointer;line-height:1.45;transition:border-color .2s,color .2s}
  .drop:hover,.drop.over{border-color:var(--teal-dim);color:var(--text)}
  .drop b{display:block;font-family:'Barlow Condensed';font-size:16px;letter-spacing:.5px;text-transform:uppercase;color:var(--teal);margin-bottom:2px}
  .queue{display:flex;flex-direction:column;gap:6px;margin-top:10px}
  .q{position:relative;overflow:hidden;display:flex;gap:10px;align-items:center;background:var(--bg2);border:1px solid var(--border);border-radius:10px;padding:8px 10px;font-size:13.5px}
  .q span{flex:1 1 auto;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .q em{font-style:normal;color:var(--muted);font-size:12px}
  .q i{position:absolute;left:0;bottom:0;height:3px;background:var(--teal);width:0;transition:width .2s}
  .q.bad em{color:var(--red)}
  .items{display:flex;flex-direction:column;gap:10px;margin-top:16px}
  .it{display:grid;grid-template-columns:auto 64px 1fr auto;gap:12px;align-items:start;background:var(--card);border:1px solid var(--border);border-radius:14px;padding:12px}
  .it .num{font-family:'Bebas Neue';font-size:22px;color:var(--muted2);width:22px;text-align:center;padding-top:2px}
  .it .th{width:64px;aspect-ratio:9/16;border-radius:9px;overflow:hidden;background:#000;border:1px solid var(--border2);cursor:pointer;position:relative}
  .it .th img{width:100%;height:100%;object-fit:cover;display:block}
  .it .th .pl{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;background:rgba(0,0,0,.25)}
  .it .th .pl svg{width:22px;height:22px}
  .it .mn{min-width:0;display:flex;flex-direction:column;gap:6px}
  .it .mn input.inp{padding:8px 10px;font-size:15px;font-weight:600;border-radius:9px}
  .it .mn textarea.inp{min-height:54px;padding:8px 10px;font-size:14px;border-radius:9px}
  .it .meta{display:flex;align-items:center;gap:10px;flex-wrap:wrap;font-size:12.5px;color:var(--muted)}
  .tgl{display:inline-flex;align-items:center;gap:7px;cursor:pointer;font-size:13px;color:var(--ccfcfcf,#cfcfcf);user-select:none}
  .tgl input{display:none}
  .tgl .sw{width:32px;height:18px;border-radius:9px;background:var(--c2a2a2a,#2a2a2a);border:1px solid var(--border2);position:relative;transition:background .2s}
  .tgl .sw::after{content:'';position:absolute;left:2px;top:2px;width:12px;height:12px;border-radius:50%;background:var(--c888888,#888);transition:transform .2s,background .2s}
  .tgl input:checked + .sw{background:rgba(var(--r212_197_169,212,197,169),.25);border-color:var(--teal-dim)}
  .tgl input:checked + .sw::after{transform:translateX(14px);background:var(--teal)}
  .it .side{display:flex;flex-direction:column;gap:6px}
  .ib{width:32px;height:32px;border-radius:8px;border:1px solid var(--border2);background:var(--card2);cursor:pointer;color:var(--muted);font-size:15px;line-height:1;display:flex;align-items:center;justify-content:center}
  .ib:hover{color:var(--text);border-color:var(--teal-dim)}
  .ib.del:hover{color:var(--red);border-color:rgba(var(--r224_106_106,224,106,106),.45)}
  .ib:disabled{opacity:.3;cursor:default}

  /* alumnos */
  .buyers{display:flex;flex-direction:column;gap:8px;margin-top:12px}
  .by{display:grid;grid-template-columns:auto 1fr auto;gap:12px;align-items:center;background:var(--card);border:1px solid var(--border);border-radius:12px;padding:10px 12px}
  .by .av{width:38px;height:38px;border-radius:50%;background:var(--c2b2619,#2B2619);color:var(--teal);display:flex;align-items:center;justify-content:center;font-family:'Barlow Condensed';font-weight:700}
  .by b{display:block;font-size:15px}
  .by small{display:block;color:var(--muted);font-size:13px;word-break:break-all}
  .by .r{text-align:right;font-size:13px;color:var(--muted)}
  .st{font-family:'Barlow Condensed';font-size:11.5px;font-weight:700;letter-spacing:.7px;text-transform:uppercase;border-radius:20px;padding:2px 9px;border:1px solid;display:inline-block}
  .st.pagado{color:var(--green);border-color:rgba(var(--r143_209_158,143,209,158),.4)}
  .st.otorgado{color:var(--blue);border-color:rgba(var(--r143_184_224,143,184,224),.4)}
  .st.reembolsado{color:var(--muted);border-color:var(--border2)}
  .grant{display:flex;gap:8px;margin-top:6px}
  .grant .inp{flex:1 1 auto}

  /* reproductor */
  .lb{position:fixed;inset:0;background:rgba(0,0,0,.92);z-index:150;display:none;align-items:center;justify-content:center;padding:20px}
  .lb.on{display:flex}
  .lb video{max-width:100%;max-height:calc(100vh - 80px);border-radius:12px;background:#000}
  .lb .x{position:absolute;top:calc(14px + env(safe-area-inset-top));right:14px;background:rgba(var(--r255_255_255,255,255,255),.08);border:1px solid var(--border2);border-radius:10px;width:40px;height:40px;font-size:22px;cursor:pointer;color:var(--cdddddd,#ddd)}

  .toast{position:fixed;left:50%;bottom:calc(24px + env(safe-area-inset-bottom));transform:translateX(-50%) translateY(16px);background:var(--c222222,#222);border:1px solid var(--border2);color:#fff;padding:10px 16px;border-radius:10px;font-size:14px;opacity:0;pointer-events:none;transition:all .25s;z-index:300;max-width:calc(100vw - 32px)}
  .toast.show{opacity:1;transform:translateX(-50%) translateY(0)}
  .toast.bad{border-color:rgba(var(--r224_106_106,224,106,106),.5)}

  @media(max-width:900px){
    .nav-links{display:none}
    .nav-links.mobile-open{display:flex;flex-direction:column;gap:0;position:absolute;top:100%;left:0;right:0;background:rgba(var(--r10_10_10,10,10,10),.97);border-bottom:1px solid var(--border);padding:6px 20px 14px;margin:0}
    .nav-links.mobile-open a{padding:15px 0;font-size:19px;border-bottom:1px solid var(--border)}
    .nav-links.mobile-open a:last-child{border-bottom:none}
    .hamburger{display:flex}
    .nav-inner .avatar{margin-left:auto}
  }
  @media(max-width:620px){
    .head h1{font-size:38px}
    .mes{gap:8px} .mi{padding:12px} .mi .n{font-size:24px}

<script>
// ============================================================

var SUPABASE_URL = 'https://yulpqupmftdjbepqiscs.supabase.co';
var SUPABASE_ANON_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Inl1bHBxdXBtZnRkamJlcHFpc2NzIiwicm9sZSI6ImFub24iLCJpYXQiOjE3NzQxNDA0NjYsImV4cCI6MjA4OTcxNjQ2Nn0.e-8SEni5uxUoigXCkVM2VYm7UrHYxxVl7hPsUrZvYao';

function $(id){ return document.getElementById(id); }
function esc(s){ return String(s==null?'':s).replace(/[&<>"']/g,function(c){ return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]; }); }
function toast(msg,bad){ var t=$('toast'); t.textContent=msg; t.className='toast show'+(bad?' bad':''); clearTimeout(t._h); t._h=setTimeout(function(){ t.className='toast'; },3400); }
function initialsOf(name){ var p=String(name||'?').trim().split(/\s+/); return ((p[0]||'?').charAt(0)+((p[1]||'').charAt(0))).toUpperCase(); }
function pubUrl(p){ return p ? SUPABASE_URL+'/storage/v1/object/public/'+BUCKET_PUB+'/'+p.split('/').map(encodeURIComponent).join('/') : ''; }
function fmtDur(s){ s=Math.round(Number(s)||0); if(!s) return ''; var m=Math.floor(s/60), r=s%60; return m+':'+('0'+r).slice(-2); }
function fmtTotal(s){ s=Math.round(Number(s)||0); if(!s) return ''; if(s<60) return s+' s'; var m=Math.round(s/60); if(m<60) return m+' min'; return Math.floor(m/60)+' h '+(m%60?(m%60)+' min':''); }
function fmtMB(b){ return b>=1073741824 ? (b/1073741824).toFixed(1)+' GB' : Math.max(1,Math.round(b/1048576))+' MB'; }
function fmtDate(iso){ var d=new Date(iso), m=['ene','feb','mar','abr','may','jun','jul','ago','sep','oct','nov','dic']; return d.getDate()+' '+m[d.getMonth()]+' '+d.getFullYear(); }
function precioCol(c){
  if(!Number(c.price)) return 'Gratis';
  return c.currency==='USD' ? MGL_PRECIO.fmtUSD(Number(c.price)) : MGL_PRECIO.fmtCLP(Number(c.price));
}
function isMissing(err){
  var m=((err&&err.message)||'')+' '+((err&&err.code)||'');
  return /coach_collections|content_purchases|coach_collection_items|mgl_contenido|42P01|PGRST205|PGRST202/.test(m);
}
var ICON_FILM='<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><rect x="2" y="4" width="20" height="16" rx="3"/><path d="M10 9l5 3-5 3z"/></svg>';
var ICON_PLAY='<svg viewBox="0 0 24 24" fill="#fff"><path d="M8 5v14l11-7z"/></svg>';

// ============================================================
// MENÚ SEGÚN ROL
// ============================================================
function buildNav(){
  var items = IS_COACH
    ? [['/es/coachhub/dashboard.html','Dashboard'],['/es/coachhub/jugador.html','Mis jugadores'],['/es/coachhub/clases.html','Clases','clases'],['/es/coachhub/contenido.html','Contenido','contenido'],['/es/coachhub/mensajes.html','Mensajes','mensajes'],['/es/coachhub/analisis.html?from=dash','Analizar swing']]
    : [['/es/coachhub/jugador.html','Mi perfil'],['/es/coachhub/clases.html','Mis clases','clases'],['/es/coachhub/contenido.html','Mi contenido','contenido'],['/es/coachhub/mensajes.html','Mensajes','mensajes'],['/es/coaches/','Coaches']];
  var h='';

  $('navLinks').innerHTML=h;

}

// ============================================================
// INICIO
// ============================================================
async function init(){
  var s = await sb.auth.getSession();
  if(!s.data.session){ window.location.href='/es/coachhub/entrar.html?volver='+encodeURIComponent('/es/coachhub/contenido.html'); return; }
  USER = s.data.session.user; TOKEN = s.data.session.access_token;
  sb.auth.onAuthStateChange(function(ev, ss){ if(ss && ss.access_token) TOKEN=ss.access_token; });

  var meta = USER.user_metadata||{};
  var av=$('navAvatar');
  if(meta.avatar_url || meta.picture) av.innerHTML='<img src="'+esc(meta.avatar_url||meta.picture)+'" alt="">';
  else av.textContent=(meta.first_name||meta.full_name||USER.email||'?').charAt(0).toUpperCase();

  var pr = await sb.from('profiles').select('role').eq('id',USER.id).maybeSingle();
  ROLE = (pr.data && pr.data.role) || 'jugador';
  IS_COACH = (ROLE==='coach' || ROLE==='ambos');
  buildNav();
  document.title = (IS_COACH?'Contenido':'Mi contenido')+' · Coach Hub';
  await load();
  var qp=new URLSearchParams(location.search);
  if(IS_COACH && qp.get('c')) openEditor(qp.get('c'));
  if(IS_COACH && qp.get('nueva')) openEditor(null);
}

async function load(){
  if(IS_COACH){
    var r = await sb.from('coach_collections').select('*').eq('coach_id',USER.id).order('sort_order').order('created_at');
    if(r.error){ if(isMissing(r.error)){ showSetup(); return; } $('wrap').innerHTML='<div class="empty">No se pudo cargar tu contenido.</div>'; return; }
    COLS = r.data||[];
    ITEMS = {};
    if(COLS.length){
      var ri = await sb.from('coach_collection_items').select('*').eq('coach_id',USER.id).order('sort_order').order('created_at');
      (ri.data||[]).forEach(function(it){ (ITEMS[it.collection_id]=ITEMS[it.collection_id]||[]).push(it); });
      var rs = await sb.from('content_purchases').select('*').eq('coach_id',USER.id).order('created_at',{ascending:false});
      SALES = rs.data||[];
    }
  }
  // lo que compró (jugador, o coach con rol "ambos")
  if(!IS_COACH || ROLE==='ambos'){
    var rm = await sb.from('content_purchases').select('*').eq('student_id',USER.id).order('created_at',{ascending:false});
    if(rm.error && isMissing(rm.error) && !IS_COACH){ showSetup(); return; }
    MINE = (rm.data||[]).filter(function(p){ return p.status==='pagado' || p.status==='otorgado' || p.status==='por_pagar' || p.status==='fallido'; });
    if(MINE.length){
      var ids = MINE.map(function(p){ return p.collection_id; });
      var rc = await sb.from('coach_collections').select('*').in('id',ids);
      (rc.data||[]).forEach(function(c){ MINE_COLS[c.id]=c; });
      var ci = (rc.data||[]).map(function(c){ return c.coach_id; }).filter(function(v,i,a){ return a.indexOf(v)===i; });
      if(ci.length){
        var rp = await sb.from('coach_profiles').select('coach_id,display_name,slug,photo_path').in('coach_id',ci);
        (rp.data||[]).forEach(function(x){ COACHES[x.coach_id]=x; });
      }
    }
  }
  MGL_PRECIO.listo(render);
}

// ============================================================
// LISTA
// ============================================================
function salesOf(cid){ return SALES.filter(function(p){ return p.collection_id===cid && (p.status==='pagado' || p.status==='otorgado'); }); }

function resumen(){
  var now=new Date(), y=now.getFullYear(), m=now.getMonth();
  var mes=SALES.filter(function(p){ if(p.status!=='pagado' || !p.paid_at) return false; var d=new Date(p.paid_at); return d.getFullYear()===y && d.getMonth()===m; });
  var ganado=mes.reduce(function(a,p){ return a+(Number(p.coach_payout_clp)||0); },0);
  var conAcceso=SALES.filter(function(p){ return p.status==='pagado' || p.status==='otorgado'; }).map(function(p){ return p.student_id; }).filter(function(v,i,a){ return a.indexOf(v)===i; }).length;
  var M=['enero','febrero','marzo','abril','mayo','junio','julio','agosto','septiembre','octubre','noviembre','diciembre'];
  return '<div class="mes">'
    + '<div class="mi"><div class="n">'+mes.length+'</div><div class="l">Ventas en '+M[m]+'</div></div>'
    + '<div class="mi"><div class="n">'+MGL_PRECIO.fmtCLP(ganado)+'</div><div class="l">Ganado este mes</div></div>'
    + '<div class="mi"><div class="n">'+conAcceso+'</div><div class="l">Alumnos con acceso</div></div>'
    + '</div>'
    + '<div class="hint">Misma comisión que en tus clases (5% → 3% → 2% según tus ventas del mes) y 0% con alumnos que ya eran tuyos. El alumno paga aparte un cargo por servicio.</div>';
}

function coverHTML(c, items, badge){
  var n=(items||[]).length, dur=(items||[]).reduce(function(a,i){ return a+(Number(i.duration_sec)||0); },0);
  var img = c.cover_path ? '<img src="'+esc(pubUrl(c.cover_path))+'" alt="" loading="lazy">'
          : ((items||[])[0] && items[0].thumb_path ? '<img src="'+esc(pubUrl(items[0].thumb_path))+'" alt="" loading="lazy">' : '<div class="ph">'+ICON_FILM+'</div>');
  return '<div class="cover">'+img+(badge||'')
    + '<span class="cnt">'+n+' video'+(n===1?'':'s')+(dur?' · '+fmtTotal(dur):'')+'</span></div>';
}

function render(){
  var h='';
  if(IS_COACH){
    h+='<div class="head"><div><h1>Contenido</h1><p>Vende colecciones de videos con tus tips, aparte de tus clases. El alumno paga una vez y queda con acceso para siempre.</p></div>'
      + '<div class="hb"><a class="lnk" href="/es/coaches/contenido.html?coach='+encodeURIComponent(USER.id)+'" target="_blank" rel="noopener">Ver como alumno</a>'
      + '<button class="lnk solid" onclick="openEditor(null)">+ Nueva colección</button></div></div>';
    if(COLS.length) h+=resumen();
    if(!COLS.length){
      h+='<div class="empty"><h3>Tu primera colección</h3>Agrupa tus mejores tips en un tema (putter, salida, juego corto…) y véndela a cualquier golfista, sea o no tu alumno.'
        + '<div class="steps"><div class="step"><b>1 · Crea</b><span>Ponle nombre, tema y precio (o déjala gratis para atraer alumnos).</span></div>'
        + '<div class="step"><b>2 · Sube o graba</b><span>Videos cortos desde tu celular. Marca uno o dos como vista previa gratis.</span></div>'
        + '<div class="step"><b>3 · Publica</b><span>Aparece en tu vitrina y en el catálogo de contenido de Coach Hub.</span></div></div>'
        + '<div class="acts"><button class="btn primary" onclick="openEditor(null)">Crear colección</button></div></div>';
    } else {
      h+='<div class="grid">';
      COLS.forEach(function(c){
        var it=ITEMS[c.id]||[], ventas=salesOf(c.id).length;
        h+='<div class="cc" onclick="openEditor(\''+c.id+'\')">'
          + coverHTML(c, it, '<span class="badge'+(c.is_published?' on':'')+'">'+(c.is_published?'Publicada':'Borrador')+'</span>')
          + '<div class="bd"><div class="ar">'+esc(areaName(c.area))+(c.level&&c.level!=='todos'?' · '+esc(levelName(c.level)):'')+'</div>'
          + '<h3>'+esc(c.title)+'</h3>'
          + '<div class="ft"><span class="pr">'+precioCol(c)+'</span><span class="sl">'+ventas+' alumno'+(ventas===1?'':'s')+'</span></div></div></div>';
      });
      h+='<div class="cc new" onclick="openEditor(null)"><div class="plus">+</div><b>Nueva colección</b><span style="font-size:14px">Otro tema, otro producto</span></div>';
      h+='</div>';
    }
    if(ROLE==='ambos' && MINE.length){ h+='<h2 class="sh">Contenido que compraste</h2>'+mineGrid(); }
  } else {
    h+='<div class="head"><div><h1>Mi contenido</h1><p>Las colecciones de tips que compraste. Son tuyas para siempre.</p></div>'
      + '<div class="hb"><a class="lnk solid" href="/es/coaches/contenido.html">Explorar contenido</a></div></div>';
    if(!MINE.length){
      h+='<div class="empty"><h3>Aún no tienes contenido</h3>Los coaches de Coach Hub venden colecciones de videos con sus mejores tips: putter, salida, juego corto, físico y estrategia. Pagas una vez y las ves cuando quieras.'
        + '<div class="acts"><a class="btn primary" href="/es/coaches/contenido.html">Ver el catálogo</a></div></div>';
    } else {
      h+=mineGrid();
    }
  }
  $('wrap').innerHTML=h;
}

function mineGrid(){
  var h='<div class="grid">';
  MINE.forEach(function(p){
    var c=MINE_COLS[p.collection_id]; if(!c) return;
    var co=COACHES[c.coach_id]||{};
    var pend = p.status==='por_pagar' || p.status==='fallido';
    h+='<a class="cc" href="/es/coaches/contenido.html?c='+encodeURIComponent(c.id)+'">'
      + coverHTML(c, [], pend?'<span class="badge">Pago pendiente</span>':'<span class="badge on">Tuya</span>')
      + '<div class="bd"><div class="ar">'+esc(areaName(c.area))+'</div><h3>'+esc(c.title)+'</h3>'
      + '<div class="ft"><span class="sl">con '+esc(co.display_name||'tu coach')+'</span><span class="sl" style="color:var(--teal)">'+(pend?'Terminar compra ›':'Ver ›')+'</span></div></div></a>';
  });
  return h+'</div>';
}

// ============================================================
// EDITOR DE COLECCIÓN
// ============================================================
function openEditor(id){
  if(id){
    CUR = COLS.filter(function(c){ return c.id===id; })[0] || null;
    if(!CUR){ toast('No encontramos esa colección',true); return; }
  } else {
    CUR = { id:null, title:'', description:'', area:'full_swing', level:'todos', price:0, currency:(MGL_PRECIO.esChile()?'CLP':'USD'), is_published:false };
  }
  CUR_TAB = id ? ((ITEMS[id]||[]).length ? 'datos' : 'videos') : 'datos';
  renderEditor();
  $('ov').classList.add('on'); document.body.style.overflow='hidden';
  if(id && window.history && history.replaceState) history.replaceState(null,'','/es/coachhub/contenido.html?c='+encodeURIComponent(id));
}
function closeEditor(){
  // si hay videos subiendo, siguen en segundo plano (no hay que salir de la página)
  if(UPLOADING) toast('Tus videos siguen subiendo. No cierres esta página hasta que terminen.');
  $('ov').classList.remove('on'); document.body.style.overflow='';
  CUR=null;
  if(window.history && history.replaceState) history.replaceState(null,'','/es/coachhub/contenido.html');
  render();
}

function renderEditor(){
  $('drawer').innerHTML='<div id="edHead">'+editorHeadHTML()+'</div><div id="tabBody"></div>';
  renderTab();
}
// título, barra de publicación y pestañas (se refresca sola al terminar cada subida)
function refreshHead(){ var el=$('edHead'); if(el && CUR) el.innerHTML=editorHeadHTML(); }
function editorHeadHTML(){
  var c=CUR, isNew=!c.id, it=isNew?[]:(ITEMS[c.id]||[]), buyers=isNew?[]:salesOf(c.id);
  var h='<div class="d-top"><h2>'+(isNew?'Nueva colección':esc(c.title))+'</h2><button class="x" onclick="closeEditor()" aria-label="Cerrar">×</button></div>';
  if(!isNew){
    var falta = !it.length ? 'Sube al menos un video para poder publicarla.' : '';
    h+='<div class="pubbar"><div class="s">'+(c.is_published
        ? '<b class="on">Publicada</b> · Se ve en tu vitrina y en el catálogo de contenido.'
        : '<b class="off">Borrador</b> · Solo tú la ves. '+(falta||'Cuando esté lista, publícala.'))+'</div>'
      + '<a class="btn sm" href="/es/coaches/contenido.html?c='+encodeURIComponent(c.id)+'" target="_blank" rel="noopener">Vista previa</a>'
      + (c.is_published
          ? '<button class="btn sm" onclick="setPublished(false)">Pasar a borrador</button>'
          : '<button class="btn sm primary" onclick="setPublished(true)"'+(it.length?'':' disabled')+'>Publicar</button>')
      + '</div>';
  }
  h+='<div class="tabs">'
    + '<button class="tab'+(CUR_TAB==='datos'?' on':'')+'" onclick="setTab(\'datos\')">Datos</button>'
    + '<button class="tab'+(CUR_TAB==='videos'?' on':'')+'" onclick="setTab(\'videos\')"'+(isNew?' disabled':'')+'>Videos<span class="n">'+it.length+'</span></button>'
    + '<button class="tab'+(CUR_TAB==='alumnos'?' on':'')+'" onclick="setTab(\'alumnos\')"'+(isNew?' disabled':'')+'>Alumnos<span class="n">'+buyers.length+'</span></button>'
    + '</div>';
  return h;
}
function setTab(t){ if(!CUR || !CUR.id) return; CUR_TAB=t; renderEditor(); }
function renderTab(){
  if(CUR_TAB==='videos') renderVideos();
  else if(CUR_TAB==='alumnos') renderBuyers();
  else renderDatos();
}

// ── Datos ──
function renderDatos(){
  var c=CUR, isNew=!c.id;
  var areas=AREAS.map(function(a){ return '<span class="chip'+(c.area===a[0]?' on':'')+'" data-area="'+a[0]+'" onclick="pickArea(this)">'+a[1]+'</span>'; }).join('');
  var levels=LEVELS.map(function(l){ return '<option value="'+l[0]+'"'+(c.level===l[0]?' selected':'')+'>'+l[1]+'</option>'; }).join('');
  var h='<label class="l">Nombre de la colección</label>'
    + '<input class="inp" id="eTitle" maxlength="120" placeholder="Ej: Putting bajo presión · 8 tips para no fallar los cortos" value="'+esc(c.title)+'">'
    + '<label class="l">Tema</label><div class="chips" id="eArea">'+areas+'</div>'
    + '<div class="row2"><div><label class="l">Nivel</label><select class="inp" id="eLevel">'+levels+'</select></div>'
    + '<div><label class="l">Precio (pago único)</label><div class="price"><input class="inp" id="ePrice" type="number" min="0" step="any" inputmode="decimal" value="'+(Number(c.price)||0)+'">'
    +   '<select class="inp" id="eCur"><option value="USD"'+(c.currency==='USD'?' selected':'')+'>USD</option><option value="CLP"'+(c.currency==='CLP'?' selected':'')+'>CLP</option></select></div>'
    +   '<div class="hint" id="ePriceHint"></div></div></div>'
    + '<label class="l">Descripción</label>'
    + '<textarea class="inp" id="eDesc" maxlength="4000" placeholder="Qué va a aprender el alumno, para quién es y cómo practicarlo. Ej: 8 videos cortos con los ejercicios que uso con mis jugadores de torneo para los putts de 1 a 2 metros.">'+esc(c.description||'')+'</textarea>';
  if(!isNew){
    h+='<label class="l">Portada</label><div class="covered">'+coverHTML(c, ITEMS[c.id]||[], '')
      + '<div style="display:flex;flex-direction:column;gap:8px"><button class="btn sm" onclick="$(\'fCover\').click()">'+(c.cover_path?'Cambiar portada':'Subir portada')+'</button>'
      + (c.cover_path?'<button class="btn sm" onclick="removeCover()">Usar la del primer video</button>':'')
      + '<div class="hint" style="max-width:240px">Si no subes una, se usa la imagen del primer video.</div></div></div>';
  }
  h+='<div class="err" id="eErr"></div>'
    + '<div class="acts"><button class="btn primary grow" id="bSave" onclick="saveDatos()">'+(isNew?'Crear y subir videos':'Guardar cambios')+'</button>'
    + (isNew?'':'<button class="btn danger" onclick="deleteCollection()">Eliminar</button>')+'</div>';
  $('tabBody').innerHTML=h;
  $('ePrice').addEventListener('input',priceHint); $('eCur').addEventListener('change',priceHint); priceHint();
}
function pickArea(el){ Array.prototype.forEach.call(document.querySelectorAll('#eArea .chip'),function(x){ x.classList.remove('on'); }); el.classList.add('on'); }
function priceHint(){

function resizeImage(file, max){
  return new Promise(function(resolve){
    var img=new Image(), url=URL.createObjectURL(file);
    img.onload=function(){
      var s=Math.min(1, max/Math.max(img.width,img.height)), c=document.createElement('canvas');
      c.width=Math.round(img.width*s); c.height=Math.round(img.height*s);
      c.getContext('2d').drawImage(img,0,0,c.width,c.height);
      URL.revokeObjectURL(url);
      c.toBlob(function(b){ resolve(b||file); },'image/jpeg',0.85);
    };
    img.onerror=function(){ URL.revokeObjectURL(url); resolve(file); };
    img.src=url;
  });
}

function addFiles(list){

    var list=ITEMS[CUR.id]||[];
    var pend=QUEUE.filter(function(x){ return x.col===CUR.id && x.state!=='listo' && x.state!=='error'; });
    var maxOrd=list.reduce(function(a,i){ return Math.max(a, Number(i.sort_order)||0); }, -1);

    var q={ id:'q'+Date.now()+Math.random().toString(36).slice(2,6), file:f, col:CUR.id, pct:0, state:'esperando',

function renderQueue(){

  }).join('');

function paintQ(q){
  var el=$(q.id); if(!el) return;
  var em=el.querySelector('em'), bar=el.querySelector('i');
  if(em) em.textContent = q.state==='subiendo'?q.pct+'%':(q.state==='procesando'?'Guardando…':em.textContent);

// sube de a 2 en paralelo
function pump(){
  while(UPLOADING<2){
    var q=QUEUE.filter(function(x){ return x.state==='esperando'; })[0];
    if(!q) return;
    UPLOADING++; uploadVideo(q).then(function(){ UPLOADING--; pump(); }, function(){ UPLOADING--; pump(); });
  }
}

function uploadXHR(path, file, onpct){
  return new Promise(function(resolve, reject){
    var xhr=new XMLHttpRequest();
    xhr.open('POST', SUPABASE_URL+'/storage/v1/object/'+BUCKET_VIDEO+'/'+path.split('/').map(encodeURIComponent).join('/'), true);
    xhr.setRequestHeader('Authorization','Bearer '+TOKEN);
    xhr.setRequestHeader('apikey', SUPABASE_ANON_KEY);
    xhr.setRequestHeader('x-upsert','false');
    xhr.setRequestHeader('Content-Type', file.type||'video/mp4');
    xhr.upload.onprogress=function(e){ if(e.lengthComputable) onpct(Math.round(e.loaded/e.total*100)); };
    xhr.onload=function(){
      if(xhr.status>=200 && xhr.status<300) resolve(path);
      else { var m=''; try{ m=JSON.parse(xhr.responseText).message; }catch(e){} reject(new Error(m||('Error '+xhr.status))); }
    };
    xhr.onerror=function(){ reject(new Error('Sin conexión')); };
    xhr.send(file);
  });
}

async function uploadVideo(q){
  q.state='subiendo'; renderQueue();
  var f=q.file, ext=(f.name.split('.').pop()||'mp4').toLowerCase().replace(/[^a-z0-9]/g,'')||'mp4';
  var stamp=Date.now()+'-'+Math.random().toString(36).slice(2,6);
  var vpath=USER.id+'/'+q.col+'/'+stamp+'.'+ext;
  var meta=null;
  try{
    // la miniatura y la duración se sacan del archivo mientras se sube
    var metaP = videoMeta(f);
    await uploadXHR(vpath, f, function(p){ q.pct=p; paintQ(q); });
    q.state='procesando'; paintQ(q);
    meta = await metaP;
    var tpath=null;
    if(meta && meta.thumb){
      tpath=USER.id+'/contenido/'+q.col+'/'+stamp+'-thumb.jpg';
      var ut=await sb.storage.from(BUCKET_PUB).upload(tpath, meta.thumb, {contentType:'image/jpeg', upsert:false});
      if(ut.error){ console.warn('thumb',ut.error); tpath=null; }
    }
    var title=f.name.replace(/\.[^.]+$/,'').replace(/[_-]+/g,' ').trim();
    if(!title || /^(img|mov|vid|video|trim|rpreplay|screen ?recording)[\s\d]*$/i.test(title) || /^[\d\s]+$/.test(title)) title='Tip '+q.n;
    var ins=await sb.from('coach_collection_items').insert({
      collection_id:q.col, coach_id:USER.id, title:title.slice(0,140), video_path:vpath, thumb_path:tpath,
      duration_sec: meta && meta.dur ? Math.round(meta.dur) : null, size_bytes:f.size,
      is_preview: q.preview, sort_order: q.order
    }).select().single();
    if(ins.error) throw ins.error;
    var arr=(ITEMS[q.col]=ITEMS[q.col]||[]);
    arr.push(ins.data);
    arr.sort(function(a,b){ return (Number(a.sort_order)||0)-(Number(b.sort_order)||0); });
    q.state='listo';
    if(CUR && CUR.id===q.col){
      refreshHead();
      if(CUR_TAB==='videos') renderVideosSafe();
    } else if(!CUR){
      render();
    }
  }catch(e){
    q.state='error'; q.err=(e&&e.message)||'Error';
    if(/Bucket not found|row-level security/i.test(q.err)) q.err='Falta activar Contenido en Supabase';
    renderQueue();
    try{ sb.storage.from(BUCKET_VIDEO).remove([vpath]); }catch(x){}
    toast('No se pudo subir "'+f.name+'": '+q.err,true);
    throw e;
  }
}

// duración + miniatura (frame no negro) desde el archivo local
function frameIsDark(c){
  try{ var d=c.getContext('2d').getImageData(0,0,c.width,c.height).data, s=0, n=0; for(var i=0;i<d.length;i+=4*37){ s+=(d[i]+d[i+1]+d[i+2])/3; n++; } return n>0 && s/n<16; }catch(e){ return false; }
}
function seekTo(v,t){ return new Promise(function(res){ var done=false; function ok(){ if(!done){ done=true; res(); } } v.addEventListener('seeked',ok,{once:true}); try{ v.currentTime=t; }catch(e){ ok(); } setTimeout(ok,4000); }); }
function videoMeta(file){
  return new Promise(function(resolve){
    var url=URL.createObjectURL(file), v=document.createElement('video'), done=false;
    function finish(x){ if(done) return; done=true; URL.revokeObjectURL(url); resolve(x); }
    v.preload='metadata'; v.muted=true; v.playsInline=true; v.src=url;
    v.addEventListener('loadeddata', async function(){
      var dur=isFinite(v.duration)?v.duration:0, tries=[Math.min(1, dur?dur/4:1)];
      if(dur) tries.push(dur*0.35, dur*0.6);
      var c=null;
      for(var i=0;i<tries.length;i++){
        await seekTo(v,tries[i]);
        try{
          var w=480, h=Math.round(w*(v.videoHeight||854)/(v.videoWidth||480));
          c=document.createElement('canvas'); c.width=w; c.height=h; c.getContext('2d').drawImage(v,0,0,w,h);
        }catch(e){ c=null; break; }
        if(!frameIsDark(c)) break;
      }
      if(!c){ finish({dur:dur, thumb:null}); return; }
      c.toBlob(function(b){ finish({dur:dur, thumb:b}); },'image/jpeg',0.78);
    });
    v.addEventListener('error',function(){ finish(null); });
    setTimeout(function(){ finish(null); },25000);
  });
}

}
async function revoke(pid){
  if(!confirm('¿Quitarle el acceso a este alumno?')) return;
  var r=await sb.rpc('mgl_contenido_quitar',{ p_purchase:pid });
  if(r.error){ toast(r.error.message,true); return; }
  toast('Acceso quitado'); await reloadSales(); renderEditor();
}
async function reloadSales(){
  var rs=await sb.from('content_purchases').select('*').eq('coach_id',USER.id).order('created_at',{ascending:false});
  if(!rs.error) SALES=rs.data||[];
}

function showSetup(){
  $('wrap').innerHTML='<div class="setup"><h2>Falta un paso</h2>Para activar Contenido hay que crear las tablas en Supabase: abre el <b>SQL Editor</b> y corre el archivo <code>sql/coach_hub_contenido.sql</code> del repositorio. Después recarga esta página.</div>';
}

// ============================================================
// MENÚ MOBILE
// ============================================================
(function(){
  var btn=$('hamburgerBtn'), nav=$('navLinks');
  function set(open){ btn.classList.toggle('open',open); nav.classList.toggle('mobile-open',open); }
  btn.addEventListener('click',function(e){ e.stopPropagation(); set(!nav.classList.contains('mobile-open')); });
  nav.addEventListener('click',function(e){ if(e.target.tagName==='A') set(false); });
  document.addEventListener('click',function(e){ if(nav.classList.contains('mobile-open') && !nav.contains(e.target)) set(false); });
  window.addEventListener('resize',function(){ if(window.innerWidth>900) set(false); });
})();
document.addEventListener('keydown',function(e){
  if(e.key!=='Escape') return;
  if($('lb').classList.contains('on')) closePlayer();
  else if(CUR) closeEditor();
});
window.addEventListener('beforeunload',function(e){ if(UPLOADING){ e.preventDefault(); e.returnValue=''; } });

init();
</script>
