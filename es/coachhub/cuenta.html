<style>
  :root{
    --bg:var(--c0a0a0a,#0a0a0a); --bg2:var(--c111111,#111); --card:var(--c141414,#141414); --card2:var(--c1a1a1a,#1a1a1a);
    --border:var(--c262626,#262626); --border2:var(--c333333,#333);
    --teal:var(--cd4c5a9,#D4C5A9); --teal-dim:var(--c7d7259,#7D7259); --gold:var(--cf0b860,#F0B860);
    --text:var(--cf5f5f5,#f5f5f5); --muted:var(--c8a8a8a,#8a8a8a); --muted2:var(--c666666,#666);
    --red:var(--ce06a6a,#e06a6a);
  }
  *{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
  body{background:var(--bg);color:var(--text);font-family:'Barlow',sans-serif;-webkit-font-smoothing:antialiased;min-height:100vh}
  a{color:inherit;text-decoration:none}
  button{font-family:inherit;color:inherit}
  html{scrollbar-width:thin;scrollbar-color:rgba(var(--r255_255_255,255,255,255),.09) var(--c0a0a0a,#0a0a0a)}
  ::-webkit-scrollbar{width:10px;height:10px}
  ::-webkit-scrollbar-track{background:var(--c0a0a0a,#0a0a0a)}
  ::-webkit-scrollbar-thumb{background:rgba(var(--r255_255_255,255,255,255),.09);border-radius:10px;border:3px solid var(--c0a0a0a,#0a0a0a)}

  /* header */
  #siteHeader{position:sticky;top:0;z-index:50;background:rgba(var(--r10_10_10,10,10,10),.88);backdrop-filter:blur(12px);border-bottom:1px solid var(--border);padding-top:env(safe-area-inset-top)}
  .nav-inner{max-width:1200px;margin:0 auto;padding:0 20px;height:62px;display:flex;align-items:center;gap:18px}
  .brand{font-family:'Bebas Neue',sans-serif;font-size:25px;letter-spacing:2px}
  .brand span{color:var(--teal)}
  .nav-links{display:flex;gap:20px;margin-left:auto}
  .nav-links a{font-family:'Barlow Condensed';font-size:16px;font-weight:500;color:var(--muted);text-transform:uppercase;letter-spacing:.5px;white-space:nowrap}
  .nav-links a:hover{color:var(--text)}
  .nav-links a.active{color:var(--teal)}
  .hamburger{display:none;flex-direction:column;gap:5px;background:none;border:none;cursor:pointer;padding:8px;margin-left:4px}
  .hamburger span{width:24px;height:2px;background:var(--text);transition:transform .2s,opacity .2s}
  .hamburger.open span:nth-child(1){transform:translateY(7px) rotate(45deg)}
  .hamburger.open span:nth-child(2){opacity:0}
  .hamburger.open span:nth-child(3){transform:translateY(-7px) rotate(-45deg)}
  .avatar{width:36px;height:36px;border-radius:50%;background:var(--teal-dim);display:flex;align-items:center;justify-content:center;font-family:'Barlow Condensed';font-weight:700;color:#1C1709;overflow:hidden;flex:0 0 auto;box-shadow:0 0 0 2px var(--bg),0 0 0 3px var(--teal)}
  .avatar img{width:100%;height:100%;object-fit:cover}

  .wrap{max-width:1200px;margin:0 auto;padding:30px 20px calc(70px + env(safe-area-inset-bottom))}
  .loading{color:var(--muted);padding:60px 0;text-align:center}

  /* tarjeta de perfil */
  .pcard{display:flex;align-items:center;gap:28px;background:var(--card);border:1px solid var(--border);border-radius:22px;padding:30px 32px;position:relative}
  .pcard.link{cursor:pointer;transition:border-color .2s,background .2s}
  .pcard.link:hover{border-color:var(--teal-dim);background:var(--c16150f,#16150f)}
  .pphoto{width:112px;height:112px;border-radius:50%;flex:0 0 auto;background:var(--c2b2619,#2B2619);color:var(--teal);display:flex;align-items:center;justify-content:center;font-family:'Bebas Neue';font-size:44px;letter-spacing:1px;overflow:hidden;box-shadow:0 0 0 3px var(--c0a0a0a,#0a0a0a),0 0 0 4px rgba(var(--r212_197_169,212,197,169),.5)}
  .pphoto img{width:100%;height:100%;object-fit:cover}
  .pphoto{position:relative;cursor:pointer;overflow:visible}
  .pphoto img{border-radius:50%}
  .pcam{position:absolute;right:2px;bottom:2px;width:32px;height:32px;border-radius:50%;background:var(--teal);color:#1C1709;display:flex;align-items:center;justify-content:center;box-shadow:0 0 0 3px var(--card)}
  .pcam svg{width:16px;height:16px}
  .pinfo{flex:1 1 auto;min-width:0}
  .pname{font-family:'Bebas Neue';font-size:40px;letter-spacing:1px;line-height:1}
  .prole{display:flex;align-items:center;gap:8px;flex-wrap:wrap;margin-top:8px}
  .chip{font-family:'Barlow Condensed';font-size:12px;font-weight:700;letter-spacing:.8px;text-transform:uppercase;border-radius:20px;padding:3px 11px;border:1px solid var(--border2);color:var(--muted)}
  .chip.gold{color:var(--teal);border-color:rgba(var(--r212_197_169,212,197,169),.45);background:rgba(var(--r212_197_169,212,197,169),.07)}
  .chip.ok{color:var(--c8fd19e,#8fd19e);border-color:rgba(var(--r143_209_158,143,209,158),.35)}
  .chip.warn{color:var(--gold);border-color:rgba(var(--r240_184_96,240,184,96),.4)}
  .headline{color:var(--muted);font-size:15px;margin-top:10px;line-height:1.45}
  .prow{display:flex;align-items:center;gap:10px;margin-top:10px;color:var(--muted);font-size:15px;flex-wrap:wrap}
  .prow svg{width:18px;height:18px;flex:0 0 auto;color:var(--muted2)}
  .prow .url{color:var(--teal);word-break:break-all}
  .u-short{display:none}
  @media(max-width:620px){.u-long{display:none}.u-short{display:inline}}
  .prow .act{display:inline-flex;align-items:center;gap:5px;font-size:14px;color:var(--muted);background:none;border:none;cursor:pointer;padding:2px 4px}
  .prow .act:hover{color:var(--text)}
  .prow .act svg{width:15px;height:15px;color:inherit}
  .chev{color:var(--muted2);flex:0 0 auto}
  .pbtns{display:flex;gap:10px;flex-wrap:wrap;margin-top:16px}
  .pbtn{display:inline-flex;align-items:center;gap:7px;padding:9px 16px;border-radius:10px;border:1px solid var(--border2);background:var(--card2);font-family:'Barlow Condensed';font-weight:700;font-size:14.5px;letter-spacing:.5px;text-transform:uppercase}
  .pbtn svg{width:16px;height:16px}
  .pbtn:hover{border-color:var(--teal-dim)}
  .pbtn.primary{background:var(--teal);border-color:var(--teal);color:#1C1709}
  .pbtn.primary:hover{filter:brightness(1.06)}
  .chev svg{width:26px;height:26px}

  .stats{display:grid;grid-template-columns:repeat(3,1fr);gap:12px;margin-top:16px}
  .stat{background:var(--card);border:1px solid var(--border);border-radius:16px;padding:16px 18px}
  .stat .n{font-family:'Bebas Neue';font-size:34px;letter-spacing:1px;line-height:1;color:var(--teal)}
  .stat .l{font-family:'Barlow Condensed';font-size:12.5px;font-weight:600;letter-spacing:.8px;text-transform:uppercase;color:var(--muted);margin-top:4px}

  h2.sec{font-family:'Bebas Neue';font-size:30px;letter-spacing:1px;margin:38px 0 14px}

  /* tarjetas */
  .grid{display:grid;grid-template-columns:repeat(3,1fr);gap:16px}
  .tile{display:flex;justify-content:space-between;gap:16px;background:var(--card);border:1px solid var(--border);border-radius:20px;padding:26px 26px 30px;min-height:150px;cursor:pointer;transition:border-color .2s,background .2s,transform .15s;text-align:left;width:100%}
  .tile:hover{border-color:var(--teal-dim);background:var(--c16150f,#16150f);transform:translateY(-1px)}
  .tile h3{font-family:'Barlow Condensed';font-size:24px;font-weight:700;letter-spacing:.3px;line-height:1.1}
  .tile p{color:var(--muted);font-size:15px;line-height:1.45;margin-top:8px}
  .tile .ic{flex:0 0 auto;width:46px;height:46px;border-radius:13px;background:rgba(var(--r212_197_169,212,197,169),.09);color:var(--teal);display:flex;align-items:center;justify-content:center;position:relative}
  .tile .ic svg{width:24px;height:24px}
  .tile .badge{position:absolute;top:-6px;right:-6px;min-width:20px;height:20px;border-radius:10px;padding:0 6px;background:var(--teal);color:#1C1709;font-family:'Barlow Condensed';font-weight:700;font-size:12px;display:flex;align-items:center;justify-content:center}
  .tile.danger .ic{background:rgba(var(--r224_106_106,224,106,106),.1);color:var(--red)}
  .tile.danger:hover{border-color:rgba(var(--r224_106_106,224,106,106),.45);background:var(--c171010,#171010)}
  /* apariencia */
  .tema{display:flex;gap:6px;background:var(--card);border:1px solid var(--border);border-radius:16px;padding:6px;max-width:520px}
  .tema button{flex:1;display:flex;flex-direction:column;align-items:center;gap:8px;background:none;border:1px solid transparent;border-radius:12px;padding:14px 8px;cursor:pointer;font-family:'Barlow Condensed';font-weight:700;font-size:16px;letter-spacing:.4px;text-transform:uppercase;color:var(--muted);transition:background .15s,color .15s,border-color .15s}
  .tema button:hover{color:var(--text)}
  .tema button.on{background:rgba(var(--r212_197_169,212,197,169),.12);border-color:var(--teal-dim);color:var(--teal)}
  .tema .sw{width:46px;height:30px;border-radius:8px;border:1px solid var(--border2);overflow:hidden;display:flex}
  .tema .sw i{flex:1;display:block}
  .tema .sw.idi{align-items:center;justify-content:center;font-family:'Barlow Condensed';font-weight:700;font-size:15px;letter-spacing:.5px;color:var(--text)}
  .tema-nota{color:var(--muted);font-size:14px;margin-top:10px}
  .tile.soon{cursor:default}
  .tile.soon:hover{transform:none}

  .toast{position:fixed;left:50%;bottom:calc(24px + env(safe-area-inset-bottom));transform:translateX(-50%) translateY(16px);background:var(--c222222,#222);border:1px solid var(--border2);color:#fff;padding:10px 16px;border-radius:10px;font-size:14px;opacity:0;pointer-events:none;transition:all .25s;z-index:200}
  .toast.show{opacity:1;transform:translateX(-50%) translateY(0)}

  @media(max-width:900px){
    .nav-links{display:none}
    .nav-links.mobile-open{display:flex;flex-direction:column;gap:0;position:absolute;top:100%;left:0;right:0;background:rgba(var(--r10_10_10,10,10,10),.97);border-bottom:1px solid var(--border);padding:6px 20px 14px;margin:0}
    .nav-links.mobile-open a{padding:15px 0;font-size:19px;border-bottom:1px solid var(--border)}
    .nav-links.mobile-open a:last-child{border-bottom:none}
    .hamburger{display:flex}
    .nav-inner .avatar{margin-left:auto}
    .grid{grid-template-columns:repeat(2,1fr)}
  }
  @media(max-width:620px){
    .pcard{flex-direction:column;align-items:flex-start;gap:18px;padding:24px 22px}
    .pphoto{width:88px;height:88px;font-size:34px}
    .pname{font-size:34px}
    .chev{position:absolute;top:24px;right:20px}
    .grid{grid-template-columns:1fr;gap:12px}
    .tile{min-height:0;padding:22px}
    .stats{gap:8px}
    .stat{padding:14px}
    .stat .n{font-size:28px}
  }
</style>

function buildNav(){
  var items = IS_COACH
    ? [['/es/coachhub/dashboard.html','Dashboard'],['/es/coachhub/jugador.html','Mis jugadores'],['/es/coachhub/clases.html','Clases','clases'],['/es/coachhub/contenido.html','Contenido','contenido'],['/es/coachhub/mensajes.html','Mensajes','mensajes'],['/es/coachhub/analisis.html?from=dash','Analizar swing']]

async function init(){
  var s = await sb.auth.getSession();
  if(!s.data.session){ window.location.href='/es/coachhub/entrar.html'; return; }
  USER = s.data.session.user;

  var pr = await sb.from('profiles').select('role').eq('id',USER.id).maybeSingle();
  ROLE = (pr.data && pr.data.role) || 'jugador';
  IS_COACH = (ROLE==='coach' || ROLE==='ambos');
  buildNav();

  var meta = USER.user_metadata||{};
  var name = meta.full_name || ((meta.first_name||'')+' '+(meta.last_name||'')).trim() || USER.email.split('@')[0];
  var photo = meta.avatar_url || meta.picture || '';

  // Datos en paralelo; cada uno puede fallar sin romper la página
  var tasks = [];
  var stats = { alumnos:null, vinculados:null, unread:null, coaches:null, clases:null };

  if(IS_COACH){
    tasks.push(sb.from('coach_profiles').select('*').eq('coach_id',USER.id).maybeSingle().then(function(r){ if(!r.error) CP=r.data; }));
    tasks.push(sb.from('coach_lessons').select('id',{count:'exact',head:true}).eq('coach_id',USER.id).eq('status','pendiente')
      .then(function(r){ if(!r.error) stats.clases=r.count||0; }));
    tasks.push(sb.from('players').select('id,user_id').eq('coach_id',USER.id).then(function(r){
      if(!r.error){ stats.alumnos=(r.data||[]).length; stats.vinculados=(r.data||[]).filter(function(p){ return p.user_id; }).length; }
    }));
  } else {
    tasks.push(sb.rpc('mgl_msg_mis_coaches').then(function(r){ if(!r.error) stats.coaches=r.data||[]; }));
  }
  tasks.push(sb.from('coach_messages').select('id',{count:'exact',head:true}).neq('sender_id',USER.id).is('read_at',null)
    .then(function(r){ if(!r.error) stats.unread=r.count||0; }));
  try{ await Promise.all(tasks); }catch(e){ console.warn(e); }

  if(CP){
    if(CP.display_name) name = CP.display_name;
    if(CP.photo_path) photo = pubUrl(CP.photo_path);
  }

  var av=$('navAvatar');
  if(photo) av.innerHTML='<img src="'+esc(photo)+'" alt="">';
  else av.textContent=initialsOf(name).charAt(0);

  render(name, photo, stats);
}

// ============================================================
// RENDER
// ============================================================
function render(name, photo, st){
  var h='';

  // ── Tarjeta de perfil ──
  var vitrinaUrl = (IS_COACH && CP && CP.slug) ? 'https://mygolflab.golf/es/coaches/perfil.html?c='+encodeURIComponent(CP.slug) : '';
  var linkCard = IS_COACH;
  h+='<div class="pcard'+(linkCard?' link':'')+'"'+(linkCard?' onclick="location.href=\'/es/coachhub/vitrina.html\'"':'')+'>'
    + '<div class="pphoto"'+(IS_COACH?' title="Cambiar foto" onclick="event.stopPropagation();location.href=\'/es/coachhub/vitrina.html#foto\'"':'')+'>'+(photo?'<img src="'+esc(photo)+'" alt="">':esc(initialsOf(name)))+(IS_COACH?'<span class="pcam">'+IC.cam+'</span>':'')+'</div>'
    + '<div class="pinfo">'
    +   '<div class="pname">'+esc(name)+'</div>'
    +   '<div class="prole">'
    +     '<span class="chip gold">'+(ROLE==='ambos'?'Coach y jugador':(IS_COACH?'Coach':'Jugador'))+'</span>'
    +     (IS_COACH ? (CP ? (CP.is_published ? '<span class="chip ok">Vitrina publicada</span>' : '<span class="chip warn">Vitrina sin publicar</span>') : '<span class="chip warn">Sin vitrina</span>') : '')
    +   '</div>'
    +   (IS_COACH && CP && CP.headline ? '<div class="headline">'+esc(CP.headline)+'</div>' : '')
    +   '<div class="prow">'+IC.mail+'<span>'+esc(USER.email)+'</span></div>'
    +   (vitrinaUrl
          ? '<div class="prow">'+IC.link+'<a class="url" href="'+esc(vitrinaUrl)+'" target="_blank" rel="noopener" onclick="event.stopPropagation()"><span class="u-long">'+esc(vitrinaUrl.replace('https://',''))+'</span><span class="u-short">Link de tu vitrina</span></a>'
            + '<button class="act" onclick="event.stopPropagation();copyLink(\''+esc(vitrinaUrl)+'\')">'+IC.copy+'Copiar</button>'
            + '</div>'
          : '')
    +   (IS_COACH ? '<div class="pbtns">'
          + '<a class="pbtn primary" href="/es/coachhub/vitrina.html" onclick="event.stopPropagation()">'+IC.edit+'Editar perfil</a>'
          + (vitrinaUrl ? '<a class="pbtn" href="'+esc(vitrinaUrl)+'" target="_blank" rel="noopener" onclick="event.stopPropagation()">'+IC.ext+'Ver como alumno</a>' : '')
          + '</div>' : '')
    + '</div>'
    + (linkCard ? '<div class="chev" title="Editar perfil">'+IC.chev+'</div>' : '')
    + '</div>';

  // ── Números ──
  if(IS_COACH){
    h+='<div class="stats">'
      + '<div class="stat"><div class="n">'+(st.alumnos==null?'—':st.alumnos)+'</div><div class="l">Alumnos</div></div>'
      + '<div class="stat"><div class="n">'+(st.vinculados==null?'—':st.vinculados)+'</div><div class="l">Con cuenta vinculada</div></div>'
      + '<div class="stat"><div class="n">'+(st.unread==null?'—':st.unread)+'</div><div class="l">Mensajes sin leer</div></div>'
      + '</div>';
  } else if(st.coaches && st.coaches.length){
    h+='<div class="stats" style="grid-template-columns:repeat(2,1fr)">'
      + '<div class="stat"><div class="n" style="font-size:26px">'+esc(st.coaches.map(function(c){ return c.coach_name; }).join(', '))+'</div><div class="l">'+(st.coaches.length>1?'Tus coaches':'Tu coach')+'</div></div>'
      + '<div class="stat"><div class="n">'+(st.unread==null?'—':st.unread)+'</div><div class="l">Mensajes sin leer</div></div>'
      + '</div>';
  }

  // ── General ──
  h+='<h2 class="sec">General</h2><div class="grid">';
  if(IS_COACH){
    h+= tile('/es/coachhub/jugador.html','Mis jugadores','Perfiles, timeline, galería y notas de cada alumno.',IC.players)
      + tile('/es/coachhub/clases.html','Clases','Las clases que te piden desde tu vitrina.',IC.lesson,st.clases)
      + tile('/es/coachhub/contenido.html','Contenido','Vende colecciones de videos con tus tips.',IC.content)
      + tile('/es/coachhub/mensajes.html','Mensajes','Conversa con tus alumnos.',IC.msg,st.unread)
      + tile('/es/coachhub/analisis.html?from=dash','Analizar swing','Dibuja sobre el video, compara swings y graba tu explicación.',IC.analyze)
      + tile('/es/coachhub/vitrina.html#ofertas','Mis ofertas','Lo que vendes en tu vitrina: análisis, paquetes y planes.',IC.store)
      + tile('/es/coachhub/pricing.html','Suscripción','Tu plan de Coach Hub, alumnos incluidos y facturación.',IC.card)
      + (ROLE==='ambos' ? tile('/es/dashboard.html','Ir a MyGolfLab','Tu entrenamiento como jugador: Coach IA y Training Lab.',IC.ai) : tile('/es/coachhub/dashboard.html','Dashboard','Lo que necesita tu atención hoy.',IC.dash));
  } else {
    h+= tile('/es/coachhub/jugador.html','Mi perfil','Tu timeline, videos y notas de tu coach.',IC.user)
      + tile('/es/coachhub/clases.html','Mis clases','Las clases que pediste y su estado.',IC.lesson)
      + tile('/es/coachhub/contenido.html','Mi contenido','Las colecciones de tips que compraste.',IC.content)
      + tile('/es/coachhub/mensajes.html','Mensajes','Escríbele a tu coach.',IC.msg,st.unread)
      + tile('/es/coaches/','Coaches','Encuentra un coach y toma clases online.',IC.search)
      + tile('/es/dashboard.html','Ir a MyGolfLab','Coach IA, Biblioteca y Training Lab.',IC.ai);
  }
  h+= '<button class="tile danger" onclick="logout()"><div><h3>Cerrar sesión</h3><p>Salir de tu cuenta en este dispositivo.</p></div><div class="ic">'+IC.logout+'</div></button>';
  h+='</div>';
  h+='<h2 class="sec">Apariencia</h2>'+temaHTML();
  h+='<h2 class="sec">Idioma</h2>'+idiomaHTML();
  h+='<div id="zonaCuenta"></div>';

  $('wrap').innerHTML=h;
  if(window.MGLBorrarCuenta) MGLBorrarCuenta.montar($('zonaCuenta'), { sb:sb, volverA:'/es/coachhub/entrar.html' });
}

function temaHTML(){
  var cur = window.MGLTema ? MGLTema.get() : 'oscuro';
  var ops = [
    ['oscuro','Oscuro','<i style="background:#0a0a0a"></i><i style="background:#1c1c1c"></i>'],
    ['claro','Claro','<i style="background:#f6f4ef"></i><i style="background:#ffffff"></i>'],
    ['auto','Automático','<i style="background:#0a0a0a"></i><i style="background:#f6f4ef"></i>']
  ];
  var h='<div class="tema" id="temaSel">';
  ops.forEach(function(o){
    h+='<button type="button" data-tema="'+o[0]+'" class="'+(cur===o[0]?'on':'')+'" onclick="elegirTema(\''+o[0]+'\')"><span class="sw">'+o[2]+'</span>'+o[1]+'</button>';
  });
  h+='</div><p class="tema-nota">Automático sigue el modo claro u oscuro de tu teléfono o computador.</p>';
  return h;
}
function idiomaHTML(){
  var cur = window.MGLi18n ? MGLi18n.lang : 'es';
  var ops = [['es','Español','ES'],['en','English','EN']];
  var h='<div class="tema notranslate" id="idiomaSel">';
  ops.forEach(function(o){
    h+='<button type="button" data-idioma="'+o[0]+'" class="'+(cur===o[0]?'on':'')+'" onclick="elegirIdioma(\''+o[0]+'\')"><span class="sw idi">'+o[2]+'</span>'+o[1]+'</button>';
  });
  h+='</div>';
  return h;
}
function elegirIdioma(v){
  if(!window.MGLi18n || MGLi18n.lang===v) return;
  MGLi18n.set(v);
}
function elegirTema(v){
  if(window.MGLTema) MGLTema.set(v);
  var bs=document.querySelectorAll('#temaSel button');
  for(var i=0;i<bs.length;i++) bs[i].classList.toggle('on', bs[i].getAttribute('data-tema')===v);
}

function tile(href, title, desc, icon, badge){
  return '<a class="tile" href="'+href+'"><div><h3>'+esc(title)+'</h3><p>'+esc(desc)+'</p></div>'
    + '<div class="ic">'+icon+(badge?'<span class="badge">'+(badge>99?'99+':badge)+'</span>':'')+'</div></a>';
}

// ============================================================
// ACCIONES
// ============================================================
function copyLink(url){
  function ok(){ toast('Link copiado'); }
  if(navigator.clipboard && navigator.clipboard.writeText){
    navigator.clipboard.writeText(url).then(ok,function(){ fallback(); });
  } else fallback();
  function fallback(){
    var t=document.createElement('textarea'); t.value=url; document.body.appendChild(t); t.select();
    try{ document.execCommand('copy'); ok(); }catch(e){ toast('No se pudo copiar'); }
    document.body.removeChild(t);
  }
}

async function logout(){
  if(!confirm('¿Cerrar sesión?')) return;
  await sb.auth.signOut();
  window.location.href='/es/coachhub/entrar.html';
}

// ============================================================
// MENÚ MOBILE
// ============================================================
(function(){
  var btn=$('hamburgerBtn'), nav=$('navLinks');
  function set(open){ btn.classList.toggle('open',open); nav.classList.toggle('mobile-open',open); }
  btn.addEventListener('click',function(e){ e.stopPropagation(); set(!nav.classList.contains('mobile-open')); });
  nav.addEventListener('click',function(e){ if(e.target.tagName==='A') set(false); });
  document.addEventListener('click',function(e){ if(nav.classList.contains('mobile-open') && !nav.contains(e.target)) set(false); });
  window.addEventListener('resize',function(){ if(window.innerWidth>900) set(false); });
})();

init();
</script>
