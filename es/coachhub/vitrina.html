<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>Mi vitrina · Coach Hub</title>
<meta name="robots" content="noindex">
<meta name="theme-color" content="#0a0a0a">
<link rel="manifest" href="/es/coachhub/manifest.json">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Coach Hub">
<link rel="apple-touch-icon" href="/es/coachhub/apple-touch-icon.png">
<link rel="icon" href="/es/coachhub/favicon-32.png" sizes="32x32">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Barlow:wght@400;500;600&family=Barlow+Condensed:wght@500;600;700&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
  :root{
    --bg:#0a0a0a; --bg2:#111; --card:#161616; --card2:#1c1c1c;
    --border:#262626; --border2:#333;
    --teal:#2dd4bf; --teal-dim:#1a7d72; --gold:#D4C5A9;
    --text:#f5f5f5; --muted:#8a8a8a; --muted2:#666;
    --red:#e06a6a; --orange:#e0a15b;
  }
  *{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
  body{background:var(--bg);color:var(--text);font-family:'Barlow',sans-serif;-webkit-font-smoothing:antialiased;min-height:100vh}
  a{color:inherit;text-decoration:none}
  button,input,select,textarea{font-family:inherit;color:inherit}
  html{scrollbar-width:thin;scrollbar-color:rgba(255,255,255,.09) #0a0a0a}
  ::-webkit-scrollbar{width:10px;height:10px}
  ::-webkit-scrollbar-track{background:#0a0a0a}
  ::-webkit-scrollbar-thumb{background:rgba(255,255,255,.09);border-radius:10px;border:3px solid #0a0a0a}

  #siteHeader{position:sticky;top:0;z-index:50;background:rgba(10,10,10,.85);backdrop-filter:blur(12px);border-bottom:1px solid var(--border);padding-top:env(safe-area-inset-top)}
  .nav-inner{max-width:1200px;margin:0 auto;padding:0 20px;height:62px;display:flex;align-items:center;gap:18px}
  .brand{font-family:'Bebas Neue',sans-serif;font-size:25px;letter-spacing:2px}
  .brand span{color:var(--teal)}
  .hubchip{font-family:'Barlow Condensed';font-size:12px;font-weight:700;text-transform:uppercase;letter-spacing:.7px;color:var(--teal);border:1px solid var(--teal-dim);border-radius:20px;padding:3px 10px;white-space:nowrap}
  .nav-links{display:flex;gap:20px;margin-left:auto}
  .nav-links a{font-family:'Barlow Condensed';font-size:16px;font-weight:500;color:var(--muted);text-transform:uppercase;letter-spacing:.5px;white-space:nowrap}
  .nav-links a:hover{color:var(--text)}
  .nav-links a.active{color:var(--teal)}
  .hamburger{display:none;flex-direction:column;gap:5px;background:none;border:none;cursor:pointer;padding:8px;margin-left:4px}
  .hamburger span{width:24px;height:2px;background:var(--text);transition:transform .2s,opacity .2s}
  .hamburger.open span:nth-child(1){transform:translateY(7px) rotate(45deg)}
  .hamburger.open span:nth-child(2){opacity:0}
  .hamburger.open span:nth-child(3){transform:translateY(-7px) rotate(-45deg)}

  .wrap{max-width:980px;margin:0 auto;padding:26px 20px calc(110px + env(safe-area-inset-bottom))}
  .top{display:flex;align-items:flex-end;gap:16px;flex-wrap:wrap;margin-bottom:22px}
  .top h1{font-family:'Bebas Neue';font-size:44px;letter-spacing:1px;line-height:1}
  .top p{color:var(--muted);margin-top:6px;font-size:15px;max-width:560px;line-height:1.45}
  .top .r{margin-left:auto;display:flex;gap:10px;align-items:center;flex-wrap:wrap}

  .status{font-family:'Barlow Condensed';font-weight:700;font-size:13px;text-transform:uppercase;letter-spacing:.6px;border-radius:20px;padding:4px 12px}
  .status.on{background:rgba(45,212,191,.12);color:var(--teal);border:1px solid var(--teal-dim)}
  .status.off{background:var(--card2);color:var(--muted);border:1px solid var(--border2)}

  .btn{background:var(--card2);border:1px solid var(--border2);border-radius:10px;padding:10px 16px;font-family:'Barlow Condensed';font-weight:700;font-size:15px;letter-spacing:.4px;text-transform:uppercase;cursor:pointer;white-space:nowrap}
  .btn:hover{border-color:var(--teal-dim)}
  .btn.primary{background:var(--teal);border-color:var(--teal);color:#04211d}
  .btn.primary:disabled{opacity:.4;cursor:not-allowed}
  .btn.ghost{background:none}
  .btn.danger{color:var(--red)}
  .btn.sm{padding:7px 12px;font-size:13.5px}

  .stats{display:grid;grid-template-columns:repeat(3,1fr);gap:12px;margin-bottom:18px}
  .st{background:var(--card);border:1px solid var(--border);border-radius:14px;padding:14px}
  .st .v{font-family:'Bebas Neue';font-size:34px;line-height:1;color:var(--teal)}
  .st .l{color:var(--muted);font-size:12px;text-transform:uppercase;letter-spacing:.5px;margin-top:5px;font-family:'Barlow Condensed';font-weight:600}

  .sec{background:var(--card);border:1px solid var(--border);border-radius:18px;padding:22px;margin-bottom:18px}
  .sec h2{font-family:'Barlow Condensed';font-weight:700;font-size:22px;letter-spacing:.3px}
  .sec .sub{color:var(--muted);font-size:14px;margin:4px 0 18px;line-height:1.45}
  .sec-h{display:flex;align-items:center;gap:12px}
  .sec-h .r{margin-left:auto}

  .grid{display:grid;grid-template-columns:1fr 1fr;gap:16px}
  .full{grid-column:1/-1}
  .f label{display:block;font-family:'Barlow Condensed';font-weight:600;font-size:14px;text-transform:uppercase;letter-spacing:.5px;color:var(--muted);margin-bottom:7px}
  .f label i{font-style:normal;color:var(--muted2);text-transform:none;letter-spacing:0;font-family:'Barlow';font-weight:400;font-size:12.5px;margin-left:4px}
  .f input,.f select,.f textarea{width:100%;background:var(--bg2);border:1px solid var(--border2);border-radius:10px;padding:11px 13px;font-size:15px;outline:none}
  .f textarea{min-height:96px;resize:vertical;line-height:1.5}
  .f input:focus,.f select:focus,.f textarea:focus{border-color:var(--teal-dim)}
  .f .hint{color:var(--muted2);font-size:12.5px;margin-top:6px;line-height:1.4}
  .slugbox{display:flex;align-items:center;background:var(--bg2);border:1px solid var(--border2);border-radius:10px;overflow:hidden}
  .slugbox span{color:var(--muted2);font-size:13.5px;padding-left:13px;white-space:nowrap}
  .slugbox input{border:none;background:none;padding-left:2px}

  .chips{display:flex;flex-wrap:wrap;gap:8px}
  .chip{background:var(--bg2);border:1px solid var(--border2);border-radius:20px;padding:7px 13px;font-size:14px;cursor:pointer;user-select:none}
  .chip.on{background:rgba(45,212,191,.12);border-color:var(--teal);color:var(--teal)}

  .media-row{display:grid;grid-template-columns:150px 1fr 1fr;gap:16px}
  .drop{position:relative;background:var(--bg2);border:1px dashed var(--border2);border-radius:14px;min-height:150px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:6px;cursor:pointer;overflow:hidden;text-align:center;padding:10px}
  .drop:hover{border-color:var(--teal-dim)}
  .drop.photo{border-radius:50%;width:150px;height:150px;min-height:0}
  .drop img,.drop video{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
  .drop b{font-family:'Barlow Condensed';font-weight:700;font-size:15px;position:relative}
  .drop small{color:var(--muted);font-size:12.5px;position:relative}
  .drop .bar{position:absolute;left:0;bottom:0;height:4px;background:var(--teal);width:0;transition:width .2s}
  .drop .x{position:absolute;top:8px;right:8px;width:28px;height:28px;border-radius:50%;background:rgba(0,0,0,.7);border:1px solid var(--border2);display:flex;align-items:center;justify-content:center;font-size:16px;z-index:2}
  .drop.has b,.drop.has small{display:none}

  .check{display:flex;flex-direction:column;gap:8px}
  .check div{display:flex;gap:10px;align-items:center;font-size:14.5px;color:var(--muted)}
  .check div.ok{color:var(--text)}
  .check .dot{width:20px;height:20px;border-radius:50%;border:1px solid var(--border2);display:flex;align-items:center;justify-content:center;font-size:12px;flex:0 0 auto}
  .check .ok .dot{background:var(--teal);border-color:var(--teal);color:#04211d;font-weight:700}

  .offers{display:flex;flex-direction:column;gap:10px}
  .offer{display:flex;align-items:center;gap:14px;background:var(--bg2);border:1px solid var(--border);border-radius:14px;padding:14px 16px}
  .offer.off{opacity:.5}
  .offer .tx{flex:1;min-width:0}
  .offer .tx b{font-weight:600;font-size:16px}
  .offer .tx small{display:block;color:var(--muted);font-size:13px;margin-top:3px}
  .offer .price{font-family:'Bebas Neue';font-size:26px;color:var(--teal);white-space:nowrap}
  .kind{font-family:'Barlow Condensed';font-weight:700;font-size:12px;text-transform:uppercase;letter-spacing:.5px;color:var(--gold);margin-right:6px}
  .trial{font-family:'Barlow Condensed';font-weight:700;font-size:12px;text-transform:uppercase;color:#04211d;background:var(--gold);border-radius:6px;padding:1px 6px;margin-left:6px}
  .empty{color:var(--muted);font-size:14px;line-height:1.5;padding:6px 0}

  .savebar{position:fixed;left:0;right:0;bottom:0;z-index:40;background:rgba(10,10,10,.92);backdrop-filter:blur(12px);border-top:1px solid var(--border);padding:12px 20px calc(12px + env(safe-area-inset-bottom));display:flex;justify-content:center;gap:10px;transform:translateY(100%);visibility:hidden;transition:transform .2s,visibility .2s}
  .savebar.on{transform:none;visibility:visible}
  .savebar span{align-self:center;color:var(--muted);font-size:14px;margin-right:6px}

  .modal-bg{position:fixed;inset:0;background:rgba(0,0,0,.72);z-index:100;display:none;align-items:flex-start;justify-content:center;overflow-y:auto;padding:40px 16px}
  .modal-bg.on{display:flex}
  .modal{background:var(--card);border:1px solid var(--border2);border-radius:18px;width:100%;max-width:620px;padding:22px}
  .modal h3{font-family:'Barlow Condensed';font-weight:700;font-size:24px;margin-bottom:16px}
  .modal .acts{display:flex;gap:10px;justify-content:flex-end;margin-top:20px;flex-wrap:wrap}
  .modal .acts .l{margin-right:auto}
  .tog{display:flex;gap:10px;align-items:flex-start;background:var(--bg2);border:1px solid var(--border2);border-radius:10px;padding:12px;cursor:pointer}
  .tog input{width:18px;height:18px;margin-top:2px;accent-color:var(--teal);flex:0 0 auto}
  .tog b{font-weight:600;font-size:14.5px;display:block}
  .tog small{color:var(--muted);font-size:13px}
  .hr{height:1px;background:var(--border);margin:18px 0}
  .mtitle{font-family:'Barlow Condensed';font-weight:700;font-size:16px;text-transform:uppercase;letter-spacing:.5px;color:var(--gold);margin-bottom:12px}

  .loading{color:var(--muted);padding:60px 0;text-align:center}
  .toast{position:fixed;left:50%;bottom:calc(84px + env(safe-area-inset-bottom));transform:translateX(-50%) translateY(16px);background:#222;border:1px solid var(--border2);color:#fff;padding:10px 16px;border-radius:10px;font-size:14px;opacity:0;pointer-events:none;transition:all .25s;z-index:200;max-width:90vw;text-align:center}
  .toast.show{opacity:1;transform:translateX(-50%) translateY(0)}
  .toast.err{border-color:rgba(224,106,106,.5);color:#ffb3b3}

  @media(max-width:900px){
    .nav-links{display:none}
    .nav-links.mobile-open{display:flex;flex-direction:column;gap:0;position:absolute;top:100%;left:0;right:0;background:rgba(10,10,10,.97);border-bottom:1px solid var(--border);padding:6px 20px 14px;margin:0}
    .nav-links.mobile-open a{padding:15px 0;font-size:19px;border-bottom:1px solid var(--border)}
    .hamburger{display:flex;margin-left:auto}
    .grid{grid-template-columns:1fr}
    .media-row{grid-template-columns:1fr}
    .drop.photo{margin:0 auto}
    .top h1{font-size:38px}
    .top .r{margin-left:0}
    .stats{grid-template-columns:repeat(3,1fr);gap:8px}
    .st .v{font-size:28px}
    .offer{flex-wrap:wrap}
    .offer .tx{flex:1 1 100%}
    .offer .price{margin-right:auto}
  }
</style>
</head>
<body>

<header id="siteHeader">
  <div class="nav-inner">
    <a href="/es/index.html" class="brand">MY<span>GOLF</span>LAB</a>
    <span class="hubchip">Coach Hub</span>
    <nav class="nav-links" id="navLinks">
      <a href="/es/coachhub/dashboard.html">Dashboard</a>
      <a href="/es/coachhub/jugador.html">Mis jugadores</a>
      <a href="/es/coachhub/analisis.html?from=dash">Analizar swing</a>
      <a href="/es/coachhub/vitrina.html" class="active">Mi vitrina</a>
    </nav>
    <button class="hamburger" id="hamburgerBtn" aria-label="Menú"><span></span><span></span><span></span></button>
  </div>
</header>

<div class="wrap" id="wrap"><div class="loading">Cargando tu vitrina…</div></div>

<div class="savebar" id="saveBar"><span>Tienes cambios sin guardar</span><button class="btn primary" onclick="saveProfile()">Guardar cambios</button></div>

<div class="modal-bg" id="offerModal"><div class="modal" id="offerBody"></div></div>
<input type="file" id="fileInput" style="display:none">
<div class="toast" id="toast"></div>

<script>
// ============================================================
// SUPABASE
// ============================================================
var SUPABASE_URL = 'https://yulpqupmftdjbepqiscs.supabase.co';
var SUPABASE_ANON_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Inl1bHBxdXBtZnRkamJlcHFpc2NzIiwicm9sZSI6ImFub24iLCJpYXQiOjE3NzQxNDA0NjYsImV4cCI6MjA4OTcxNjQ2Nn0.e-8SEni5uxUoigXCkVM2VYm7UrHYxxVl7hPsUrZvYao';
var sb = supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);
var BUCKET = 'coach-public';

var USER=null, P=null, IS_NEW=true, OFFERS=[], VIEWS={d7:0,d30:0}, DIRTY=false, EDIT_OFFER=null;

// ============================================================
// CATÁLOGOS
// ============================================================
var SPECIALTIES = [['full_swing','Full Swing'],['juego_corto','Juego Corto'],['putter','Putter'],['fisico','Físico'],['estrategia','Estrategia / Cancha'],['juniors','Juniors']];
var LEVELS = [['iniciacion','Iniciación'],['junior','Junior'],['amateur','Amateur'],['college','College'],['elite','Elite amateur'],['profesional','Profesional'],['senior','Senior']];
var LANGS = [['es','Español'],['en','Inglés'],['pt','Portugués']];
var COUNTRIES = [['CL','Chile'],['AR','Argentina'],['MX','México'],['CO','Colombia'],['PE','Perú'],['UY','Uruguay'],['PY','Paraguay'],['EC','Ecuador'],['ES','España'],['US','Estados Unidos'],['OT','Otro']];
var KINDS = {analisis:'Análisis de swing', paquete:'Paquete de análisis', plan_mensual:'Plan mensual', videollamada:'Videollamada'};
var ANGLES = [['frente','De frente'],['linea_de_tiro','Línea de tiro'],['atras','Desde atrás del objetivo'],['resultado','Vuelo de bola / resultado']];
var CLUBS = [['libre','A elección'],['driver','Driver'],['hierro_7','Hierro 7'],['wedge','Wedge'],['putter','Putter']];

// ============================================================
// HELPERS
// ============================================================
function $(id){ return document.getElementById(id); }
function esc(s){ if(s==null) return ''; return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;'); }
function toast(m,err){ var t=$('toast'); t.textContent=m; t.className='toast show'+(err?' err':''); clearTimeout(toast._t); toast._t=setTimeout(function(){ t.className='toast'; },err?5000:2600); }
function pubUrl(path){ return path ? SUPABASE_URL+'/storage/v1/object/public/'+BUCKET+'/'+path.split('/').map(encodeURIComponent).join('/') : ''; }
function clp(n){ try{ return new Intl.NumberFormat('es-CL',{style:'currency',currency:'CLP',maximumFractionDigits:0}).format(n||0); }catch(e){ return '$'+n; } }
function slugify(s){
  return String(s||'').toLowerCase().normalize('NFD').replace(/[̀-ͯ]/g,'')
    .replace(/[^a-z0-9]+/g,'-').replace(/^-+|-+$/g,'').slice(0,40);
}
function lines(v){ return String(v||'').split('\n').map(function(x){ return x.trim(); }).filter(Boolean); }
function optionList(arr, sel){ var h=''; arr.forEach(function(o){ h+='<option value="'+o[0]+'"'+(o[0]===sel?' selected':'')+'>'+esc(o[1])+'</option>'; }); return h; }
function chipsHTML(group, arr, selected){
  var h='<div class="chips" data-group="'+group+'">';
  arr.forEach(function(o){ h+='<span class="chip'+(selected.indexOf(o[0])>=0?' on':'')+'" data-v="'+o[0]+'" onclick="toggleChip(this)">'+esc(o[1])+'</span>'; });
  return h+'</div>';
}
function toggleChip(el){ el.classList.toggle('on'); markDirty(); }
function chipVals(group, root){
  var out=[]; var box=(root||document).querySelector('[data-group="'+group+'"]');
  if(!box) return out;
  box.querySelectorAll('.chip.on').forEach(function(c){ out.push(c.getAttribute('data-v')); });
  return out;
}
function markDirty(){ DIRTY=true; $('saveBar').classList.add('on'); renderChecklist(); }

// ============================================================
// INICIO
// ============================================================
async function init(){
  var s = await sb.auth.getSession();
  if(!s.data.session){ window.location.href='/es/coachhub/entrar.html'; return; }
  USER = s.data.session.user;

  var pr = await sb.from('profiles').select('role').eq('id',USER.id).maybeSingle();
  var role = (pr.data && pr.data.role) || 'jugador';
  if(role!=='coach' && role!=='ambos'){ window.location.replace('jugador.html'); return; }

  var r = await sb.from('coach_profiles').select('*').eq('coach_id',USER.id).maybeSingle();
  if(r.error){
    $('wrap').innerHTML='<div class="loading">No se pudo cargar la vitrina. ¿Corriste las migraciones coach_hub_vitrina_v1 y v2?<br><small>'+esc(r.error.message)+'</small></div>';
    return;
  }
  var meta = USER.user_metadata||{};
  if(r.data){ P=r.data; IS_NEW=false; }
  else {
    var nombre = (meta.full_name || ((meta.first_name||'')+' '+(meta.last_name||'')).trim() || '').trim();
    P = { coach_id:USER.id, display_name:nombre, slug:slugify(nombre), headline:'', bio:'', philosophy:'',
          photo_path:null, intro_video_path:null, sample_video_path:null, country:'CL', languages:['es'],
          specialties:[], levels:[], certifications:[], highlights:[], notable_players:[], social_links:{},
          years_experience:null, response_sla_hours:72, is_published:false, is_verified:false, rating_avg:0, rating_count:0 };
  }
  await loadOffers();
  await loadViews();
  render();
}

async function loadOffers(){
  if(IS_NEW){ OFFERS=[]; return; }
  var r = await sb.from('coach_offerings').select('*').eq('coach_id',USER.id).order('sort_order').order('created_at');
  OFFERS = r.data||[];
}
async function loadViews(){
  if(IS_NEW) return;
  var d = new Date(); d.setDate(d.getDate()-30);
  var r = await sb.from('coach_profile_views').select('dia,visitas').eq('coach_id',USER.id).gte('dia', d.toISOString().slice(0,10));
  var lim7 = new Date(); lim7.setDate(lim7.getDate()-7); var l7 = lim7.toISOString().slice(0,10);
  VIEWS={d7:0,d30:0};
  (r.data||[]).forEach(function(v){ VIEWS.d30+=v.visitas; if(v.dia>=l7) VIEWS.d7+=v.visitas; });
}

// ============================================================
// RENDER
// ============================================================
function render(){
  var certs = (P.certifications||[]).map(function(c){ return typeof c==='string'?c:(c.nombre||''); }).join('\n');
  var soc = P.social_links||{};
  var perfilUrl = '/es/coaches/perfil.html?c='+encodeURIComponent(P.slug||'');

  var h =
    '<div class="top"><div><h1>Mi vitrina</h1><p>Tu perfil público para que alumnos de todo el mundo hispano te encuentren y te compren análisis online.</p></div>'
  + '<div class="r"><span class="status '+(P.is_published?'on':'off')+'">'+(P.is_published?'Publicada':'Borrador')+'</span>'
  + (IS_NEW?'':'<a class="btn ghost" href="'+perfilUrl+'" target="_blank">Ver perfil público</a>')
  + '</div></div>';

  if(!IS_NEW){
    h += '<div class="stats">'
      + '<div class="st"><div class="v">'+VIEWS.d7+'</div><div class="l">Visitas 7 días</div></div>'
      + '<div class="st"><div class="v">'+VIEWS.d30+'</div><div class="l">Visitas 30 días</div></div>'
      + '<div class="st"><div class="v">'+(P.rating_count? Number(P.rating_avg).toFixed(1):'—')+'</div><div class="l">'+(P.rating_count||0)+' reseñas</div></div>'
      + '</div>';
  }

  // --- Publicación
  h += '<div class="sec"><div class="sec-h"><h2>Para publicar</h2><div class="r" id="pubBtnBox"></div></div>'
     + '<p class="sub">Tu vitrina aparece en el buscador cuando completas lo esencial.</p><div class="check" id="checklist"></div></div>';

  // --- Identidad
  h += '<div class="sec"><h2>Quién eres</h2><p class="sub">Lo primero que ve un alumno. Una buena foto y un video corto de presentación hacen la diferencia.</p>'
     + '<div class="media-row">'

     + '</div><div class="hr"></div><div class="grid">'
     +   '<div class="f"><label>Nombre público</label><input id="f_name" value="'+esc(P.display_name)+'" oninput="onName()"></div>'
     +   '<div class="f"><label>Tu link</label><div class="slugbox"><span>…/coaches/perfil.html?c=</span><input id="f_slug" value="'+esc(P.slug)+'" oninput="markDirty()"></div><div class="hint">Solo minúsculas, números y guiones.</div></div>'
     +   '<div class="f full"><label>Titular <i>una línea</i></label><input id="f_headline" maxlength="90" placeholder="Coach PGA · Especialista en juego corto y juniors" value="'+esc(P.headline)+'" oninput="markDirty()"></div>'
     +   '<div class="f full"><label>Sobre mí</label><textarea id="f_bio" placeholder="Tu trayectoria, dónde enseñas, con quién has trabajado…" oninput="markDirty()">'+esc(P.bio)+'</textarea></div>'
     +   '<div class="f full"><label>Mi forma de enseñar</label><textarea id="f_phil" placeholder="Cómo trabajas un swing, qué priorizas, qué puede esperar un alumno…" oninput="markDirty()">'+esc(P.philosophy)+'</textarea></div>'
     +   '<div class="f"><label>País</label><select id="f_country" onchange="markDirty()">'+optionList(COUNTRIES,P.country)+'</select></div>'
     +   '<div class="f"><label>Años enseñando</label><input id="f_years" type="number" min="0" max="60" value="'+(P.years_experience==null?'':P.years_experience)+'" oninput="markDirty()"></div>'
     +   '<div class="f full"><label>Idiomas</label>'+chipsHTML('languages',LANGS,P.languages||[])+'</div>'
     + '</div></div>';

  // --- Especialidad
  h += '<div class="sec"><h2>Especialidad</h2><p class="sub">Se usa para el buscador y para recomendarte a alumnos que buscan exactamente lo que haces.</p><div class="grid">'
     +   '<div class="f full"><label>Especialidades</label>'+chipsHTML('specialties',SPECIALTIES,P.specialties||[])+'</div>'
     +   '<div class="f full"><label>Niveles con los que trabajas</label>'+chipsHTML('levels',LEVELS,P.levels||[])+'</div>'
     +   '<div class="f"><label>Respondes los análisis en</label><select id="f_sla" onchange="markDirty()">'+optionList([['24','24 horas'],['48','48 horas'],['72','72 horas'],['120','5 días']],String(P.response_sla_hours||72))+'</select><div class="hint">Si no respondes a tiempo, se le devuelve el dinero al alumno.</div></div>'
     + '</div></div>';

  // --- Credenciales
  h += '<div class="sec"><h2>Credenciales y logros</h2><p class="sub">Uno por línea.</p><div class="grid">'
     +   '<div class="f"><label>Certificaciones</label><textarea id="f_certs" placeholder="TPI Golf Level 2&#10;Trackman Level 1" oninput="markDirty()">'+esc(certs)+'</textarea></div>'
     +   '<div class="f"><label>Logros destacados</label><textarea id="f_high" placeholder="Ex director Andes Golf Academy&#10;10 jugadores becados a college" oninput="markDirty()">'+esc((P.highlights||[]).join('\n'))+'</textarea></div>'
     +   '<div class="f full"><label>Jugadores con los que has trabajado</label><textarea id="f_players" style="min-height:70px" oninput="markDirty()">'+esc((P.notable_players||[]).join('\n'))+'</textarea></div>'
     +   '<div class="f"><label>Instagram</label><input id="s_instagram" placeholder="@usuario" value="'+esc(soc.instagram||'')+'" oninput="markDirty()"></div>'
     +   '<div class="f"><label>YouTube</label><input id="s_youtube" placeholder="https://youtube.com/@…" value="'+esc(soc.youtube||'')+'" oninput="markDirty()"></div>'
     +   '<div class="f"><label>TikTok</label><input id="s_tiktok" placeholder="@usuario" value="'+esc(soc.tiktok||'')+'" oninput="markDirty()"></div>'
     +   '<div class="f"><label>Sitio web</label><input id="s_web" placeholder="https://…" value="'+esc(soc.web||'')+'" oninput="markDirty()"></div>'
     + '</div></div>';

     + '<div class="offers" id="offers"></div></div>';

  renderOffers();

function mediaBox(field, title, sub, accept, isPhoto){
  var path = P[field], url = pubUrl(path), inner='';
  if(path) inner = isPhoto ? '<img src="'+url+'" alt="">' : '<video src="'+url+'#t=1" muted playsinline preload="metadata"></video>';
  return '<div class="f"><label>'+esc(title)+'</label>'
    + '<div class="drop'+(isPhoto?' photo':'')+(path?' has':'')+'" id="drop_'+field+'" onclick="pickFile(\''+field+'\',\''+accept+'\')">'
    + inner
    + (path?'<span class="x" title="Quitar" onclick="event.stopPropagation();clearMedia(\''+field+'\')">×</span>':'')
    + '<b>'+(isPhoto?'Subir foto':'Subir video')+'</b><small>'+esc(sub)+'</small><div class="bar"></div></div></div>';
}

function onName(){
  var n=$('f_name').value, s=$('f_slug');
  if(IS_NEW || !s.value) s.value=slugify(n);
  markDirty();
}

// ============================================================
// CHECKLIST + PUBLICAR
// ============================================================
function current(){
  // lee el formulario sin guardar
  return {
    photo: !!P.photo_path,
    headline: ($('f_headline')||{}).value || '',
    bio: ($('f_bio')||{}).value || '',
    specs: chipVals('specialties'),
    offers: OFFERS.filter(function(o){ return o.is_active; }).length
  };
}
function renderChecklist(){
  var c=current(), box=$('checklist'); if(!box) return;
  var items=[
    [c.photo,'Foto de perfil'],
    [c.headline.trim().length>=10,'Titular'],
    [c.bio.trim().length>=80,'Sobre mí (al menos 80 caracteres)'],
    [c.specs.length>0,'Al menos una especialidad'],
    [c.offers>0,'Al menos una oferta activa']
  ];
  var ok = items.every(function(i){ return i[0]; });
  var h=''; items.forEach(function(i){ h+='<div class="'+(i[0]?'ok':'')+'"><span class="dot">'+(i[0]?'✓':'')+'</span>'+esc(i[1])+'</div>'; });
  box.innerHTML=h;
  var pb=$('pubBtnBox');
  if(IS_NEW){ pb.innerHTML=''; return; }
  pb.innerHTML = P.is_published
    ? '<button class="btn sm ghost" onclick="setPublished(false)">Pasar a borrador</button>'
    : '<button class="btn primary sm" '+(ok?'':'disabled')+' onclick="setPublished(true)">Publicar vitrina</button>';
}
async function setPublished(v){
  if(DIRTY){ var okSave = await saveProfile(); if(!okSave) return; }
  var r = await sb.from('coach_profiles').update({is_published:v}).eq('coach_id',USER.id).select().single();
  if(r.error){ toast('No se pudo cambiar: '+r.error.message,true); return; }
  P=r.data; render(); toast(v?'¡Tu vitrina está publicada!':'Vitrina en borrador');
}

// ============================================================
// GUARDAR PERFIL
// ============================================================
function collect(){
  var slug = slugify($('f_slug').value || $('f_name').value);
  var soc={}; ['instagram','youtube','tiktok','web'].forEach(function(k){ var v=$('s_'+k).value.trim(); if(v) soc[k]=v; });
  var yrs=$('f_years').value;
  return {
    coach_id: USER.id,
    display_name: $('f_name').value.trim(),
    slug: slug,
    headline: $('f_headline').value.trim(),
    bio: $('f_bio').value.trim(),
    philosophy: $('f_phil').value.trim(),
    country: $('f_country').value,
    years_experience: yrs===''?null:parseInt(yrs,10),
    languages: chipVals('languages').length ? chipVals('languages') : ['es'],
    specialties: chipVals('specialties'),
    levels: chipVals('levels'),
    response_sla_hours: parseInt($('f_sla').value,10),
    certifications: lines($('f_certs').value).map(function(n){ return {nombre:n, verificada:false}; }),
    highlights: lines($('f_high').value),
    notable_players: lines($('f_players').value),
    social_links: soc,
    photo_path: P.photo_path, intro_video_path: P.intro_video_path, sample_video_path: P.sample_video_path,
    timezone: (Intl.DateTimeFormat().resolvedOptions().timeZone)||'America/Santiago'
  };
}
async function saveProfile(){
  var d = collect();
  if(!d.display_name){ toast('Falta tu nombre público',true); return false; }
  if(d.slug.length<3){ toast('Tu link necesita al menos 3 caracteres',true); return false; }
  $('f_slug').value=d.slug;
  var r = IS_NEW
    ? await sb.from('coach_profiles').insert(d).select().single()
    : await sb.from('coach_profiles').update(d).eq('coach_id',USER.id).select().single();
  if(r.error){
    var msg = r.error.message||'';
    if(msg.indexOf('slug')>=0 || r.error.code==='23505') toast('Ese link ya lo usa otro coach. Prueba con otro.',true);
    else toast('No se pudo guardar: '+msg,true);
    return false;
  }
  P=r.data; IS_NEW=false; DIRTY=false; $('saveBar').classList.remove('on');
  render(); toast('Cambios guardados');
  return true;
}

// ============================================================
// SUBIDA DE ARCHIVOS (bucket público coach-public)
// ============================================================
var PICK_FIELD=null;
function pickFile(field, accept){
  if(IS_NEW){ toast('Guarda tu nombre y link primero, después sube archivos',true); return; }
  PICK_FIELD=field; var fi=$('fileInput'); fi.value=''; fi.accept=accept; fi.click();
}
$('fileInput').addEventListener('change', function(){
  var f=this.files[0]; if(!f || !PICK_FIELD) return;
  var field=PICK_FIELD, isVideo=f.type.indexOf('video')===0;
  if(f.size > 200*1024*1024){ toast('El archivo pesa más de 200 MB',true); return; }
  if(isVideo && /quicktime|hevc/i.test(f.type)) toast('Ojo: los .mov de iPhone pueden no verse en Chrome. Mejor graba en "Más compatible".');
  var ext=(f.name.split('.').pop()||'bin').toLowerCase();
  var path=USER.id+'/'+field.replace('_path','')+'-'+Date.now()+'.'+ext;
  upload(path,f,field);
});

async function upload(path, file, field){
  var s = await sb.auth.getSession();
  var token = s.data.session.access_token;
  var drop=$('drop_'+field), bar=drop.querySelector('.bar');
  var xhr=new XMLHttpRequest();
  xhr.open('POST', SUPABASE_URL+'/storage/v1/object/'+BUCKET+'/'+path, true);
  xhr.setRequestHeader('Authorization','Bearer '+token);
  xhr.setRequestHeader('apikey', SUPABASE_ANON_KEY);
  xhr.setRequestHeader('x-upsert','true');
  xhr.setRequestHeader('Content-Type', file.type||'application/octet-stream');
  xhr.upload.onprogress=function(e){ if(e.lengthComputable) bar.style.width=Math.round(e.loaded/e.total*100)+'%'; };
  xhr.onload=async function(){
    if(xhr.status>=200 && xhr.status<300){
      var old=P[field];
      var upd={}; upd[field]=path;
      var r=await sb.from('coach_profiles').update(upd).eq('coach_id',USER.id).select().single();
      if(r.error){ toast('Se subió pero no se guardó: '+r.error.message,true); return; }
      if(old) sb.storage.from(BUCKET).remove([old]);
      var keepDirty=DIRTY, snapshot=keepDirty?collect():null;
      P=r.data;
      if(keepDirty){ Object.keys(snapshot).forEach(function(k){ if(k.indexOf('_path')<0) P[k]=snapshot[k]; }); }
      render(); if(keepDirty) markDirty();
      toast('Archivo subido');
    } else {
      bar.style.width='0';
      var m=''; try{ m=JSON.parse(xhr.responseText).message; }catch(e){}
      toast('Error al subir'+(m?': '+m:'')+(xhr.status===400||xhr.status===404?' · ¿corriste coach_hub_vitrina_v3_storage.sql?':''),true);
    }
  };
  xhr.onerror=function(){ bar.style.width='0'; toast('Se cortó la conexión al subir',true); };
  xhr.send(file);
}

async function clearMedia(field){
  if(!confirm('¿Quitar este archivo?')) return;
  var old=P[field], upd={}; upd[field]=null;
  var r=await sb.from('coach_profiles').update(upd).eq('coach_id',USER.id).select().single();
  if(r.error){ toast(r.error.message,true); return; }
  if(old) sb.storage.from(BUCKET).remove([old]);
  var keepDirty=DIRTY, snapshot=keepDirty?collect():null;
  P=r.data;
  if(keepDirty){ Object.keys(snapshot).forEach(function(k){ if(k.indexOf('_path')<0) P[k]=snapshot[k]; }); }
  render(); if(keepDirty) markDirty();
}

// ============================================================
// OFERTAS
// ============================================================
function offerSummary(o){
  var parts=[];
  if(o.kind==='paquete') parts.push(o.analyses_included+' análisis');
  if(o.kind==='plan_mensual') parts.push(o.analyses_included+' análisis cada '+(o.duration_days||30)+' días');
  var cr=o.capture_requirements||{};
  if(cr.angulos && cr.angulos.length) parts.push(cr.angulos.length+(cr.angulos.length===1?' ángulo':' ángulos')+' · '+(cr.swings_por_angulo||1)+' swings c/u');
  parts.push('máx. '+o.max_videos+' videos');
  return parts.join(' · ');
}
function renderOffers(){
  var box=$('offers'); if(!box) return;
  if(IS_NEW){ box.innerHTML='<div class="empty">Guarda tu perfil primero para crear ofertas.</div>'; return; }
  if(!OFFERS.length){ box.innerHTML='<div class="empty">Todavía no tienes ofertas. Parte con un <b>Análisis de swing</b> y una <b>Evaluación inicial</b>.</div>'; return; }
  var h='';
  OFFERS.forEach(function(o){
    h+='<div class="offer'+(o.is_active?'':' off')+'">'
      + '<div class="tx"><b><span class="kind">'+esc(KINDS[o.kind]||o.kind)+'</span>'+esc(o.title)+(o.is_trial?'<span class="trial">Evaluación</span>':'')+(o.is_active?'':' · pausada')+'</b>'
      + '<small>'+esc(offerSummary(o))+'</small></div>'
      + '<div class="price">'+(o.price===0?'Gratis':clp(o.price))+'</div>'
      + '<button class="btn sm" onclick="openOffer(\''+o.id+'\')">Editar</button>'
      + '</div>';
  });
  box.innerHTML=h;
}

function openOffer(id){
  if(IS_NEW){ toast('Guarda tu perfil primero',true); return; }
  var o = id ? OFFERS.filter(function(x){ return x.id===id; })[0] : null;
  EDIT_OFFER = o;
  var d = o || {kind:'analisis', title:'', description:'', price:'', analyses_included:1, duration_days:30, is_trial:false, is_active:true, max_videos:6,
                capture_requirements:{angulos:['frente','linea_de_tiro'], swings_por_angulo:3, palo:'libre', nota:''}};
  var cr = d.capture_requirements||{};
  var h = '<h3>'+(o?'Editar oferta':'Nueva oferta')+'</h3><div class="grid">'
    + '<div class="f"><label>Tipo</label><select id="o_kind" onchange="offerKind()">'
    +   optionList([['analisis',KINDS.analisis],['paquete',KINDS.paquete],['plan_mensual',KINDS.plan_mensual]], d.kind)
    + '</select><div class="hint">Las videollamadas llegan en la siguiente etapa.</div></div>'
    + '<div class="f"><label>Precio (CLP)</label><input id="o_price" type="number" min="0" step="1000" value="'+esc(d.price)+'"></div>'
    + '<div class="f full"><label>Título</label><input id="o_title" maxlength="70" placeholder="Análisis completo de full swing" value="'+esc(d.title)+'"></div>'
    + '<div class="f full"><label>Qué incluye</label><textarea id="o_desc" placeholder="Video con mi voz analizando tu swing, 2 drills específicos y fecha para tu video de seguimiento.">'+esc(d.description)+'</textarea></div>'
    + '<div class="f" id="o_n_box"><label>Análisis incluidos</label><input id="o_n" type="number" min="1" max="30" value="'+d.analyses_included+'"></div>'
    + '<div class="f" id="o_days_box"><label>Duración del plan (días)</label><input id="o_days" type="number" min="7" max="365" value="'+(d.duration_days||30)+'"></div>'
    + '<div class="full"><label class="tog"><input type="checkbox" id="o_trial"'+(d.is_trial?' checked':'')+'><span><b>Es una evaluación inicial</b><small>Puede ser gratis o rebajada. Cada alumno la puede comprar una sola vez contigo.</small></span></label></div>'
    + '</div><div class="hr"></div><div class="mtitle">Qué tiene que grabar el alumno</div><div class="grid">'
    + '<div class="f full"><label>Ángulos</label>'+chipsHTML('o_angles',ANGLES,cr.angulos||[])+'</div>'
    + '<div class="f"><label>Swings por ángulo</label><input id="o_swings" type="number" min="1" max="10" value="'+(cr.swings_por_angulo||3)+'"></div>'
    + '<div class="f"><label>Palo</label><select id="o_club">'+optionList(CLUBS,cr.palo||'libre')+'</select></div>'
    + '<div class="f"><label>Máximo de videos</label><input id="o_max" type="number" min="1" max="12" value="'+d.max_videos+'"></div>'
    + '<div class="f full"><label>Instrucción extra <i>opcional</i></label><input id="o_note" maxlength="160" placeholder="Graba a la altura de las manos, con el celular horizontal" value="'+esc(cr.nota||'')+'"></div>'
    + (o?'<div class="full"><label class="tog"><input type="checkbox" id="o_active"'+(d.is_active?' checked':'')+'><span><b>Activa</b><small>Si la desmarcas, deja de aparecer en tu perfil público.</small></span></label></div>':'')
    + '</div><div class="acts">'
    + (o?'<button class="btn danger ghost l" onclick="deleteOffer()">Eliminar</button>':'')
    + '<button class="btn ghost" onclick="closeOffer()">Cancelar</button><button class="btn primary" onclick="saveOffer()">Guardar oferta</button></div>';
  $('offerBody').innerHTML=h;
  // los chips del modal no deben marcar el perfil como modificado
  $('offerBody').querySelectorAll('.chip').forEach(function(c){ c.onclick=function(){ c.classList.toggle('on'); }; });
  $('offerModal').classList.add('on');
  offerKind();
}
function offerKind(){
  var k=$('o_kind').value;
  $('o_n_box').style.display = k==='analisis' ? 'none' : '';
  $('o_days_box').style.display = k==='plan_mensual' ? '' : 'none';
}
function closeOffer(){ $('offerModal').classList.remove('on'); EDIT_OFFER=null; }

async function saveOffer(){
  var k=$('o_kind').value, price=parseInt($('o_price').value,10), trial=$('o_trial').checked;
  var title=$('o_title').value.trim();
  if(!title){ toast('Ponle un título a la oferta',true); return; }
  if(isNaN(price) || price<0){ toast('Revisa el precio',true); return; }
  if(price===0 && !trial){ toast('Solo una evaluación inicial puede ser gratis',true); return; }
  var angles=chipVals('o_angles',$('offerBody'));
  if(!angles.length){ toast('Elige al menos un ángulo de grabación',true); return; }
  var swings=parseInt($('o_swings').value,10)||1, maxv=parseInt($('o_max').value,10)||6;
  if(angles.length > maxv){ toast('El máximo de videos es menor que la cantidad de ángulos',true); return; }
  var d = {
    coach_id: USER.id, kind:k, title:title, description:$('o_desc').value.trim(), price:price, currency:'CLP',
    analyses_included: k==='analisis' ? 1 : Math.max(1, parseInt($('o_n').value,10)||1),
    duration_days: k==='plan_mensual' ? (parseInt($('o_days').value,10)||30) : null,
    is_trial: trial, max_videos: maxv,
    capture_requirements: {angulos:angles, swings_por_angulo:swings, palo:$('o_club').value, nota:$('o_note').value.trim()}
  };
  if(EDIT_OFFER) d.is_active = $('o_active').checked; else d.sort_order = OFFERS.length;
  var r = EDIT_OFFER
    ? await sb.from('coach_offerings').update(d).eq('id',EDIT_OFFER.id).select().single()
    : await sb.from('coach_offerings').insert(d).select().single();
  if(r.error){ toast('No se pudo guardar: '+r.error.message,true); return; }
  closeOffer(); await loadOffers(); renderOffers(); renderChecklist(); toast('Oferta guardada');
}
async function deleteOffer(){
  if(!EDIT_OFFER || !confirm('¿Eliminar esta oferta?')) return;
  var r = await sb.from('coach_offerings').delete().eq('id',EDIT_OFFER.id);
  if(r.error){
    // si ya tiene compras, no se puede borrar: se pausa
    await sb.from('coach_offerings').update({is_active:false}).eq('id',EDIT_OFFER.id);
    toast('Esta oferta ya tiene compras, así que quedó pausada en vez de eliminada');
  } else toast('Oferta eliminada');
  closeOffer(); await loadOffers(); renderOffers(); renderChecklist();
}
$('offerModal').addEventListener('click',function(e){ if(e.target===this) closeOffer(); });

window.addEventListener('beforeunload',function(e){ if(DIRTY){ e.preventDefault(); e.returnValue=''; } });

// menú hamburguesa (mobile)
(function(){
  var btn=$('hamburgerBtn'), nav=$('navLinks');
  function set(open){ btn.classList.toggle('open',open); nav.classList.toggle('mobile-open',open); }
  btn.addEventListener('click',function(e){ e.stopPropagation(); set(!nav.classList.contains('mobile-open')); });
  document.addEventListener('click',function(e){ if(nav.classList.contains('mobile-open') && !nav.contains(e.target)) set(false); });
})();

init();
