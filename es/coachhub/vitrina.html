<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>Editar perfil · Coach Hub</title>
<meta name="robots" content="noindex">
<meta name="theme-color" content="#0a0a0a">
<link rel="manifest" href="/es/coachhub/manifest.json">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Coach Hub">
<link rel="apple-touch-icon" href="/es/coachhub/apple-touch-icon.png">
<link rel="icon" href="/es/coachhub/favicon-32.png" sizes="32x32">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Barlow:wght@400;500;600&family=Barlow+Condensed:wght@500;600;700&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="/js/mgl-products.js" data-product="hub"></script>
<script src="/js/mgl-precios.js"></script>
<style>
  :root{
    --bg:#0a0a0a; --bg2:#111; --card:#161616; --card2:#1c1c1c;
    --border:#262626; --border2:#333;
    --teal:#D4C5A9; --teal-dim:#7D7259; --gold:#F0B860;
    --text:#f5f5f5; --muted:#8a8a8a; --muted2:#666;
    --red:#e06a6a; --orange:#e0a15b;
  }
  *{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
  body{background:var(--bg);color:var(--text);font-family:'Barlow',sans-serif;-webkit-font-smoothing:antialiased;min-height:100vh}
  a{color:inherit;text-decoration:none}
  button,input,select,textarea{font-family:inherit;color:inherit}
  html{scrollbar-width:thin;scrollbar-color:rgba(255,255,255,.09) #0a0a0a}
  ::-webkit-scrollbar{width:10px;height:10px}
  ::-webkit-scrollbar-track{background:#0a0a0a}
  ::-webkit-scrollbar-thumb{background:rgba(255,255,255,.09);border-radius:10px;border:3px solid #0a0a0a}

  #siteHeader{position:sticky;top:0;z-index:50;background:rgba(10,10,10,.85);backdrop-filter:blur(12px);border-bottom:1px solid var(--border);padding-top:env(safe-area-inset-top)}
  .nav-inner{max-width:1200px;margin:0 auto;padding:0 20px;height:62px;display:flex;align-items:center;gap:18px}
  .brand{font-family:'Bebas Neue',sans-serif;font-size:25px;letter-spacing:2px}
  .brand span{color:var(--teal)}
  .hubchip{font-family:'Barlow Condensed';font-size:12px;font-weight:700;text-transform:uppercase;letter-spacing:.7px;color:var(--teal);border:1px solid var(--teal-dim);border-radius:20px;padding:3px 10px;white-space:nowrap}
  .nav-links{display:flex;gap:20px;margin-left:auto}
  .nav-links a{font-family:'Barlow Condensed';font-size:16px;font-weight:500;color:var(--muted);text-transform:uppercase;letter-spacing:.5px;white-space:nowrap}
  .nav-links a:hover{color:var(--text)}
  .nav-links a.active{color:var(--teal)}
  .avatar{width:36px;height:36px;border-radius:50%;background:var(--teal-dim);display:flex;align-items:center;justify-content:center;font-family:'Barlow Condensed';font-weight:700;color:#1C1709;overflow:hidden;flex:0 0 auto;margin-left:6px}
  .avatar img{width:100%;height:100%;object-fit:cover}
  .hamburger{display:none;flex-direction:column;gap:5px;background:none;border:none;cursor:pointer;padding:8px;margin-left:4px}
  .hamburger span{width:24px;height:2px;background:var(--text);transition:transform .2s,opacity .2s}
  .hamburger.open span:nth-child(1){transform:translateY(7px) rotate(45deg)}
  .hamburger.open span:nth-child(2){opacity:0}
  .hamburger.open span:nth-child(3){transform:translateY(-7px) rotate(-45deg)}

  .wrap{max-width:980px;margin:0 auto;padding:26px 20px calc(110px + env(safe-area-inset-bottom))}
  .top{display:flex;align-items:flex-end;gap:16px;flex-wrap:wrap;margin-bottom:22px}
  .top h1{font-family:'Bebas Neue';font-size:44px;letter-spacing:1px;line-height:1}
  .top p{color:var(--muted);margin-top:6px;font-size:15px;max-width:560px;line-height:1.45}
  .top .r{margin-left:auto;display:flex;gap:10px;align-items:center;flex-wrap:wrap}

  .status{font-family:'Barlow Condensed';font-weight:700;font-size:13px;text-transform:uppercase;letter-spacing:.6px;border-radius:20px;padding:4px 12px}
  .status.on{background:rgba(212,197,169,.12);color:var(--teal);border:1px solid var(--teal-dim)}
  .status.off{background:var(--card2);color:var(--muted);border:1px solid var(--border2)}

  .btn{background:var(--card2);border:1px solid var(--border2);border-radius:10px;padding:10px 16px;font-family:'Barlow Condensed';font-weight:700;font-size:15px;letter-spacing:.4px;text-transform:uppercase;cursor:pointer;white-space:nowrap}
  .btn:hover{border-color:var(--teal-dim)}
  .btn.primary{background:var(--teal);border-color:var(--teal);color:#1C1709}
  .btn.primary:disabled{opacity:.4;cursor:not-allowed}
  .btn.ghost{background:none}
  .btn.danger{color:var(--red)}
  .btn.sm{padding:7px 12px;font-size:13.5px}

  .stats{display:grid;grid-template-columns:repeat(3,1fr);gap:12px;margin-bottom:18px}
  .st{background:var(--card);border:1px solid var(--border);border-radius:14px;padding:14px}
  .st .v{font-family:'Bebas Neue';font-size:34px;line-height:1;color:var(--teal)}
  .st .l{color:var(--muted);font-size:12px;text-transform:uppercase;letter-spacing:.5px;margin-top:5px;font-family:'Barlow Condensed';font-weight:600}

  .sec{background:var(--card);border:1px solid var(--border);border-radius:18px;padding:22px;margin-bottom:18px}
  .sec h2{font-family:'Barlow Condensed';font-weight:700;font-size:22px;letter-spacing:.3px}
  .sec .sub{color:var(--muted);font-size:14px;margin:4px 0 18px;line-height:1.45}
  .sec-h{display:flex;align-items:center;gap:12px}
  .sec-h .r{margin-left:auto}

  .grid{display:grid;grid-template-columns:1fr 1fr;gap:16px}
  .full{grid-column:1/-1}
  .f label{display:block;font-family:'Barlow Condensed';font-weight:600;font-size:14px;text-transform:uppercase;letter-spacing:.5px;color:var(--muted);margin-bottom:7px}
  .f label i{font-style:normal;color:var(--muted2);text-transform:none;letter-spacing:0;font-family:'Barlow';font-weight:400;font-size:12.5px;margin-left:4px}
  .f input,.f select,.f textarea{width:100%;background:var(--bg2);border:1px solid var(--border2);border-radius:10px;padding:11px 13px;font-size:15px;outline:none}
  .f textarea{min-height:96px;resize:vertical;line-height:1.5}
  .f input:focus,.f select:focus,.f textarea:focus{border-color:var(--teal-dim)}
  .f .hint{color:var(--muted2);font-size:12.5px;margin-top:6px;line-height:1.4}
  .slugbox{display:flex;align-items:center;background:var(--bg2);border:1px solid var(--border2);border-radius:10px;overflow:hidden}
  .slugbox span{color:var(--muted2);font-size:13.5px;padding-left:13px;white-space:nowrap}
  .slugbox input{border:none;background:none;padding-left:2px}

  .chips{display:flex;flex-wrap:wrap;gap:8px}
  .chip{background:var(--bg2);border:1px solid var(--border2);border-radius:20px;padding:7px 13px;font-size:14px;cursor:pointer;user-select:none}
  .chip.on{background:rgba(212,197,169,.12);border-color:var(--teal);color:var(--teal)}

  .media-row{display:grid;grid-template-columns:150px 1fr 1fr;gap:16px}
  .drop{position:relative;background:var(--bg2);border:1px dashed var(--border2);border-radius:14px;min-height:150px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:6px;cursor:pointer;overflow:hidden;text-align:center;padding:10px}
  .drop:hover{border-color:var(--teal-dim)}
  .drop.photo{border-radius:50%;width:150px;height:150px;min-height:0}
  .drop img,.drop video{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
  .drop b{font-family:'Barlow Condensed';font-weight:700;font-size:15px;position:relative}
  .drop small{color:var(--muted);font-size:12.5px;position:relative}
  .drop .bar{position:absolute;left:0;bottom:0;height:4px;background:var(--teal);width:0;transition:width .2s}
  .drop .x{position:absolute;top:8px;right:8px;width:28px;height:28px;border-radius:50%;background:rgba(0,0,0,.7);border:1px solid var(--border2);display:flex;align-items:center;justify-content:center;font-size:16px;z-index:2}
  .drop.has b,.drop.has small{display:none}

  .check{display:flex;flex-direction:column;gap:8px}
  .check div{display:flex;gap:10px;align-items:center;font-size:14.5px;color:var(--muted)}
  .check div.ok{color:var(--text)}
  .check .dot{width:20px;height:20px;border-radius:50%;border:1px solid var(--border2);display:flex;align-items:center;justify-content:center;font-size:12px;flex:0 0 auto}
  .check .ok .dot{background:var(--teal);border-color:var(--teal);color:#1C1709;font-weight:700}

  .offers{display:flex;flex-direction:column;gap:10px}
  .offer{display:flex;align-items:center;gap:14px;background:var(--bg2);border:1px solid var(--border);border-radius:14px;padding:14px 16px}
  .offer.off{opacity:.5}
  .offer .tx{flex:1;min-width:0}
  .offer .tx b{font-weight:600;font-size:16px}
  .offer .tx small{display:block;color:var(--muted);font-size:13px;margin-top:3px}
  .offer .price{font-family:'Bebas Neue';font-size:26px;color:var(--teal);white-space:nowrap}
  .kind{font-family:'Barlow Condensed';font-weight:700;font-size:12px;text-transform:uppercase;letter-spacing:.5px;color:var(--gold);margin-right:6px}
  .trial{font-family:'Barlow Condensed';font-weight:700;font-size:12px;text-transform:uppercase;color:#1C1709;background:var(--gold);border-radius:6px;padding:1px 6px;margin-left:6px}
  .empty{color:var(--muted);font-size:14px;line-height:1.5;padding:6px 0}

  .savebar{position:fixed;left:0;right:0;bottom:0;z-index:40;background:rgba(10,10,10,.92);backdrop-filter:blur(12px);border-top:1px solid var(--border);padding:12px 20px calc(12px + env(safe-area-inset-bottom));display:flex;justify-content:center;gap:10px;transform:translateY(100%);visibility:hidden;transition:transform .2s,visibility .2s}
  .savebar.on{transform:none;visibility:visible}
  .savebar span{align-self:center;color:var(--muted);font-size:14px;margin-right:6px}

  .backlink{display:inline-block;color:var(--muted);font-family:'Barlow Condensed';font-weight:600;font-size:14px;letter-spacing:.5px;text-transform:uppercase;margin-bottom:10px}
  .backlink:hover{color:var(--teal)}
  #ofertas{scroll-margin-top:80px}
  .modal-bg{position:fixed;inset:0;background:rgba(0,0,0,.72);z-index:100;display:none;align-items:flex-start;justify-content:center;overflow-y:auto;padding:40px 16px}
  .modal-bg.on{display:flex}
  .modal{background:var(--card);border:1px solid var(--border2);border-radius:18px;width:100%;max-width:620px;padding:22px}
  .modal h3{font-family:'Barlow Condensed';font-weight:700;font-size:24px;margin-bottom:16px}
  .modal .acts{display:flex;gap:10px;justify-content:flex-end;margin-top:20px;flex-wrap:wrap}
  .modal .acts .l{margin-right:auto}
  /* recortador de foto de perfil */
  .modal.crop{max-width:440px}
  /* foto y nombre */
  .idn-row{display:flex;gap:26px;align-items:center}
  .idn-ph{position:relative;width:132px;height:132px;border-radius:50%;flex:0 0 auto;background:#2B2619;border:2px solid var(--teal-dim);overflow:hidden;cursor:pointer;display:flex;align-items:center;justify-content:center}
  .idn-ph img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
  .idn-ini{font-family:'Bebas Neue';font-size:48px;color:var(--teal);letter-spacing:1px}
  .idn-cam{position:absolute;right:6px;bottom:6px;width:36px;height:36px;border-radius:50%;background:var(--teal);color:#1C1709;display:flex;align-items:center;justify-content:center;box-shadow:0 0 0 3px var(--card)}
  .idn-cam svg{width:18px;height:18px}
  .idn-ph:hover{border-color:var(--teal)}
  .idn-ph .bar{position:absolute;left:0;bottom:0;height:5px;background:var(--teal);width:0;transition:width .2s}
  .idn-f{flex:1 1 auto;display:grid;gap:12px;min-width:0}
  .media-row.two{grid-template-columns:1fr 1fr}
  /* ventanita de la foto */
  .sheet-bg{align-items:center}
  .modal.sheet{max-width:380px}
  .sheet-ph{width:110px;height:110px;border-radius:50%;overflow:hidden;margin:0 auto 16px;border:2px solid var(--teal-dim)}
  .sheet-ph img{width:100%;height:100%;object-fit:cover}
  .sheet-op{display:flex;align-items:center;gap:14px;width:100%;text-align:left;background:var(--bg2);border:1px solid var(--border);border-radius:12px;padding:12px 14px;margin-top:8px;cursor:pointer;color:var(--text);font-family:Barlow,sans-serif}
  .sheet-op:hover{border-color:var(--teal-dim)}
  .sheet-op span{width:34px;height:34px;border-radius:50%;background:rgba(212,197,169,.1);color:var(--teal);display:flex;align-items:center;justify-content:center;font-size:17px;flex:0 0 auto}
  .sheet-op b{display:block;font-size:15px}
  .sheet-op small{color:var(--muted);font-size:13px}
  .sheet-op.danger span{background:rgba(224,106,106,.12);color:var(--red,#e06a6a)}
  .sheet-op.danger b{color:var(--red,#e06a6a)}
  @media(max-width:620px){ .idn-row{flex-direction:column;align-items:center;text-align:left} .idn-f{width:100%} .media-row.two{grid-template-columns:1fr} }
  .crop-stage{position:relative;width:100%;max-width:380px;aspect-ratio:1/1;margin:0 auto;border-radius:16px;overflow:hidden;background:#000;touch-action:none;cursor:grab}
  .crop-stage:active{cursor:grabbing}
  .crop-stage canvas{width:100%;height:100%;display:block}
  .crop-ring{position:absolute;inset:0;pointer-events:none;border-radius:16px;
    background:radial-gradient(circle at center, transparent 0, transparent 69.5%, rgba(0,0,0,.6) 70%);}
  .crop-hint{color:var(--muted);font-size:13px;text-align:center;margin-top:10px}
  .crop-ctrl{display:flex;align-items:center;gap:10px;margin-top:14px}
  .crop-ctrl input[type=range]{flex:1;accent-color:var(--teal)}
  .crop-ic{color:var(--muted);font-size:20px;width:16px;text-align:center}
  .tog{display:flex;gap:10px;align-items:flex-start;background:var(--bg2);border:1px solid var(--border2);border-radius:10px;padding:12px;cursor:pointer}
  .tog input{width:18px;height:18px;margin-top:2px;accent-color:var(--teal);flex:0 0 auto}
  .tog b{font-weight:600;font-size:14.5px;display:block}
  .tog small{color:var(--muted);font-size:13px}
  .hr{height:1px;background:var(--border);margin:18px 0}
  .mtitle{font-family:'Barlow Condensed';font-weight:700;font-size:16px;text-transform:uppercase;letter-spacing:.5px;color:var(--gold);margin-bottom:12px}

  .wz-steps{display:flex;gap:6px;margin:0 0 18px;overflow-x:auto;padding-bottom:4px}
  .wz-dot{flex:1;min-width:92px;display:flex;flex-direction:column;align-items:center;gap:6px;text-align:center}
  .wz-dot span{width:32px;height:32px;border-radius:50%;border:1px solid var(--border2);background:var(--card);display:flex;align-items:center;justify-content:center;font-family:'Barlow Condensed';font-weight:700;color:var(--muted)}
  .wz-dot small{font-family:'Barlow Condensed';font-weight:600;font-size:12.5px;text-transform:uppercase;letter-spacing:.4px;color:var(--muted2)}
  .wz-dot.on span{background:var(--teal);border-color:var(--teal);color:#1C1709}
  .wz-dot.on small{color:var(--text)}
  .wz-dot.done span{background:rgba(212,197,169,.12);border-color:var(--teal-dim);color:var(--teal)}
  .wz-nav{display:flex;justify-content:space-between;gap:10px;margin-top:4px}
  .wz-nav .btn{padding:13px 22px;font-size:16px}
  .wz-nav .btn:disabled{opacity:.5}
  .wz-done{text-align:center;max-width:560px;margin:50px auto}
  .wz-done .ok{width:74px;height:74px;border-radius:50%;background:var(--teal);color:#1C1709;font-size:38px;font-weight:700;display:flex;align-items:center;justify-content:center;margin:0 auto 20px}
  .wz-done h1{font-family:'Bebas Neue';font-size:44px;letter-spacing:1px}
  .wz-done p{color:var(--muted);font-size:16px;line-height:1.5;margin-top:10px}
  .wz-done .link{margin:20px auto 0;background:var(--card);border:1px solid var(--border2);border-radius:10px;padding:12px;font-size:14px;color:var(--teal);word-break:break-all}
  .wz-done .acts{display:flex;gap:10px;justify-content:center;margin-top:22px;flex-wrap:wrap}
  .loading{color:var(--muted);padding:60px 0;text-align:center}
  .toast{position:fixed;left:50%;bottom:calc(84px + env(safe-area-inset-bottom));transform:translateX(-50%) translateY(16px);background:#222;border:1px solid var(--border2);color:#fff;padding:10px 16px;border-radius:10px;font-size:14px;opacity:0;pointer-events:none;transition:all .25s;z-index:200;max-width:90vw;text-align:center}
  .toast.show{opacity:1;transform:translateX(-50%) translateY(0)}
  .toast.err{border-color:rgba(224,106,106,.5);color:#ffb3b3}

  @media(max-width:900px){
    .nav-links{display:none}
    .nav-inner .avatar{margin-left:auto}
    .nav-links.mobile-open{display:flex;flex-direction:column;gap:0;position:absolute;top:100%;left:0;right:0;background:rgba(10,10,10,.97);border-bottom:1px solid var(--border);padding:6px 20px 14px;margin:0}
    .nav-links.mobile-open a{padding:15px 0;font-size:19px;border-bottom:1px solid var(--border)}
    .hamburger{display:flex;margin-left:auto}
    .grid{grid-template-columns:1fr}
    .media-row{grid-template-columns:1fr}
    .drop.photo{margin:0 auto}
    .top h1{font-size:38px}
    .top .r{margin-left:0}
    .stats{grid-template-columns:repeat(3,1fr);gap:8px}
    .st .v{font-size:28px}
    .offer{flex-wrap:wrap}
    .offer .tx{flex:1 1 100%}
    .offer .price{margin-right:auto}
  }
</style>
</head>
<body>

<header id="siteHeader">
  <div class="nav-inner">
    <a href="/es/coachhub/dashboard.html" class="brand">COACH<span>HUB</span></a><span class="brand-by">by MyGolfLab</span>
    <nav class="nav-links" id="navLinks">
      <a href="/es/coachhub/dashboard.html">Dashboard</a>
      <a href="/es/coachhub/jugador.html">Mis jugadores</a>
      <a href="/es/coachhub/clases.html" data-nav="clases">Clases</a>
      <a href="/es/coachhub/mensajes.html" data-nav="mensajes">Mensajes</a>
      <a href="/es/coachhub/analisis.html?from=dash">Analizar swing</a>
    </nav>
    <a class="avatar" id="navAvatar" href="/es/coachhub/cuenta.html" title="Mi cuenta">?</a>
    <button class="hamburger" id="hamburgerBtn" aria-label="Menú"><span></span><span></span><span></span></button>
  </div>
</header>

<div class="wrap" id="wrap"><div class="loading">Cargando tu vitrina…</div></div>

<div class="savebar" id="saveBar"><span>Tienes cambios sin guardar</span><button class="btn primary" onclick="saveProfile()">Guardar cambios</button></div>

<div class="modal-bg" id="offerModal"><div class="modal" id="offerBody"></div></div>
<div class="modal-bg sheet-bg" id="photoSheet"><div class="modal sheet">
  <h3>Foto de perfil</h3>
  <div class="sheet-ph" id="sheetPh"></div>
  <button class="sheet-op" type="button" id="opAdjust"><span>✥</span><div><b>Ajustar la foto actual</b><small>Acercar, mover o girar</small></div></button>
  <button class="sheet-op" type="button" id="opPick"><span>⬆</span><div><b>Elegir otra foto</b><small>De la galería del teléfono o tu computador</small></div></button>
  <button class="sheet-op danger" type="button" id="opRemove"><span>×</span><div><b>Quitar foto</b></div></button>
  <div class="acts"><button class="btn ghost" type="button" onclick="closeSheet()">Cancelar</button></div>
</div></div>
<div class="modal-bg" id="cropModal"><div class="modal crop">
  <h3>Ajusta tu foto</h3>
  <div class="crop-stage" id="cropStage"><canvas id="cropCanvas" width="640" height="640"></canvas><div class="crop-ring"></div></div>
  <div class="crop-hint">Arrastra para mover · pellizca, usa la rueda o la barra para acercar</div>
  <div class="crop-ctrl">
    <span class="crop-ic">−</span><input type="range" id="cropZoom" min="1" max="4" step="0.01" value="1"><span class="crop-ic">+</span>
    <button class="btn ghost sm" type="button" id="cropRotate" title="Girar">↻ Girar</button>
  </div>
  <div class="acts"><button class="btn ghost" type="button" id="cropCancel">Cancelar</button><button class="btn primary" type="button" id="cropOk">Usar foto</button></div>
</div></div>
<input type="file" id="fileInput" style="display:none">
<div class="toast" id="toast"></div>

<script>
// ============================================================
// SUPABASE

function $(id){ return document.getElementById(id); }
function esc(s){ if(s==null) return ''; return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;'); }
function toast(m,err){ var t=$('toast'); t.textContent=m; t.className='toast show'+(err?' err':''); clearTimeout(toast._t); toast._t=setTimeout(function(){ t.className='toast'; },err?5000:2600); }
function pubUrl(path){ return path ? SUPABASE_URL+'/storage/v1/object/public/'+BUCKET+'/'+path.split('/').map(encodeURIComponent).join('/') : ''; }
function clp(n){ try{ return new Intl.NumberFormat('es-CL',{style:'currency',currency:'CLP',maximumFractionDigits:0}).format(n||0); }catch(e){ return '$'+n; } }
function slugify(s){
  return String(s||'').toLowerCase().normalize('NFD').replace(/[̀-ͯ]/g,'')
    .replace(/[^a-z0-9]+/g,'-').replace(/^-+|-+$/g,'').slice(0,40);
}
function lines(v){ return String(v||'').split('\n').map(function(x){ return x.trim(); }).filter(Boolean); }
function optionList(arr, sel){ var h=''; arr.forEach(function(o){ h+='<option value="'+o[0]+'"'+(o[0]===sel?' selected':'')+'>'+esc(o[1])+'</option>'; }); return h; }
function chipsHTML(group, arr, selected){
  var h='<div class="chips" data-group="'+group+'">';
  arr.forEach(function(o){ h+='<span class="chip'+(selected.indexOf(o[0])>=0?' on':'')+'" data-v="'+o[0]+'" onclick="toggleChip(this)">'+esc(o[1])+'</span>'; });
  return h+'</div>';
}
function toggleChip(el){ el.classList.toggle('on'); markDirty(); }
function chipVals(group, root){
  var out=[]; var box=(root||document).querySelector('[data-group="'+group+'"]');
  if(!box) return null;   // el grupo no está en pantalla
  box.querySelectorAll('.chip.on').forEach(function(c){ out.push(c.getAttribute('data-v')); });
  return out;
}
function markDirty(){ DIRTY=true; if(!WIZ) $('saveBar').classList.add('on'); renderChecklist(); updBio(); }

async function init(){
  var s = await sb.auth.getSession();
  if(!s.data.session){ window.location.href='/es/coachhub/entrar.html'; return; }
  USER = s.data.session.user;
  (function(){ var m=USER.user_metadata||{}, av=document.getElementById('navAvatar'); if(!av) return;
    if(m.avatar_url||m.picture) av.innerHTML='<img src="'+esc(m.avatar_url||m.picture)+'" alt="">';
    else av.textContent=(m.first_name||m.full_name||USER.email||'?').charAt(0).toUpperCase(); })();

  var pr = await sb.from('profiles').select('role').eq('id',USER.id).maybeSingle();
  var role = (pr.data && pr.data.role) || 'jugador';
  if(role!=='coach' && role!=='ambos'){ window.location.replace('jugador.html'); return; }

  var r = await sb.from('coach_profiles').select('*').eq('coach_id',USER.id).maybeSingle();
  if(r.error){
    $('wrap').innerHTML='<div class="loading">No se pudo cargar la vitrina. ¿Corriste las migraciones coach_hub_vitrina_v1 y v2?<br><small>'+esc(r.error.message)+'</small></div>';
    return;
  }
  var meta = USER.user_metadata||{};
  if(r.data){ P=r.data; IS_NEW=false; }
  else {
    var nombre = (meta.full_name || ((meta.first_name||'')+' '+(meta.last_name||'')).trim() || '').trim();
    P = { coach_id:USER.id, display_name:nombre, slug:slugify(nombre), headline:'', bio:'', philosophy:'',
          photo_path:null, intro_video_path:null, sample_video_path:null, country:'CL', languages:['es'],
          specialties:[], levels:[], certifications:[], highlights:[], notable_players:[], social_links:{},
          years_experience:null, response_sla_hours:72, is_published:false, is_verified:false, rating_avg:0, rating_count:0 };
  }
  await loadOffers();
  await loadViews();
  // Primer registro (o llegó desde el aviso del dashboard): asistente paso a paso
  var q = new URLSearchParams(location.search);
  if(!P.is_published && (IS_NEW || q.get('onboarding')==='1')){
    WIZ = true;
    WSTEP = IS_NEW ? 0 : firstIncomplete();
  }
  render();
}

async function loadOffers(){
  if(IS_NEW){ OFFERS=[]; return; }
  var r = await sb.from('coach_offerings').select('*').eq('coach_id',USER.id).order('sort_order').order('created_at');
  OFFERS = r.data||[];
}
async function loadViews(){
  if(IS_NEW) return;
  var d = new Date(); d.setDate(d.getDate()-30);
  var r = await sb.from('coach_profile_views').select('dia,visitas').eq('coach_id',USER.id).gte('dia', d.toISOString().slice(0,10));
  var lim7 = new Date(); lim7.setDate(lim7.getDate()-7); var l7 = lim7.toISOString().slice(0,10);
  VIEWS={d7:0,d30:0};
  (r.data||[]).forEach(function(v){ VIEWS.d30+=v.visitas; if(v.dia>=l7) VIEWS.d7+=v.visitas; });
}

var STEPS = [
  {id:'basic',  t:'Foto y nombre',       sec:function(){ return secIdentity()+secBasic(); }},
  {id:'media',  t:'Presentación',        sec:secMedia},
  {id:'spec',   t:'Especialidad',        sec:secSpec},
  {id:'cred',   t:'Trayectoria',         sec:secCred},
  {id:'offers', t:'Lo que vendes',       sec:secOffers},
  {id:'publish',t:'Publicar',            sec:secPublish}
];
function stepMissing(i){
  var c=current(), m=[];
  var id=STEPS[i].id;
  if(id==='basic'){
    if(!c.name.trim()) m.push('tu nombre público');
    if(slugify(c.slug||c.name).length<3) m.push('tu link (mínimo 3 caracteres)');
    if(c.headline.trim().length<10) m.push('un titular (mínimo 10 caracteres)');
    if(!c.photo) m.push('tu foto de perfil');
  }
  if(id==='media'){
    if(c.bio.trim().length<80) m.push('"Sobre mí" (mínimo 80 caracteres)');
  }
  if(id==='spec'){
    if(!c.specs.length) m.push('al menos una especialidad');
    if(!c.levels.length) m.push('al menos un nivel');
  }
  if(id==='offers' && !c.offers) m.push('al menos una oferta');
  return m;
}
function firstIncomplete(){
  for(var i=0;i<STEPS.length-1;i++){ if(stepMissing(i).length) return i; }
  return STEPS.length-1;
}
function renderWizard(){
  if(WSTEP==='done'){
    var url='/es/coaches/perfil.html?c='+encodeURIComponent(P.slug||'');
    $('wrap').innerHTML='<div class="wz-done"><div class="ok">✓</div><h1>¡Tu vitrina está publicada!</h1>'
      + '<p>Ya apareces en el buscador de coaches. Comparte tu link en Instagram y WhatsApp para recibir tus primeros alumnos.</p>'
      + '<div class="link">mygolflab.golf'+esc(url)+'</div>'
      + '<div class="acts"><a class="btn" href="'+url+'" target="_blank">Ver mi perfil público</a><a class="btn primary" href="dashboard.html">Ir a mi dashboard</a></div></div>';
    return;
  }
  var st=STEPS[WSTEP];
  var dots=''; STEPS.forEach(function(s,i){ dots+='<div class="wz-dot'+(i<WSTEP?' done':'')+(i===WSTEP?' on':'')+'"><span>'+(i<WSTEP?'✓':(i+1))+'</span><small>'+esc(s.t)+'</small></div>'; });
  var h='<div class="top"><div><h1>Bienvenido a Coach Hub</h1><p>Antes de empezar, crea tu perfil de coach. Así los jugadores te pueden encontrar en la vitrina y comprarte clases online. Toma unos 5 minutos y se guarda en cada paso.</p></div></div>'
    + '<div class="wz-steps">'+dots+'</div>'
    + st.sec()
    + '<div class="wz-nav">'
    + (WSTEP>0?'<button class="btn ghost" onclick="wizBack()">‹ Atrás</button>':'<span></span>')
    + (st.id==='publish'
        ? '<button class="btn primary" id="wzNext" onclick="wizPublish()">Publicar mi vitrina</button>'
        : '<button class="btn primary" id="wzNext" onclick="wizNext()">'+(st.id==='cred'?'Siguiente (o saltar)':'Siguiente')+' ›</button>')
    + '</div>';
  $('wrap').innerHTML=h;
  if(st.id==='offers') renderOffers();
  if(st.id==='publish') renderChecklist();
  updBio();
}
async function wizNext(){
  var miss=stepMissing(WSTEP);
  if(miss.length){ toast('Te falta: '+miss.join(', '),true); return; }
  var btn=$('wzNext'); btn.disabled=true;
  if(STEPS[WSTEP].id!=='offers'){
    var ok=await saveProfile({silent:true, norender:true});
    if(!ok){ btn.disabled=false; return; }
  }
  WSTEP++; render(); window.scrollTo(0,0);
}
function wizBack(){
  if(DIRTY && !IS_NEW){ saveProfile({silent:true, norender:true}); }
  WSTEP=Math.max(0,WSTEP-1); render(); window.scrollTo(0,0);
}
async function wizPublish(){
  for(var i=0;i<STEPS.length-1;i++){
    var m=stepMissing(i);
    if(m.length){ toast('Te falta: '+m.join(', '),true); WSTEP=i; render(); return; }
  }
  var r = await sb.from('coach_profiles').update({is_published:true}).eq('coach_id',USER.id).select().single();
  if(r.error){ toast('No se pudo publicar: '+r.error.message,true); return; }
  P=r.data; WSTEP='done'; render();
}

  return '<div class="f"><label>'+esc(title)+'</label>'
    + '<div class="drop'+(isPhoto?' photo':'')+(path?' has':'')+'" id="drop_'+field+'" onclick="pickFile(\''+field+'\',\''+accept+'\')">'
    + inner
    + (path?'<span class="x" title="Quitar" onclick="event.stopPropagation();clearMedia(\''+field+'\')">×</span>':'')
    + '<b>'+(isPhoto?'Subir foto':'Subir video')+'</b><small>'+esc(sub)+'</small><div class="bar"></div></div></div>';
}

// lee el formulario visible; lo que no está en pantalla se toma de lo guardado
function fv(id, fb){ var e=$(id); return e ? e.value : (fb==null?'':fb); }
function chipsOr(group, fb){ var v=chipVals(group); return v===null ? (fb||[]).slice() : v; }
function current(){
  return {
    photo: !!P.photo_path,
    name: fv('f_name', P.display_name),
    slug: fv('f_slug', P.slug),
    headline: fv('f_headline', P.headline),
    bio: fv('f_bio', P.bio),
    specs: chipsOr('specialties', P.specialties),
    levels: chipsOr('levels', P.levels),
    offers: OFFERS.filter(function(o){ return o.is_active; }).length
  };
}
function renderChecklist(){
  var c=current(), box=$('checklist'); if(!box) return;
  var items=[
    [c.photo,'Foto de perfil'],
    [c.headline.trim().length>=10,'Titular'],
    [c.bio.trim().length>=80,'Sobre mí (al menos 80 caracteres)'],
    [c.specs.length>0,'Al menos una especialidad'],
    [c.offers>0,'Al menos una oferta activa']
  ];
  var ok = items.every(function(i){ return i[0]; });
  var h=''; items.forEach(function(i){ h+='<div class="'+(i[0]?'ok':'')+'"><span class="dot">'+(i[0]?'✓':'')+'</span>'+esc(i[1])+'</div>'; });
  box.innerHTML=h;
  var pb=$('pubBtnBox');
  if(WIZ || IS_NEW){ pb.innerHTML=''; return; }
  // completa y publicada: la lista ya no hace falta; "Pasar a borrador" queda arriba
  var done = ok && P.is_published, sec=$('pubSec'), td=$('topDraft');
  if(sec) sec.style.display = done ? 'none' : '';

// ============================================================
// RECORTADOR DE FOTO DE PERFIL
// ============================================================
var CROP = null;
function openCrop(file){
  var url = URL.createObjectURL(file), img = new Image();
  img.onload = function(){
    CROP = { img:img, url:url, z:1, rot:0, x:0, y:0, ptrs:{}, pinch:null, drag:null };
    $('cropZoom').value = 1;
    cropFit(); cropDraw();
    $('cropModal').classList.add('on');
  };
  img.onerror = function(){ URL.revokeObjectURL(url); toast('No se pudo abrir la imagen',true); };
  img.src = url;
}
// tamaño base: la imagen cubre todo el cuadro con zoom 1
function cropBase(){
  var c=CROP, rw = (c.rot%180===0) ? c.img.width : c.img.height, rh = (c.rot%180===0) ? c.img.height : c.img.width;
  return 640 / Math.min(rw, rh);
}
function cropFit(){ CROP.x=0; CROP.y=0; cropClamp(); }
function cropClamp(){
  var c=CROP, s=cropBase()*c.z;
  var rw = (c.rot%180===0) ? c.img.width : c.img.height, rh = (c.rot%180===0) ? c.img.height : c.img.width;
  var mx = Math.max(0,(rw*s-640)/2), my = Math.max(0,(rh*s-640)/2);
  c.x = Math.max(-mx, Math.min(mx, c.x));
  c.y = Math.max(-my, Math.min(my, c.y));
}
function cropPaint(ctx, size){
  var c=CROP, k=size/640, s=cropBase()*c.z*k;
  ctx.save();
  ctx.fillStyle='#000'; ctx.fillRect(0,0,size,size);
  ctx.translate(size/2 + c.x*k, size/2 + c.y*k);
  ctx.rotate(c.rot*Math.PI/180);
  ctx.drawImage(c.img, -c.img.width*s/2, -c.img.height*s/2, c.img.width*s, c.img.height*s);
  ctx.restore();
}
function cropDraw(){ if(CROP) cropPaint($('cropCanvas').getContext('2d'), 640); }
function cropScale(){ var r=$('cropCanvas').getBoundingClientRect(); return 640 / (r.width||640); }
function cropSetZoom(z, cx, cy){
  var c=CROP, z0=c.z; z=Math.max(1, Math.min(4, z));
  // acercar hacia el punto indicado (centro del cuadro si no hay)
  cx = (cx==null) ? 0 : cx - 320; cy = (cy==null) ? 0 : cy - 320;
  c.x = cx - (cx - c.x) * z / z0; c.y = cy - (cy - c.y) * z / z0;
  c.z = z; $('cropZoom').value = z; cropClamp(); cropDraw();
}
function closeCrop(){
  $('cropModal').classList.remove('on');
  if(CROP){ URL.revokeObjectURL(CROP.url); CROP=null; }
}
(function(){
  var st=$('cropStage');
  function pos(e){ var r=st.getBoundingClientRect(), k=640/r.width; return [(e.clientX-r.left)*k, (e.clientY-r.top)*k]; }
  st.addEventListener('pointerdown',function(e){
    if(!CROP) return; e.preventDefault();
    try{ st.setPointerCapture(e.pointerId); }catch(er){}
    CROP.ptrs[e.pointerId]=pos(e);
    var ids=Object.keys(CROP.ptrs);
    if(ids.length===2){
      var a=CROP.ptrs[ids[0]], b=CROP.ptrs[ids[1]];
      CROP.pinch={ d0:Math.max(10,Math.hypot(a[0]-b[0],a[1]-b[1])), z0:CROP.z }; CROP.drag=null;
    } else if(ids.length===1){
      CROP.drag={ sx:CROP.ptrs[ids[0]][0], sy:CROP.ptrs[ids[0]][1], x0:CROP.x, y0:CROP.y };
    }
  });
  st.addEventListener('pointermove',function(e){
    if(!CROP || !CROP.ptrs[e.pointerId]) return; e.preventDefault();
    CROP.ptrs[e.pointerId]=pos(e);
    var ids=Object.keys(CROP.ptrs);
    if(CROP.pinch && ids.length>=2){
      var a=CROP.ptrs[ids[0]], b=CROP.ptrs[ids[1]];
      cropSetZoom(CROP.pinch.z0*Math.hypot(a[0]-b[0],a[1]-b[1])/CROP.pinch.d0, (a[0]+b[0])/2, (a[1]+b[1])/2);
    } else if(CROP.drag){
      var p=CROP.ptrs[e.pointerId];
      CROP.x=CROP.drag.x0+(p[0]-CROP.drag.sx); CROP.y=CROP.drag.y0+(p[1]-CROP.drag.sy);
      cropClamp(); cropDraw();
    }
  });
  function up(e){
    if(!CROP) return; delete CROP.ptrs[e.pointerId];
    var ids=Object.keys(CROP.ptrs);
    if(ids.length<2) CROP.pinch=null;
    if(ids.length===1){ var p=CROP.ptrs[ids[0]]; CROP.drag={ sx:p[0], sy:p[1], x0:CROP.x, y0:CROP.y }; }
    if(!ids.length) CROP.drag=null;
  }
  st.addEventListener('pointerup',up); st.addEventListener('pointercancel',up);
  st.addEventListener('wheel',function(e){
    if(!CROP) return; e.preventDefault();
    var p=pos(e); cropSetZoom(CROP.z*Math.exp(-e.deltaY*0.0022), p[0], p[1]);
  },{passive:false});
  $('cropZoom').addEventListener('input',function(){ if(CROP) cropSetZoom(parseFloat(this.value)); });
  $('cropRotate').addEventListener('click',function(){ if(!CROP) return; CROP.rot=(CROP.rot+90)%360; cropFit(); cropDraw(); });
  $('cropCancel').addEventListener('click',closeCrop);
  $('cropModal').addEventListener('click',function(e){ if(e.target===this) closeCrop(); });
  $('cropOk').addEventListener('click',function(){
    if(!CROP) return;
    // se exporta a 800×800 JPG
    var out=document.createElement('canvas'); out.width=800; out.height=800;
    cropPaint(out.getContext('2d'), 800);
    out.toBlob(function(blob){
      if(!blob){ toast('No se pudo preparar la foto',true); return; }
      closeCrop();
      var path=USER.id+'/photo-'+Date.now()+'.jpg';
      upload(path, new File([blob],'foto.jpg',{type:'image/jpeg'}), 'photo_path');
    },'image/jpeg',0.9);
  });
})();

async function upload(path, file, field){
  var s = await sb.auth.getSession();
  var token = s.data.session.access_token;
  var drop=$('drop_'+field), bar=drop.querySelector('.bar');
  var xhr=new XMLHttpRequest();
  xhr.open('POST', SUPABASE_URL+'/storage/v1/object/'+BUCKET+'/'+path, true);
  xhr.setRequestHeader('Authorization','Bearer '+token);
  xhr.setRequestHeader('apikey', SUPABASE_ANON_KEY);
  xhr.setRequestHeader('x-upsert','true');
  xhr.setRequestHeader('Content-Type', file.type||'application/octet-stream');
  xhr.upload.onprogress=function(e){ if(e.lengthComputable) bar.style.width=Math.round(e.loaded/e.total*100)+'%'; };
  xhr.onload=async function(){
    if(xhr.status>=200 && xhr.status<300){
      var old=P[field];
      var upd={}; upd[field]=path;
      var r=await sb.from('coach_profiles').update(upd).eq('coach_id',USER.id).select().single();
      if(r.error){ toast('Se subió pero no se guardó: '+r.error.message,true); return; }
      if(old) sb.storage.from(BUCKET).remove([old]);
      if(field==='photo_path'){
        // la misma foto pasa a ser el avatar de la cuenta (header de todas las páginas)
        try{ await sb.auth.updateUser({ data:{ avatar_url: pubUrl(path) } }); }catch(e){}
        var av=$('navAvatar'); if(av) av.innerHTML='<img src="'+esc(pubUrl(path))+'" alt="">';
      }
      var keepDirty=DIRTY, snapshot=keepDirty?collect():null;
      P=r.data;
      if(keepDirty){ Object.keys(snapshot).forEach(function(k){ if(k.indexOf('_path')<0) P[k]=snapshot[k]; }); }
      render(); if(keepDirty) markDirty();
      toast('Archivo subido');
    } else {
      bar.style.width='0';
      var m=''; try{ m=JSON.parse(xhr.responseText).message; }catch(e){}
      toast('Error al subir'+(m?': '+m:'')+(xhr.status===400||xhr.status===404?' · ¿corriste coach_hub_vitrina_v3_storage.sql?':''),true);
    }
  };
  xhr.onerror=function(){ bar.style.width='0'; toast('Se cortó la conexión al subir',true); };
  xhr.send(file);
}

async function clearMedia(field){
  if(!confirm('¿Quitar este archivo?')) return;
  var old=P[field], upd={}; upd[field]=null;
  var r=await sb.from('coach_profiles').update(upd).eq('coach_id',USER.id).select().single();
  if(r.error){ toast(r.error.message,true); return; }

  if(keepDirty){ Object.keys(snapshot).forEach(function(k){ if(k.indexOf('_path')<0) P[k]=snapshot[k]; }); }
  render(); if(keepDirty) markDirty();
}

  var d = {
    coach_id: USER.id, kind:k, title:title, description:$('o_desc').value.trim(), price:price, currency:cur,
    analyses_included: k==='analisis' ? 1 : Math.max(1, parseInt($('o_n').value,10)||1),
    duration_days: k==='plan_mensual' ? (parseInt($('o_days').value,10)||30) : null,
    is_trial: trial, max_videos: maxv,
    capture_requirements: {angulos:angles, swings_por_angulo:swings, palo:$('o_club').value, nota:$('o_note').value.trim()}
  };
  if(EDIT_OFFER) d.is_active = $('o_active').checked; else d.sort_order = OFFERS.length;
  var r = EDIT_OFFER
    ? await sb.from('coach_offerings').update(d).eq('id',EDIT_OFFER.id).select().single()
    : await sb.from('coach_offerings').insert(d).select().single();
  if(r.error){ toast('No se pudo guardar: '+r.error.message,true); return; }
  closeOffer(); await loadOffers(); renderOffers(); renderChecklist(); toast('Oferta guardada');
}
async function deleteOffer(){
  if(!EDIT_OFFER || !confirm('¿Eliminar esta oferta?')) return;
  var r = await sb.from('coach_offerings').delete().eq('id',EDIT_OFFER.id);
  if(r.error){
    // si ya tiene compras, no se puede borrar: se pausa
    await sb.from('coach_offerings').update({is_active:false}).eq('id',EDIT_OFFER.id);
    toast('Esta oferta ya tiene compras, así que quedó pausada en vez de eliminada');
  } else toast('Oferta eliminada');
  closeOffer(); await loadOffers(); renderOffers(); renderChecklist();
}
$('offerModal').addEventListener('click',function(e){ if(e.target===this) closeOffer(); });

window.addEventListener('beforeunload',function(e){ if(DIRTY){ e.preventDefault(); e.returnValue=''; } });

// menú hamburguesa (mobile)
(function(){
  var btn=$('hamburgerBtn'), nav=$('navLinks');
  function set(open){ btn.classList.toggle('open',open); nav.classList.toggle('mobile-open',open); }
  btn.addEventListener('click',function(e){ e.stopPropagation(); set(!nav.classList.contains('mobile-open')); });
  document.addEventListener('click',function(e){ if(nav.classList.contains('mobile-open') && !nav.contains(e.target)) set(false); });
})();

init();
</script>
