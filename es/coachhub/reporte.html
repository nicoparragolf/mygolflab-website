<style>
  :root{
    --bg:var(--c0a0a0a,#0a0a0a); --bg2:var(--c111111,#111); --card:var(--c141414,#141414); --card2:var(--c1a1a1a,#1a1a1a);
    --border:var(--c262626,#262626); --border2:var(--c333333,#333);
    --teal:var(--cd4c5a9,#D4C5A9); --teal-dim:var(--c7d7259,#7D7259); --gold:var(--cf0b860,#F0B860);
    --text:var(--cf5f5f5,#f5f5f5); --muted:var(--c8a8a8a,#8a8a8a); --muted2:var(--c666666,#666);
    --red:var(--ce06a6a,#e06a6a); --green:var(--c8fd19e,#8fd19e); --blue:var(--c8fb8e0,#8fb8e0);
  }
  *{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
  body{background:var(--bg);color:var(--text);font-family:'Barlow',sans-serif;-webkit-font-smoothing:antialiased;min-height:100vh}
  a{color:inherit;text-decoration:none}
  button,textarea{font-family:inherit;color:inherit}
  html{scrollbar-width:thin;scrollbar-color:rgba(var(--r255_255_255,255,255,255),.09) var(--c0a0a0a,#0a0a0a)}
  ::-webkit-scrollbar{width:10px;height:10px}
  ::-webkit-scrollbar-track{background:var(--c0a0a0a,#0a0a0a)}
  ::-webkit-scrollbar-thumb{background:rgba(var(--r255_255_255,255,255,255),.09);border-radius:10px;border:3px solid var(--c0a0a0a,#0a0a0a)}

  /* header */
  #siteHeader{position:sticky;top:0;z-index:50;background:rgba(var(--r10_10_10,10,10,10),.88);backdrop-filter:blur(12px);border-bottom:1px solid var(--border);padding-top:env(safe-area-inset-top)}
  .nav-inner{max-width:1200px;margin:0 auto;padding:0 20px;height:62px;display:flex;align-items:center;gap:18px}
  .brand{font-family:'Bebas Neue',sans-serif;font-size:25px;letter-spacing:2px}
  .brand span{color:var(--teal)}
  .nav-links{display:flex;gap:20px;margin-left:auto}
  .nav-links a{font-family:'Barlow Condensed';font-size:16px;font-weight:500;color:var(--muted);text-transform:uppercase;letter-spacing:.5px;white-space:nowrap}
  .nav-links a:hover{color:var(--text)}
  .nav-links a.active{color:var(--teal)}
  .hamburger{display:none;flex-direction:column;gap:5px;background:none;border:none;cursor:pointer;padding:8px;margin-left:4px}
  .hamburger span{width:24px;height:2px;background:var(--text);transition:transform .2s,opacity .2s}
  .hamburger.open span:nth-child(1){transform:translateY(7px) rotate(45deg)}
  .hamburger.open span:nth-child(2){opacity:0}
  .hamburger.open span:nth-child(3){transform:translateY(-7px) rotate(-45deg)}
  .avatar{width:36px;height:36px;border-radius:50%;background:var(--teal-dim);display:flex;align-items:center;justify-content:center;font-family:'Barlow Condensed';font-weight:700;color:#1C1709;overflow:hidden;flex:0 0 auto}
  .avatar img{width:100%;height:100%;object-fit:cover}

  .wrap{max-width:1100px;margin:0 auto;padding:22px 20px calc(80px + env(safe-area-inset-bottom))}
  .back{display:inline-flex;align-items:center;gap:6px;font-family:'Barlow Condensed';font-size:14px;font-weight:700;letter-spacing:.6px;text-transform:uppercase;color:var(--muted)}
  .back:hover{color:var(--teal)}
  .back svg{width:16px;height:16px}
  .head{display:flex;align-items:flex-end;justify-content:space-between;gap:16px;flex-wrap:wrap;margin-top:10px}
  .head h1{font-family:'Bebas Neue';font-size:44px;letter-spacing:1px;line-height:1}
  .head p{color:var(--muted);margin-top:6px;font-size:15px}
  .month{display:flex;align-items:center;gap:6px;background:var(--card);border:1px solid var(--border);border-radius:14px;padding:5px}
  .month button{width:34px;height:34px;border-radius:10px;border:none;background:none;cursor:pointer;color:var(--text);display:flex;align-items:center;justify-content:center}
  .month button:hover:not(:disabled){background:var(--card2)}
  .month button:disabled{opacity:.25;cursor:default}
  .month button svg{width:18px;height:18px}
  .month b{font-family:'Barlow Condensed';font-size:16px;font-weight:700;letter-spacing:.6px;text-transform:uppercase;min-width:132px;text-align:center}

  .kpis{display:grid;grid-template-columns:repeat(4,1fr);gap:12px;margin-top:20px}
  .k{background:var(--card);border:1px solid var(--border);border-radius:16px;padding:16px}
  .k.main{background:linear-gradient(160deg,rgba(var(--r212_197_169,212,197,169),.13),var(--card) 70%);border-color:rgba(var(--r212_197_169,212,197,169),.35)}
  .k .n{font-family:'Bebas Neue';font-size:32px;letter-spacing:.5px;color:var(--teal);line-height:1}
  .k .l{font-family:'Barlow Condensed';font-size:12.5px;font-weight:600;letter-spacing:.7px;text-transform:uppercase;color:var(--muted);margin-top:5px}
  .k .sub{font-size:12.5px;color:var(--gold);margin-top:7px;line-height:1.35}

  .sec{font-family:'Barlow Condensed';font-size:14px;font-weight:700;letter-spacing:1px;text-transform:uppercase;color:var(--muted);margin:30px 0 10px}
  .panel{background:var(--card);border:1px solid var(--border);border-radius:16px;padding:18px}
  .chart{display:flex;align-items:flex-end;gap:10px;height:150px}
  .bar{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:flex-end;height:100%;cursor:pointer;min-width:0}
  .bar .v{font-size:11.5px;color:var(--muted);margin-bottom:5px;white-space:nowrap}
  .bar .b{width:100%;max-width:54px;border-radius:8px 8px 3px 3px;background:var(--c2b2619,#2B2619);min-height:4px;transition:background .2s}
  .bar.on .b{background:var(--teal)}
  .bar.on .v{color:var(--teal);font-weight:600}
  .bar .m{font-family:'Barlow Condensed';font-size:12.5px;font-weight:600;letter-spacing:.5px;text-transform:uppercase;color:var(--muted2);margin-top:6px}
  .bar.on .m{color:var(--text)}

  .tiers{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-top:12px}
  .tier{border:1px solid var(--border);border-radius:12px;padding:10px 12px;text-align:center}
  .tier.on{border-color:var(--teal);background:rgba(var(--r212_197_169,212,197,169),.08)}
  .tier b{display:block;font-family:'Bebas Neue';font-size:24px;color:var(--teal);line-height:1}
  .tier span{font-size:12.5px;color:var(--muted)}
  .note{color:var(--muted);font-size:13px;line-height:1.5;margin-top:12px}

  .tbl{width:100%;border-collapse:collapse;font-size:14px}
  .tbl th{font-family:'Barlow Condensed';font-size:12px;font-weight:700;letter-spacing:.7px;text-transform:uppercase;color:var(--muted2);text-align:left;padding:0 10px 10px;border-bottom:1px solid var(--border)}
  .tbl td{padding:12px 10px;border-bottom:1px solid var(--c1c1c1c,#1c1c1c);vertical-align:top}
  .tbl tr:last-child td{border-bottom:none}
  .tbl .r{text-align:right;white-space:nowrap}
  .tbl .who{font-weight:600}
  .tbl .what{color:var(--muted);font-size:13px;margin-top:2px}
  .tbl .pay{font-family:'Bebas Neue';font-size:20px;color:var(--teal);letter-spacing:.3px}
  .chip{display:inline-block;font-family:'Barlow Condensed';font-size:11px;font-weight:700;letter-spacing:.6px;text-transform:uppercase;border-radius:20px;padding:2px 8px;border:1px solid var(--border2);color:var(--muted)}
  .chip.cl{color:var(--teal);border-color:rgba(var(--r212_197_169,212,197,169),.4)}
  .chip.ct{color:var(--blue,#8fb8e0);border-color:rgba(var(--r143_184_224,143,184,224),.4)}
  .chip.ok{color:var(--green,#8fd19e);border-color:rgba(var(--r143_209_158,143,209,158),.4)}
  .chip.wait{color:var(--gold);border-color:rgba(var(--r240_184_96,240,184,96),.35)}
  .empty{text-align:center;color:var(--muted);padding:26px 10px;line-height:1.6}
  .empty a{color:var(--teal);text-decoration:underline}
  .loading{color:var(--muted);padding:60px 0;text-align:center}

  @media(max-width:900px){
    .nav-links{display:none}
    .nav-links.mobile-open{display:flex;flex-direction:column;gap:0;position:absolute;top:100%;left:0;right:0;background:rgba(var(--r10_10_10,10,10,10),.97);border-bottom:1px solid var(--border);padding:6px 20px 14px;margin:0}
    .nav-links.mobile-open a{padding:15px 0;font-size:19px;border-bottom:1px solid var(--border)}
    .nav-links.mobile-open a:last-child{border-bottom:none}
    .hamburger{display:flex}
    .nav-inner .avatar{margin-left:auto}
    .kpis{grid-template-columns:repeat(2,1fr)}
  }
  @media(max-width:620px){
    .head h1{font-size:38px}
    .head{align-items:stretch}
    .month{justify-content:space-between;width:100%}
    .kpis{gap:8px} .k{padding:13px} .k .n{font-size:26px}
    .chart{gap:6px;height:130px}
    .bar .v{font-size:10px}
    .tiers .tier b{font-size:20px}
    .tbl thead{display:none}
    .tbl tr{display:grid;grid-template-columns:1fr auto;gap:2px 10px;padding:12px 0;border-bottom:1px solid var(--c1c1c1c,#1c1c1c)}
    .tbl tr:last-child{border-bottom:none}
    .tbl td{padding:0;border:none}
    .tbl td.c-date{grid-column:1;color:var(--muted2);font-size:12px;order:1}
    .tbl td.c-st{grid-column:2;text-align:right;order:2}
    .tbl td.c-who{grid-column:1;order:3}
    .tbl td.c-pay{grid-column:2;order:4;align-self:center}
    .tbl td.c-base,.tbl td.c-com{grid-column:1 / -1;order:5;font-size:12.5px;color:var(--muted);text-align:left}
    .tbl td.c-base::before{content:'Precio: '} .tbl td.c-com::before{content:'Comisión: '}
  }
</style>
</head>
<body>

<header id="siteHeader">
  <div class="nav-inner">
    <a href="/es/coachhub/dashboard.html" class="brand">COACH<span>YARD</span></a><span class="brand-by">by MyGolfLab</span>
    <nav class="nav-links" id="navLinks"></nav>
    <a class="avatar" id="navAvatar" href="/es/coachhub/cuenta.html" title="Mi cuenta">?</a>
    <button class="hamburger" id="hamburgerBtn" aria-label="Menú"><span></span><span></span><span></span></button>
  </div>
</header>

<div class="wrap" id="wrap"><div class="loading">Cargando tu reporte…</div></div>

<script>
// ============================================================
// CoachYard · Mi reporte (solo coaches)
// Ganancias del mes: clases pagadas desde la vitrina y contenido vendido,
// comisión actual por tramo, historial de 6 meses y el detalle de cada pago.
// Sin template literals.
// ============================================================
var SUPABASE_URL = 'https://yulpqupmftdjbepqiscs.supabase.co';
var SUPABASE_ANON_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Inl1bHBxdXBtZnRkamJlcHFpc2NzIiwicm9sZSI6ImFub24iLCJpYXQiOjE3NzQxNDA0NjYsImV4cCI6MjA4OTcxNjQ2Nn0.e-8SEni5uxUoigXCkVM2VYm7UrHYxxVl7hPsUrZvYao';
var sb = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

var USER=null;
var ITEMS=[];   // {tipo:'clase'|'contenido', id, fecha, alumno, concepto, base, com_pct, com_clp, propio, recibes, liquidacion}
var PCONF={service_fee_pct:5, own_student_pct:0, tiers:[{hasta:30,pct:5},{hasta:60,pct:3},{hasta:null,pct:2}]};
var SEL=null;   // {y, m} mes elegido
var MES=['enero','febrero','marzo','abril','mayo','junio','julio','agosto','septiembre','octubre','noviembre','diciembre'];
var MES_C=['ene','feb','mar','abr','may','jun','jul','ago','sep','oct','nov','dic'];

function $(id){ return document.getElementById(id); }
function esc(s){ return String(s==null?'':s).replace(/[&<>"']/g,function(c){ return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]; }); }
function clp(n){ return MGL_PRECIO.fmtCLP(Math.round(Number(n)||0)); }
function pctTxt(p){ return String(Number(p)||0).replace('.',',')+'%'; }
function ym(d){ return d.getFullYear()*12+d.getMonth(); }
function corto(n){ n=Math.round(Number(n)||0); if(n>=1000000) return '$'+(n/1000000).toFixed(1).replace('.',',')+'M'; if(n>=1000) return '$'+Math.round(n/1000)+'k'; return '$'+n; }

function buildNav(){
  var items=[['/es/coachhub/dashboard.html','Dashboard'],['/es/coachhub/jugador.html','Mis jugadores'],['/es/coachhub/clases.html','Clases','clases'],['/es/coachhub/contenido.html','Contenido','contenido'],['/es/coachhub/mensajes.html','Mensajes','mensajes'],['/es/coachhub/analisis.html?from=dash','Analizar swing']];
  var h='';
  items.forEach(function(it){ h+='<a href="'+it[0]+'"'+(it[2]?' data-nav="'+it[2]+'"':'')+'>'+it[1]+'</a>'; });
  $('navLinks').innerHTML=h;
}

async function init(){
  var s = await sb.auth.getSession();
  if(!s.data.session){ window.location.href='/es/coachhub/entrar.html?volver='+encodeURIComponent('/es/coachhub/reporte.html'); return; }
  USER = s.data.session.user;
  var meta = USER.user_metadata||{};
  var av=$('navAvatar');
  if(meta.avatar_url || meta.picture) av.innerHTML='<img src="'+esc(meta.avatar_url||meta.picture)+'" alt="">';
  else av.textContent=(meta.first_name||meta.full_name||USER.email||'?').charAt(0).toUpperCase();

  var pr = await sb.from('profiles').select('role').eq('id',USER.id).maybeSingle();
  var role=(pr.data && pr.data.role) || 'jugador';
  if(role!=='coach' && role!=='ambos'){ window.location.href='/es/coachhub/cuenta.html'; return; }
  buildNav();

  var rs = await Promise.all([
    sb.from('mgl_pagos_config').select('*').eq('id',1).maybeSingle(),
    sb.from('coach_lessons').select('id,student_name,offering,paid_at,base_clp,amount_clp,commission_pct,commission_clp,coach_payout_clp,is_own_student,payout_status,payment_status')
      .eq('coach_id',USER.id).eq('payment_status','pagado').not('paid_at','is',null).order('paid_at',{ascending:false}).limit(2000),
    sb.from('content_purchases').select('id,student_name,title,paid_at,base_clp,amount_clp,commission_pct,commission_clp,coach_payout_clp,is_own_student,payout_status,status')
      .eq('coach_id',USER.id).eq('status','pagado').not('paid_at','is',null).order('paid_at',{ascending:false}).limit(2000)
  ]);
  if(rs[0].data) PCONF=rs[0].data;
  ITEMS=[];
  (rs[1].data||[]).forEach(function(l){
    ITEMS.push({ tipo:'clase', id:l.id, fecha:new Date(l.paid_at), alumno:l.student_name||'Alumno', concepto:(l.offering&&l.offering.title)||'Clase',
                 base:l.base_clp, com_pct:l.commission_pct, com_clp:l.commission_clp, propio:!!l.is_own_student, recibes:l.coach_payout_clp, liquidacion:l.payout_status });
  });
  (rs[2].data||[]).forEach(function(c){
    ITEMS.push({ tipo:'contenido', id:c.id, fecha:new Date(c.paid_at), alumno:c.student_name||'Alumno', concepto:c.title||'Colección',
                 base:c.base_clp, com_pct:c.commission_pct, com_clp:c.commission_clp, propio:!!c.is_own_student, recibes:c.coach_payout_clp, liquidacion:c.payout_status });
  });
  ITEMS.sort(function(a,b){ return b.fecha-a.fecha; });

  var now=new Date(); SEL={y:now.getFullYear(), m:now.getMonth()};
  var qm=new URLSearchParams(location.search).get('mes');   // ?mes=2026-10
  if(qm && /^\d{4}-\d{2}$/.test(qm)) SEL={y:+qm.slice(0,4), m:+qm.slice(5,7)-1};
  MGL_PRECIO.listo(render);
}

// Tramos de comisión: se cuentan las clases pagadas en el mes
function tierIdx(n){
  var t=PCONF.tiers||[];
  for(var i=0;i<t.length;i++){ if(t[i].hasta==null || n<=Number(t[i].hasta)) return i; }
  return t.length-1;
}
function nextTier(n){
  var t=PCONF.tiers||[];
  for(var i=0;i<t.length;i++){ if(t[i].hasta!=null && n<Number(t[i].hasta)+1 && t[i+1]) return {faltan:Number(t[i].hasta)+1-n, pct:Number(t[i+1].pct)}; }
  return null;
}

function inMonth(it,y,m){ return it.fecha.getFullYear()===y && it.fecha.getMonth()===m; }
function sum(a,f){ return a.reduce(function(s,x){ return s+(Number(x[f])||0); },0); }

function setMonth(delta){
  var d=new Date(SEL.y, SEL.m+delta, 1), now=new Date();
  if(ym(d)>ym(now)) return;
  SEL={y:d.getFullYear(), m:d.getMonth()};
  render();
}
function pickMonth(y,m){ SEL={y:y,m:m}; render(); }

function render(){
  var now=new Date(), esActual=(SEL.y===now.getFullYear() && SEL.m===now.getMonth());
  var mes=ITEMS.filter(function(it){ return inMonth(it,SEL.y,SEL.m); });
  var clases=mes.filter(function(x){ return x.tipo==='clase'; });
  var cont=mes.filter(function(x){ return x.tipo==='contenido'; });
  var ganado=sum(mes,'recibes'), porLiq=sum(mes.filter(function(x){ return x.liquidacion==='por_liquidar'; }),'recibes');
  var comTotal=sum(mes,'com_clp');
  var nTramo=clases.length;   // igual que el servidor (api/_pagos.js): todas las clases pagadas del mes
  var ti=tierIdx(nTramo+1), t=PCONF.tiers||[], pctAhora=t[ti]?Number(t[ti].pct):5, nx=nextTier(nTramo);
  var first=ITEMS.length ? ITEMS[ITEMS.length-1].fecha : now;
  var canPrev = ym(new Date(SEL.y,SEL.m,1)) > ym(first);

  var IC_L='<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M15 18l-6-6 6-6"/></svg>';
  var IC_R='<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M9 18l6-6-6-6"/></svg>';

  var h='<a class="back" href="/es/coachhub/cuenta.html">'+IC_L+'<span>Mi cuenta</span></a>'
    + '<div class="head"><div><h1>Mi reporte</h1><p>Lo que ganas en CoachYard con clases de tu vitrina y contenido.</p></div>'
    + '<div class="month"><button onclick="setMonth(-1)" aria-label="Mes anterior"'+(canPrev?'':' disabled')+'>'+IC_L+'</button>'
    + '<b>'+MES[SEL.m]+' '+SEL.y+'</b>'
    + '<button onclick="setMonth(1)" aria-label="Mes siguiente"'+(esActual?' disabled':'')+'>'+IC_R+'</button></div></div>';

  // ── Números del mes ──
  h+='<div class="kpis">'
    + '<div class="k main"><div class="n">'+clp(ganado)+'</div><div class="l">'+(esActual?'Ganado este mes':'Ganado en el mes')+'</div>'
    +   (porLiq ? '<div class="sub"><span>'+clp(porLiq)+'</span> <span>por liquidar a fin de mes</span></div>' : (ganado?'<div class="sub">Todo liquidado</div>':''))+'</div>'
    + '<div class="k"><div class="n">'+clases.length+'</div><div class="l">Clases pagadas</div></div>'
    + '<div class="k"><div class="n">'+cont.length+'</div><div class="l">Contenido vendido</div></div>'
    + (esActual
      ? '<div class="k"><div class="n">'+pctTxt(pctAhora)+'</div><div class="l">Tu comisión ahora</div>'
        + (nx ? '<div class="sub">Te faltan '+nx.faltan+' clase'+(nx.faltan===1?'':'s')+' para bajar a '+pctTxt(nx.pct)+'</div>' : '<div class="sub">Estás en la comisión más baja</div>')+'</div>'
      : '<div class="k"><div class="n">'+clp(comTotal)+'</div><div class="l">Comisión pagada</div></div>')
    + '</div>';

  // ── Últimos 6 meses ──
  var bars=[], maxV=0;
  for(var i=5;i>=0;i--){
    var d=new Date(SEL.y, SEL.m-i, 1);
    var v=sum(ITEMS.filter(function(it){ return inMonth(it,d.getFullYear(),d.getMonth()); }),'recibes');
    bars.push({y:d.getFullYear(), m:d.getMonth(), v:v}); if(v>maxV) maxV=v;
  }
  h+='<div class="sec">Últimos 6 meses</div><div class="panel"><div class="chart">';
  bars.forEach(function(b){
    var hp = maxV ? Math.max(3, Math.round(b.v/maxV*100)) : 3;
    var futuro = ym(new Date(b.y,b.m,1))>ym(now);
    h+='<div class="bar'+(b.y===SEL.y&&b.m===SEL.m?' on':'')+'"'+(futuro?'':' onclick="pickMonth('+b.y+','+b.m+')"')+'>'
      + '<div class="v">'+(b.v?corto(b.v):'')+'</div><div class="b" style="height:'+hp+'%"></div><div class="m">'+MES_C[b.m]+'</div></div>';
  });
  h+='</div></div>';

  // ── Comisión por tramos ──
  h+='<div class="sec">Cómo funciona tu comisión</div><div class="panel">'
    + '<div style="font-size:14.5px;line-height:1.5">Mientras más clases te pagan en el mes, menor es la comisión de CoachYard'
    + (esActual ? '. Este mes llevas <b>'+nTramo+'</b> clase'+(nTramo===1?'':'s')+' que cuentan para el tramo.' : '.')+'</div>'
    + '<div class="tiers">';
  var desde=1;
  t.forEach(function(x,i){
    var rango = x.hasta==null ? (desde+' o más') : (desde+' a '+x.hasta);
    h+='<div class="tier'+(esActual&&i===ti?' on':'')+'"><b>'+pctTxt(x.pct)+'</b><span>'+rango+' clases</span></div>';
    if(x.hasta!=null) desde=Number(x.hasta)+1;
  });
  h+='</div><div class="note">Con alumnos que ya eran tuyos antes de CoachYard no pagas comisión ('+pctTxt(PCONF.own_student_pct||0)+'). El tramo vuelve a partir el día 1 de cada mes. Lo que ganas se liquida a fin de mes.</div></div>';

  // ── Detalle ──
  h+='<div class="sec">Detalle de '+MES[SEL.m]+'</div><div class="panel">';
  if(!mes.length){
    h+='<div class="empty">'+(ITEMS.length ? 'No tuviste ventas este mes.' : 'Todavía no tienes ventas.<br>Cuando un alumno pague una clase de tu vitrina o compre tu contenido, lo verás aquí con el detalle de lo que recibes.<br><br><a href="/es/coachhub/vitrina.html#ofertas">Revisar mis ofertas</a>')+'</div>';
  } else {
    h+='<table class="tbl"><thead><tr><th>Fecha</th><th>Alumno</th><th class="r">Precio</th><th class="r">Comisión</th><th class="r">Recibes</th><th class="r">Estado</th></tr></thead><tbody>';
    mes.forEach(function(it){
      var com = it.propio ? '<span>Alumno tuyo</span> · $0' : pctTxt(it.com_pct)+' · '+clp(it.com_clp);
      h+='<tr>'
        + '<td class="c-date">'+it.fecha.getDate()+' '+MES_C[it.fecha.getMonth()]+'</td>'
        + '<td class="c-who"><div class="who" translate="no">'+esc(it.alumno)+'</div><div class="what"><span class="chip '+(it.tipo==='clase'?'cl':'ct')+'">'+(it.tipo==='clase'?'Clase':'Contenido')+'</span> <span translate="no">'+esc(it.concepto)+'</span></div></td>'
        + '<td class="r c-base">'+clp(it.base)+'</td>'
        + '<td class="r c-com">'+com+'</td>'
        + '<td class="r c-pay"><span class="pay">'+clp(it.recibes)+'</span></td>'
        + '<td class="r c-st">'+(it.liquidacion==='liquidado'?'<span class="chip ok">Liquidado</span>':'<span class="chip wait">Por liquidar</span>')+'</td>'
        + '</tr>';
    });
    h+='</tbody></table>';
  }
  h+='</div>';
  $('wrap').innerHTML=h;
}

// Menú mobile
(function(){
  var btn=$('hamburgerBtn'), nav=$('navLinks');
  function set(open){ btn.classList.toggle('open',open); nav.classList.toggle('mobile-open',open); }
  btn.addEventListener('click',function(e){ e.stopPropagation(); set(!nav.classList.contains('mobile-open')); });
  nav.addEventListener('click',function(e){ if(e.target.tagName==='A') set(false); });
  document.addEventListener('click',function(e){ if(nav.classList.contains('mobile-open') && !nav.contains(e.target)) set(false); });
  window.addEventListener('resize',function(){ if(window.innerWidth>900) set(false); });
})();

init();
</script>
