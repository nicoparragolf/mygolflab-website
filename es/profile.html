<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Mi Perfil — MyGolfLab</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Barlow+Condensed:wght@300;400;500;600;700&family=Barlow:wght@300;400;500&display=swap" rel="stylesheet">
<style>
  *, *::before, *::after { box-sizing:border-box; margin:0; padding:0; }
  :root {
    --bg:#0a0a0a; --bg-card:#111111; --bg-elevated:#1a1a1a;
    --teal:#2dd4bf; --teal-dim:rgba(45,212,191,0.12); --teal-mid:rgba(45,212,191,0.35);
    --gold:#D4C5A9; --text:#f0f0f0; --text-muted:#888;
    --border:rgba(255,255,255,0.07); --border-mid:rgba(255,255,255,0.12);
    --nav-height:68px; --ok:#22c55e; --severo:#ef4444;
  }
  html { scroll-behavior:smooth; }
  body { font-family:'Barlow',sans-serif; background:var(--bg); color:var(--text);
    overflow-x:hidden; padding-top:var(--nav-height); }
  body::before { content:''; position:fixed; inset:0; pointer-events:none; z-index:9999; opacity:.4;
    background-image:url("data:image/svg+xml,%3Csvg viewBox='0 0 256 256' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='n'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.9' numOctaves='4' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23n)' opacity='0.04'/%3E%3C/svg%3E"); }

  header { position:fixed; top:0; left:0; right:0; z-index:1000; height:var(--nav-height);
    display:grid; grid-template-columns:1fr auto 1fr; align-items:center; column-gap:24px;
    padding:0 32px; background:rgba(10,10,10,.9); backdrop-filter:blur(20px);
    -webkit-backdrop-filter:blur(20px); border-bottom:1px solid var(--border); }
  .logo { grid-column:1; justify-self:start; font-family:'Bebas Neue',sans-serif; font-size:26px;
    letter-spacing:.06em; color:var(--text); text-decoration:none; }
  .logo span { color:var(--teal); }
  .nav-collapse { display:contents; }
  .nav-links { grid-column:2; justify-self:center; display:flex; align-items:center; gap:30px; list-style:none; }
  .nav-links a { font-family:'Barlow Condensed',sans-serif; font-size:15px; font-weight:600;
    letter-spacing:.04em; text-transform:uppercase; color:var(--text-muted); text-decoration:none; transition:color .2s; }
  .nav-links a:hover { color:var(--text); }
  .nav-auth { grid-column:3; justify-self:end; display:flex; align-items:center; gap:12px; }
  .nav-avatar { width:36px; height:36px; border-radius:50%; overflow:hidden; border:1px solid var(--border-mid);
    display:flex; align-items:center; justify-content:center; background:var(--teal-dim); }
  .nav-avatar img { width:100%; height:100%; object-fit:cover; display:block; }
  .nav-avatar-initials { font-family:'Barlow Condensed',sans-serif; font-size:13px; font-weight:700; color:var(--teal); }
  .btn-outline, .btn-primary { display:inline-flex; align-items:center; justify-content:center;
    padding:9px 18px; border-radius:8px; font-family:'Barlow Condensed',sans-serif; font-size:14px;
    font-weight:600; letter-spacing:.04em; text-transform:uppercase; text-decoration:none;
    transition:all .2s; cursor:pointer; white-space:nowrap; }
  .btn-outline { color:var(--text); border:1px solid var(--border-mid); background:none; }
  .btn-outline:hover { border-color:var(--text-muted); }
  .btn-primary { color:#0a0a0a; background:var(--teal); border:1px solid var(--teal); }
  .btn-primary:hover { background:#4ee0cf; }
  .hamburger { grid-column:3; justify-self:end; display:none; width:40px; height:40px;
    flex-direction:column; align-items:center; justify-content:center; gap:5px; cursor:pointer;
    background:none; border:none; }
  .hamburger span { display:block; width:24px; height:2px; background:var(--text); border-radius:2px; transition:all .3s; }
  .hamburger.active span:nth-child(1){transform:translateY(7px) rotate(45deg)}
  .hamburger.active span:nth-child(2){opacity:0}
  .hamburger.active span:nth-child(3){transform:translateY(-7px) rotate(-45deg)}
  @media (max-width:880px){
    header{padding:0 20px} .hamburger{display:flex}
    .nav-collapse{display:flex;flex-direction:column;position:fixed;top:var(--nav-height);left:0;right:0;
      background:rgba(10,10,10,.98);backdrop-filter:blur(20px);border-bottom:1px solid transparent;
      padding:0 24px;max-height:0;overflow:hidden;transition:max-height .32s ease,padding .32s ease}
    header.menu-open .nav-collapse{max-height:85vh;padding:8px 24px 20px;border-bottom-color:var(--border)}
    .nav-links{flex-direction:column;align-items:stretch;gap:0}
    .nav-links a{padding:14px 2px}
    .nav-auth{flex-direction:column;align-items:stretch;gap:10px;padding-top:12px}
    .nav-auth .nav-avatar{align-self:flex-start}
  }

  .page-hero { max-width:760px; margin:0 auto; padding:56px 32px 28px; }
  .page-eyebrow { font-family:'Barlow Condensed',sans-serif; font-size:12px; font-weight:600;
    letter-spacing:4px; text-transform:uppercase; color:var(--teal);
    display:flex; align-items:center; gap:10px; margin-bottom:14px; }
  .page-eyebrow::before { content:''; display:block; width:24px; height:1px; background:var(--teal); }
  .page-title { font-family:'Bebas Neue',sans-serif; font-size:clamp(44px,6vw,72px);
    line-height:.95; letter-spacing:1px; margin-bottom:14px; }
  .page-title span { color:var(--teal); }
  .page-sub { font-size:16px; font-weight:300; color:var(--text-muted); line-height:1.75; max-width:58ch; }

  main { max-width:760px; margin:0 auto; padding:0 32px 70px; }

  .campo { background:var(--bg-card); border:1px solid var(--border); border-radius:16px;
    padding:26px 28px; margin-bottom:14px; transition:border-color .3s; }
  .campo.clave { border-color:var(--teal-mid); }
  .campo.falta { border-color:rgba(212,197,169,.4); }
  .campo-t { font-family:'Barlow Condensed',sans-serif; font-size:19px; font-weight:600;
    letter-spacing:.3px; margin-bottom:6px; display:flex; align-items:center; gap:10px; flex-wrap:wrap; }
  .etq { font-family:'Barlow Condensed',sans-serif; font-size:10px; font-weight:700;
    letter-spacing:2px; text-transform:uppercase; padding:3px 9px; border-radius:5px; }
  .etq.clave { background:var(--teal-dim); color:var(--teal); border:1px solid var(--teal-mid); }
  .etq.falta { background:rgba(212,197,169,.1); color:var(--gold); border:1px solid rgba(212,197,169,.3); }
  .campo-d { font-size:14px; font-weight:300; line-height:1.75; color:var(--text-muted); margin-bottom:18px; }
  .campo-d b { color:var(--text); font-weight:500; }

  .ops { display:flex; gap:10px; flex-wrap:wrap; }
  .op { flex:1; min-width:130px; padding:16px 18px; background:var(--bg-elevated);
    border:1px solid var(--border); border-radius:12px; cursor:pointer; text-align:left;
    transition:all .2s; font-family:'Barlow',sans-serif; color:var(--text); }
  .op:hover { border-color:var(--border-mid); }
  .op.on { border-color:var(--teal); background:rgba(45,212,191,.07); }
  .op .ot { font-family:'Barlow Condensed',sans-serif; font-size:16px; font-weight:600; letter-spacing:.3px; }
  .op .od { font-size:12.5px; color:var(--text-muted); margin-top:2px; }
  .op.on .ot { color:var(--teal); }

  input[type=number], select { background:var(--bg-elevated); border:1px solid var(--border);
    border-radius:10px; padding:14px 16px; color:var(--text); font-family:'Barlow',sans-serif;
    font-size:16px; outline:none; width:100%; max-width:240px; transition:border-color .2s; }
  input:focus, select:focus { border-color:var(--teal); }
  select option { background:var(--bg-card); }

  .guardar-barra { position:sticky; bottom:0; background:rgba(10,10,10,.94);
    backdrop-filter:blur(16px); border-top:1px solid var(--border); padding:18px 0 22px;
    margin-top:10px; display:flex; align-items:center; gap:16px; flex-wrap:wrap; z-index:50; }
  .btn-guardar { padding:15px 36px; border:none; border-radius:10px; background:var(--teal);
    color:#0a0a0a; font-family:'Barlow Condensed',sans-serif; font-size:16px; font-weight:700;
    letter-spacing:2px; text-transform:uppercase; cursor:pointer; transition:all .2s; }
  .btn-guardar:hover { background:#4eecd9; transform:translateY(-1px); }
  .btn-guardar:disabled { opacity:.5; cursor:wait; transform:none; }
  .msg { font-size:14px; line-height:1.6; flex:1; min-width:200px; color:var(--text-muted); }

  .aviso { background:var(--bg-card); border:1px solid var(--border-mid); border-left:3px solid var(--gold);
    border-radius:0 14px 14px 0; padding:20px 24px; margin-bottom:24px; font-size:14.5px;
    font-weight:300; line-height:1.75; color:var(--text-muted); }
  .aviso .t { font-family:'Barlow Condensed',sans-serif; font-size:12px; font-weight:700;
    letter-spacing:3px; text-transform:uppercase; color:var(--gold); margin-bottom:6px; }
  .aviso b { color:var(--text); font-weight:500; }

  .cargando { position:fixed; inset:0; background:var(--bg); display:flex; flex-direction:column;
    align-items:center; justify-content:center; gap:18px; z-index:5000; }
  .cargando.off { display:none; }
  .giro { width:34px; height:34px; border:2px solid var(--border); border-top-color:var(--teal);
    border-radius:50%; animation:giro .8s linear infinite; }
  @keyframes giro { to { transform:rotate(360deg); } }

  @media (max-width:600px){
    .page-hero{padding:40px 20px 22px} main{padding:0 20px 50px}
    .campo{padding:22px 20px} .op{min-width:100%}
  }
  @media (prefers-reduced-motion:reduce){ *{animation-duration:.001ms!important;transition-duration:.001ms!important} }
  :focus-visible { outline:2px solid var(--teal); outline-offset:2px; }
</style>
</head>
<body>

<div class="cargando" id="cargando"><div class="logo">MY<span>GOLF</span>LAB</div><div class="giro"></div></div>

<header id="siteHeader">
  <a href="/es/index.html" class="logo">MY<span>GOLF</span>LAB</a>
  <div class="nav-collapse">
    <ul class="nav-links">
      <li><a href="/es/index.html">Inicio</a></li>
      <li><a href="/es/coach-ai.html">Coach IA</a></li>
      <li><a href="/es/training.html">Training Lab</a></li>
      <li><a href="/es/library.html">Biblioteca</a></li>
      <li><a href="/es/pricing.html">Planes</a></li>
      <li><a href="/es/about.html">Quiénes Somos</a></li>
    </ul>
    <div class="nav-auth" id="header-auth">
      <a href="/es/login.html" class="btn-outline">Iniciar Sesión</a>
      <a href="/es/login.html" class="btn-primary">Únete</a>
    </div>
  </div>
  <button class="hamburger" id="hamburger" onclick="toggleMenu()" aria-label="Menú" aria-expanded="false">
    <span></span><span></span><span></span>
  </button>
</header>

<div class="page-hero">
  <div class="page-eyebrow">Mi cuenta</div>
  <h1 class="page-title">Mi <span>perfil</span></h1>
  <p class="page-sub">Estos datos los usa el Coach IA en cada análisis. Cuanto más precisos, más ajustado a ti va a ser el diagnóstico.</p>
</div>

<main id="app"></main>

<script>
/* ═══════════════════════════════════════════════════════════════════════════
   MyGolfLab · Mi perfil v1.0 · 2026-08-01
   Lee y guarda en la tabla profiles. Requiere haber corrido mgl-setup.sql.
   Para verla sin tocar tus datos:  ?demo=1
   ═══════════════════════════════════════════════════════════════════════════ */
'use strict';

var CONFIG = {
  SUPABASE_URL:'https://yulpqupmftdjbepqiscs.supabase.co',
  SUPABASE_ANON_KEY:'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Inl1bHBxdXBtZnRkamJlcHFpc2NzIiwicm9sZSI6ImFub24iLCJpYXQiOjE3NzQxNDA0NjYsImV4cCI6MjA4OTcxNjQ2Nn0.e-8SEni5uxUoigXCkVM2VYm7UrHYxxVl7hPsUrZvYao',
  RUTAS:{ dashboard:'/es/dashboard.html', logbook:'/es/logbook.html', coach:'/es/coach-ai.html',
    planes:'/es/pricing.html', login:'/es/login.html', inicio:'/es/index.html' }
};

var S = { sb:null, demo:false, sesion:null, nombre:'', avatar:'', plan:'basico',
          perfil:{}, tablaOK:false, cambios:{} };

function $(i){ return document.getElementById(i); }
function esc(s){ return String(s==null?'':s).replace(/[&<>"]/g,function(c){
  return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]; }); }
function iniciales(n){ return String(n||'').trim().split(/\s+/).filter(Boolean).slice(0,2)
  .map(function(w){ return w[0].toUpperCase(); }).join('') || 'MG'; }
function normPlan(p){ var x=String(p||'').trim().toLowerCase().normalize('NFD').replace(/[\u0300-\u036f]/g,'');
  return ['basico','pro','elite'].indexOf(x)>-1 ? x : 'basico'; }
function etiquetaPlan(p){ return p==='basico'?'Básico':p==='pro'?'Pro':'Elite'; }

/* ── Definición de los campos ── */
var CAMPOS = [
  { k:'mano_dominante', tipo:'botones', clave:true,
    titulo:'¿Con qué mano juegas?',
    desc:'Es el dato que más cambia tu análisis. En un video de frente, el mismo movimiento se lee como <b>slice</b> para un diestro y como <b>hook</b> para un zurdo. Sin este dato la IA no puede afirmar direcciones con seguridad.',
    ops:[ ['diestro','Diestro','La mano derecha va abajo en el grip'],
          ['zurdo','Zurdo','La mano izquierda va abajo en el grip'] ] },

  { k:'handicap', tipo:'numero',
    titulo:'Tu hándicap',
    desc:'Sirve para calibrar qué tan exigente es la corrección y con qué vocabulario te habla el coach. Si no tienes hándicap oficial, pon tu estimación.',
    min:-5, max:54, paso:0.1, placeholder:'18' },

  { k:'anos_jugando', tipo:'select',
    titulo:'¿Cuánto llevas jugando?',
    desc:'Un patrón de diez años cuesta más de cambiar que uno de seis meses. El coach ajusta las expectativas de plazo según esto.',
    ops:[ ['','Elige…'], ['<1','Menos de 1 año'], ['1-3','Entre 1 y 3 años'],
          ['3-10','Entre 3 y 10 años'], ['10+','Más de 10 años'] ] },

  { k:'objetivo', tipo:'select',
    titulo:'Tu objetivo principal',
    desc:'Define qué falla se prioriza cuando hay varias. Ganar distancia y ser consistente no llevan al mismo plan de trabajo.',
    ops:[ ['','Elige…'], ['bajar-handicap','Bajar mi hándicap'], ['mas-distancia','Ganar distancia'],
          ['consistencia','Ser más consistente'], ['corregir-falla','Corregir una falla puntual'],
          ['competir','Competir'] ] },

  { k:'frecuencia', tipo:'select',
    titulo:'¿Con qué frecuencia practicas?',
    desc:'Determina cuántos drills te recomienda por semana y cada cuánto conviene volver a medir tu swing.',
    ops:[ ['','Elige…'], ['1-semana','1 vez por semana'], ['2-3-semana','2 a 3 por semana'],
          ['4+-semana','4 o más por semana'], ['ocasional','Ocasional'] ] }
];

/* ── Carga ── */
async function cargar(){
  S.sb = window.supabase.createClient(CONFIG.SUPABASE_URL, CONFIG.SUPABASE_ANON_KEY);
  var ses = await S.sb.auth.getSession();
  S.sesion = ses.data.session;
  if(!S.sesion) return false;

  var uid = S.sesion.user.id, m = S.sesion.user.user_metadata || {};
  S.nombre = m.full_name || [m.first_name,m.last_name].filter(Boolean).join(' ') ||
             S.sesion.user.email.split('@')[0];
  S.avatar = m.avatar_url || m.picture || '';

  var r = await S.sb.from('profiles')
    .select('plan,mano_dominante,handicap,anos_jugando,objetivo,frecuencia,perfil_completo')
    .eq('id', uid).maybeSingle();

  if(r.error){
    S.tablaOK = false;
    var b = await S.sb.from('profiles').select('plan').eq('id', uid).maybeSingle();
    S.plan = normPlan(b.data && b.data.plan);
    console.warn('[MGL] La tabla profiles no tiene los campos nuevos:', r.error.message);
  } else {
    S.tablaOK = true;
    S.perfil = r.data || {};
    S.plan = normPlan(S.perfil.plan);
  }
  return true;
}

function valorDe(k){
  if(S.cambios[k] !== undefined) return S.cambios[k];
  var v = S.perfil[k];
  return (v === null || v === undefined) ? '' : v;
}
function faltantes(){
  return ['mano_dominante','handicap','objetivo'].filter(function(k){
    var v = valorDe(k);
    return v === '' || v === null || v === undefined;
  });
}

/* ── Render ── */
function render(){
  var h = '';

  if(!S.tablaOK){
    h += '<div class="aviso"><div class="t">Falta un paso</div>' +
      'La tabla <b>profiles</b> todavía no tiene los campos del perfil. ' +
      'Corre el archivo <b>mgl-setup.sql</b> en Supabase y recarga esta página.</div>';
    $('app').innerHTML = h;
    return;
  }

  var falt = faltantes();
  if(falt.length){
    h += '<div class="aviso"><div class="t">Perfil incompleto</div>' +
      'Faltan <b>' + falt.length + (falt.length===1?' campo':' campos') + '</b>. ' +
      (falt.indexOf('mano_dominante') > -1
        ? 'El más importante es la <b>mano dominante</b>: sin ese dato el coach evita hablar de direcciones, y pierdes la mitad del diagnóstico.'
        : 'Complétalos para que el análisis se ajuste mejor a tu juego.') + '</div>';
  }

  CAMPOS.forEach(function(c){
    var v = valorDe(c.k);
    var vacio = (v === '' || v === null || v === undefined);
    var cls = c.clave ? ' clave' : (vacio && ['handicap','objetivo'].indexOf(c.k) > -1 ? ' falta' : '');

    h += '<div class="campo' + cls + '"><div class="campo-t">' + c.titulo +
      (c.clave ? '<span class="etq clave">El más importante</span>' : '') +
      (vacio && !c.clave ? '<span class="etq falta">Sin completar</span>' : '') +
      '</div><div class="campo-d">' + c.desc + '</div>';

    if(c.tipo === 'botones'){
      h += '<div class="ops">' + c.ops.map(function(o){
        return '<button class="op' + (v===o[0]?' on':'') + '" data-k="' + c.k +
          '" data-v="' + o[0] + '"><span class="ot">' + o[1] + '</span>' +
          '<span class="od">' + o[2] + '</span></button>';
      }).join('') + '</div>';
    } else if(c.tipo === 'numero'){
      h += '<input type="number" id="f_' + c.k + '" data-k="' + c.k + '" min="' + c.min +
        '" max="' + c.max + '" step="' + c.paso + '" placeholder="' + c.placeholder +
        '" value="' + (v === '' ? '' : esc(v)) + '">';
    } else {
      h += '<select id="f_' + c.k + '" data-k="' + c.k + '">' + c.ops.map(function(o){
        return '<option value="' + esc(o[0]) + '"' + (String(v)===o[0]?' selected':'') + '>' +
               esc(o[1]) + '</option>';
      }).join('') + '</select>';
    }
    h += '</div>';
  });

  h += '<div class="guardar-barra">' +
    '<button class="btn-guardar" id="bGuardar">Guardar cambios</button>' +
    '<div class="msg" id="msg">' +
    (falt.length ? 'Te faltan ' + falt.length + (falt.length===1?' campo':' campos') + '.'
                 : 'Tu perfil está completo.') + '</div></div>';

  $('app').innerHTML = h;
  enlazar();
}

function enlazar(){
  document.querySelectorAll('.op').forEach(function(b){
    b.addEventListener('click', function(){
      var k = this.getAttribute('data-k'), v = this.getAttribute('data-v');
      S.cambios[k] = (valorDe(k) === v) ? '' : v;
      render();
    });
  });
  document.querySelectorAll('input[data-k], select[data-k]').forEach(function(el){
    el.addEventListener('change', function(){
      S.cambios[this.getAttribute('data-k')] = this.value;
      var m = $('msg');
      if(m){ m.textContent = 'Hay cambios sin guardar.'; m.style.color = 'var(--gold)'; }
    });
  });
  var g = $('bGuardar');
  if(g) g.addEventListener('click', guardar);
}

async function guardar(){
  var btn = $('bGuardar'), msg = $('msg');

  if(!valorDe('mano_dominante')){
    msg.innerHTML = 'La <b>mano dominante</b> es obligatoria: es el dato que más cambia tu análisis.';
    msg.style.color = 'var(--severo)';
    window.scrollTo({ top:0, behavior:'smooth' });
    return;
  }
  if(S.demo){
    msg.textContent = 'Modo demo: no se guarda nada.';
    msg.style.color = 'var(--text-muted)';
    return;
  }

  btn.disabled = true; btn.textContent = 'Guardando…';
  msg.textContent = ''; msg.style.color = 'var(--text-muted)';

  var fila = {};
  ['mano_dominante','anos_jugando','objetivo','frecuencia'].forEach(function(k){
    var v = valorDe(k);
    fila[k] = (v === '') ? null : v;
  });
  var h = valorDe('handicap');
  fila.handicap = (h === '' || h === null) ? null : Number(h);
  fila.perfil_completo = !!(fila.mano_dominante && fila.handicap !== null && fila.objetivo);
  fila.perfil_fecha = new Date().toISOString();

  try{
    var r = await S.sb.from('profiles').update(fila).eq('id', S.sesion.user.id);
    if(r.error) throw r.error;

    Object.keys(fila).forEach(function(k){ S.perfil[k] = fila[k]; });
    S.cambios = {};

    msg.innerHTML = 'Guardado. Tus próximos análisis van a usar estos datos. ' +
      '<a href="' + CONFIG.RUTAS.coach + '" style="color:var(--teal)">Analizar un swing →</a>';
    msg.style.color = 'var(--ok)';
    btn.disabled = false; btn.textContent = 'Guardar cambios';
    console.log('%c[MGL] Perfil guardado', 'color:#22c55e;font-weight:bold', fila);
    setTimeout(function(){ render(); $('msg').innerHTML = 'Cambios guardados.';
      $('msg').style.color = 'var(--ok)'; }, 1800);
  }catch(e){
    msg.textContent = 'No se pudo guardar: ' + (e.message || 'error desconocido');
    msg.style.color = 'var(--severo)';
    btn.disabled = false; btn.textContent = 'Guardar cambios';
    console.error('[MGL] Error guardando el perfil:', e);
  }
}

/* ── Barra superior ── */
function toggleMenu(){
  var h = $('siteHeader'), b = $('hamburger');
  var a = h.classList.toggle('menu-open');
  b.classList.toggle('active', a);
  b.setAttribute('aria-expanded', a ? 'true' : 'false');
}
window.toggleMenu = toggleMenu;

function pintarBarra(){
  var inner = S.avatar
    ? '<img src="' + esc(S.avatar) + '" alt="' + esc(S.nombre) + '">'
    : '<span class="nav-avatar-initials">' + iniciales(S.nombre) + '</span>';
  $('header-auth').innerHTML =
    '<span class="nav-avatar" title="' + esc(S.nombre) + '">' + inner + '</span>' +
    '<a href="' + CONFIG.RUTAS.dashboard + '" class="btn-outline">Mi Dashboard</a>' +
    '<a href="#" class="btn-primary" data-logout>Cerrar Sesión</a>';
  document.querySelectorAll('[data-logout]').forEach(function(b){
    b.addEventListener('click', async function(e){
      e.preventDefault();
      if(S.sb){ try{ await S.sb.auth.signOut(); }catch(x){} }
      window.location.href = CONFIG.RUTAS.inicio;
    });
  });
}

/* ── Demo ── */
function cargarDemo(q){
  S.demo = true; S.nombre = 'Gabriel Morgan'; S.plan = 'pro'; S.tablaOK = true;
  S.perfil = (q && q.get('vacio') === '1')
    ? { plan:'pro' }
    : { plan:'pro', mano_dominante:'diestro', handicap:18, anos_jugando:'3-10',
        objetivo:'bajar-handicap', frecuencia:'2-3-semana', perfil_completo:true };
}

/* ── Autotest ── */
function MGL_PROFILE_TEST(){
  var r = [];
  function t(n,ok,d){ r.push({ prueba:n, resultado: ok?'OK':'REVISAR', detalle:d }); }

  t('Sesión activa', S.demo || !!S.sesion, S.sesion ? S.sesion.user.email : (S.demo?'modo demo':'sin sesión'));
  t('Campos del perfil en profiles', S.tablaOK, S.tablaOK ? 'disponibles' : 'falta correr mgl-setup.sql');
  t('Campos dibujados', document.querySelectorAll('.campo').length === CAMPOS.length,
    document.querySelectorAll('.campo').length + ' de ' + CAMPOS.length);
  t('Mano dominante', !!valorDe('mano_dominante'), valorDe('mano_dominante') || 'sin completar');
  t('Hándicap', valorDe('handicap') !== '', valorDe('handicap') === '' ? 'sin completar' : valorDe('handicap'));
  t('Objetivo', !!valorDe('objetivo'), valorDe('objetivo') || 'sin completar');
  t('Perfil completo', faltantes().length === 0,
    faltantes().length ? 'faltan: ' + faltantes().join(', ') : 'sí');
  t('Botón de guardar', !!$('bGuardar'), '');

  console.log('%c MGL PROFILE v1.0 — AUTOTEST ','background:#2dd4bf;color:#0a0a0a;font-weight:bold');
  console.table(r);
  var mal = r.filter(function(x){ return x.resultado === 'REVISAR'; });
  if(!mal.length) console.log('%c Todo correcto. ','background:#22c55e;color:#04210e');
  else console.warn('Revisar: ' + mal.map(function(x){ return x.prueba; }).join(', '));
  return r;
}
window.MGL_PROFILE_TEST = MGL_PROFILE_TEST;
window.MGL = { estado:S, render:function(){ render(); }, test:MGL_PROFILE_TEST };

/* ── Arranque ── */
(async function(){
  var q = new URLSearchParams(window.location.search);

  if(q.get('demo') === '1'){
    cargarDemo(q); pintarBarra(); render();
    $('cargando').classList.add('off'); MGL_PROFILE_TEST(); return;
  }
  if(!window.supabase || !window.supabase.createClient){
    $('cargando').classList.add('off');
    $('app').innerHTML = '<div class="aviso"><div class="t">Sin conexión</div>' +
      'No se pudo descargar el cliente de Supabase. Revisa tu conexión y recarga.</div>';
    return;
  }
  try{
    var hay = await cargar();
    if(!hay){
      window.location.href = CONFIG.RUTAS.login + '?redirect=' +
        encodeURIComponent(window.location.pathname);
      return;
    }
    pintarBarra();
    render();
  }catch(e){
    $('app').innerHTML = '<div class="aviso"><div class="t">No se pudo cargar tu perfil</div>' +
      esc(e.message || 'Error desconocido') + '</div>';
    console.error('[MGL] Error cargando el perfil:', e);
  }
  $('cargando').classList.add('off');
  MGL_PROFILE_TEST();
})();
</script>
</body>
</html>
