# Capturas de prueba en tamaño iPad (solo para revisar el diseño). Corre al subir a ramas ipad-*
name: Capturas iPad (prueba)
on:
  push:
    branches: ['ipad-*']
  workflow_dispatch:
    inputs:
      base:
        description: 'Sitio a fotografiar'
        default: 'https://mygolflab.golf'
permissions:
  contents: write
jobs:
  capturas:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - run: |
          npm install --no-save --no-package-lock playwright@1
          npx playwright install --with-deps chromium
      - env:
          DEMO_PASSWORD: ${{ secrets.DEMO_PASSWORD }}
          BASE: ${{ inputs.base || vars.BASE_IPAD || 'https://mygolflab-gn57xzqtu-nicoparragolfs-projects.vercel.app' }}
        run: node .github/scripts/capturas-ipad.mjs
      - name: Guardar capturas en la rama capturas-ipad-out
        if: always()
        run: |
          cd capturas-ipad && git init -q && git checkout -q -b capturas-ipad-out
          git -c user.name=ci -c user.email=ci@local add -A && git -c user.name=ci -c user.email=ci@local commit -qm "capturas $GITHUB_SHA"
          git push -qf "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}" capturas-ipad-out
      - uses: actions/upload-artifact@v4
        if: always()
        with: { name: capturas-ipad, path: capturas-ipad/ }
